<style>
/* მამული: a board of Georgian regions, in მეტეხი's colours. Dark wood and gold around the board, parchment squares
   on it, the regions' colours on their bands. One world: the game is always dark. */
:root {
  color-scheme: dark;
  --ink: #0d1016; --ink-2: #131823; --panel: #171d2a; --panel-2: #1e2636; --panel-3: #273147;
  --wood: #4d311d; --wood-2: #2c1b10; --wood-3: #6b4527;
  --gold: #e8b44c; --gold-hi: #fff0bc; --gold-lo: #8d5f17;
  --cream: #fff4da; --text: #efe7d4; --muted: #a3aab6; --dim: #6f7785;
  --paper: #f3e3bf; --paper-2: #e6cd98; --paper-ink: #2c1b10; --paper-dim: #7a5a3a;
  --red: #e0574a; --green: #86d46e; --sky: #62b4f0;
  --line: rgba(232, 180, 76, .32); --line-2: rgba(255, 255, 255, .08); --line-3: rgba(255, 255, 255, .15);
  --f-display: 'Noto Serif Georgian', 'Sylfaen', Georgia, serif;
  --f-ui: 'Noto Sans Georgian', 'Sylfaen', system-ui, sans-serif;
  --f-num: 'Lilita One', 'Arial Rounded MT Bold', system-ui, sans-serif;
  --r: 14px;
}
html { height: 100%; box-sizing: border-box; background: var(--ink); }
[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: inherit; }
body { height: 100%; margin: 0; background: var(--ink); color: var(--text); font: 15px/1.45 var(--f-ui); overflow: hidden;
  -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; overscroll-behavior: none; }
input { -webkit-user-select: text; user-select: text; }
#app { height: 100%; position: relative; padding-inline: env(safe-area-inset-left, 0px) env(safe-area-inset-right, 0px); }
.screen { height: 100%; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 2px; }
img { max-width: 100%; }
.lbl { margin: 0 0 6px; font-size: 12px; letter-spacing: .04em; color: var(--muted); font-weight: 600; }
.hint { margin: 6px 0 0; font-size: 12.5px; color: var(--muted); line-height: 1.4; }
.row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.amt { font-family: var(--f-num); font-weight: 400; letter-spacing: .02em; white-space: nowrap; font-variant-numeric: tabular-nums; }
.ci { display: inline-block; width: 1.05em; height: 1.05em; margin-right: .2em; vertical-align: -.17em; background: url(art/ui_coin.webp) center / contain no-repeat; }
.bad { color: var(--red); }
.tag { display: inline-block; padding: 0 6px; border-radius: 99px; font-size: 10.5px; line-height: 17px; font-weight: 700; background: rgba(255, 255, 255, .1); color: var(--text); white-space: nowrap; }
.tag.me { background: var(--gold); color: var(--wood-2); }
.tag.warn { background: rgba(240, 180, 60, .25); color: #ffd98a; }
.tag.bad { background: rgba(224, 87, 74, .25); color: #ffb3a8; }

/* ----- buttons: wood with a gold edge, the main one gold ----- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 42px; padding: 8px 16px; border-radius: 12px;
  border: 1px solid var(--line); background: linear-gradient(180deg, var(--wood-3), var(--wood) 55%, var(--wood-2)); color: var(--cream);
  font-weight: 700; font-size: 14.5px; box-shadow: inset 0 1px 0 rgba(255, 240, 188, .18), 0 2px 0 rgba(0, 0, 0, .35); transition: transform .08s, filter .15s; }
.btn:active:not(:disabled) { transform: translateY(1px); filter: brightness(.95); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.gold { background: linear-gradient(180deg, var(--gold-hi), var(--gold) 45%, #c4892c); color: var(--wood-2); border-color: #8d5f17; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .5), 0 2px 0 #5c3c0e; }
.btn.danger { background: linear-gradient(180deg, #8c3027, #5e1d16); border-color: rgba(224, 87, 74, .5); }
.btn.ghost { background: transparent; box-shadow: none; }
.btn.wide { width: 100%; }
.btn.big { min-height: 52px; font-size: 17px; font-family: var(--f-display); font-weight: 900; }
.btn.small { min-height: 34px; padding: 5px 11px; font-size: 13px; border-radius: 10px; }
.ib { display: inline-grid; place-items: center; min-width: 34px; height: 34px; padding: 0 8px; border-radius: 10px; border: 1px solid var(--line-3);
  background: var(--panel-3); color: var(--text); font-weight: 700; font-size: 13px; }
.ib.gold { background: var(--gold); color: var(--wood-2); border-color: var(--gold-lo); }
.ib:disabled { opacity: .35; cursor: default; }
.link { background: none; border: 0; color: var(--gold); font-weight: 700; padding: 8px; text-decoration: underline; text-underline-offset: 3px; }

/* ----- the first screen ----- */
#scr-menu { position: relative; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.menu-bg { position: fixed; inset: 0; background: linear-gradient(180deg, rgba(13, 16, 22, .55), rgba(13, 16, 22, .82) 50%, var(--ink) 92%), url(art/g_svan.webp) center 30% / cover; }
.menu-wrap { position: relative; max-width: 460px; margin: 0 auto; padding: 22px 16px 28px; display: flex; flex-direction: column; gap: 14px; min-height: 100%; }
.logo { margin: 0; font: 900 clamp(48px, 15vw, 76px)/1 var(--f-display); color: var(--gold); text-align: center; letter-spacing: .01em;
  -webkit-text-stroke: 1.5px var(--wood-2); paint-order: stroke fill; text-shadow: 0 3px 0 var(--wood-2), 0 6px 18px rgba(0, 0, 0, .6); }
.tagline { margin: 6px 0 0; text-align: center; color: var(--cream); font-size: 14.5px; text-wrap: balance; text-shadow: 0 1px 6px rgba(0, 0, 0, .8); }
.menu-card { display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: 20px; border: 1px solid var(--line);
  background: linear-gradient(180deg, rgba(44, 27, 16, .92), rgba(23, 29, 42, .95)); box-shadow: 0 10px 40px rgba(0, 0, 0, .5); }
.me-hero { display: flex; align-items: center; gap: 12px; }
.me-hero img { width: 64px; height: 76px; object-fit: contain; filter: drop-shadow(0 4px 6px rgba(0, 0, 0, .5)); }
.me-hero b { font: 700 18px/1.25 var(--f-display); color: var(--cream); }
.hero-pick { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.hero { aspect-ratio: 1; padding: 0; border-radius: 50%; border: 2px solid transparent; background: var(--panel-2); overflow: hidden; }
.hero img { width: 100%; height: 100%; object-fit: cover; display: block; }
.hero.on { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(232, 180, 76, .3); }
.hero:disabled { opacity: .25; cursor: default; }
.field { display: block; }
.field input, .join input { width: 100%; height: 44px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--line-3); background: var(--ink-2);
  color: var(--cream); font: 600 16px var(--f-ui); }
.online { display: flex; flex-direction: column; gap: 8px; }
.join { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.join input { font: 400 22px var(--f-num); letter-spacing: .3em; text-transform: uppercase; text-align: center; }
.note { margin: 0; font-size: 13px; color: var(--muted); }
.note b { color: var(--gold-hi); }

/* ----- the lobby ----- */
#scr-lobby { overflow-y: auto; background: radial-gradient(120% 70% at 50% 0%, #2a1c12, var(--ink) 70%); }
.lobby-wrap { max-width: 520px; margin: 0 auto; padding: 14px 16px 28px; display: flex; flex-direction: column; gap: 16px; }
.lobby-top { display: flex; align-items: center; gap: 10px; }
.lobby-top h2 { margin: 0; font: 900 22px var(--f-display); color: var(--gold); }
.back { font-size: 22px; line-height: 1; }
.code-box { text-align: center; padding: 14px; border-radius: 18px; border: 1px solid var(--line); background: rgba(44, 27, 16, .6); }
.code { font: 400 46px/1.1 var(--f-num); letter-spacing: .25em; color: var(--gold-hi); text-shadow: 0 2px 0 var(--wood-2); padding-left: .25em; }
.code-box .row { margin-top: 10px; }
.seats { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.seat { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line-2); }
.seat.sel { border-color: var(--gold); }
.seat img { width: 44px; height: 44px; border-radius: 50%; box-shadow: 0 0 0 3px var(--c); flex: none; }
.seat > div { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.seat b { font-size: 15.5px; }
.seat small { color: var(--muted); font-size: 12px; }
.tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 2px; }
.seat.empty { justify-content: center; color: var(--dim); font-size: 13px; border-style: dashed; }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 4px; border-radius: 14px; background: var(--ink-2); border: 1px solid var(--line-2); }
.seg button { min-height: 38px; border: 0; border-radius: 10px; background: transparent; color: var(--muted); font-weight: 700; font-size: 13px; padding: 4px; }
.seg button.on { background: var(--gold); color: var(--wood-2); }
.seg button:disabled:not(.on) { opacity: .6; cursor: default; }
.lobby-acts { display: flex; flex-direction: column; gap: 10px; }
.waiting { text-align: center; color: var(--muted); margin: 0; }

/* ----- the game screen: a landscape with the board tilted on it like a table; players above, buttons below ----- */
#scr-game { overflow: hidden; }
.game { position: relative; isolation: isolate; height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto auto; grid-template-columns: minmax(0, 1fr); }
.scene { position: absolute; inset: 0; z-index: -1;
  background: linear-gradient(180deg, rgba(13, 16, 22, .82) 0, rgba(13, 16, 22, .3) 14%, rgba(13, 16, 22, 0) 30%, rgba(13, 16, 22, .1) 58%, rgba(13, 16, 22, .88) 82%, var(--ink) 100%),
    url(art/g_elbrus.webp) 50% 28% / cover; }
.hud { position: relative; z-index: 3; padding: 8px 8px 2px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.players { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 6px; }
.pl { position: relative; display: grid; grid-template-columns: 36px minmax(0, 1fr); grid-template-rows: auto auto; column-gap: 7px; align-items: center;
  padding: 3px 12px 3px 3px; border-radius: 99px; border: 1.5px solid rgba(232, 180, 76, .5); text-align: left; min-width: 0;
  background: linear-gradient(180deg, rgba(90, 58, 34, .96), rgba(44, 27, 16, .97)); box-shadow: inset 0 1px 0 rgba(255, 240, 188, .2), 0 3px 8px rgba(0, 0, 0, .5); }
.pl .pp { grid-row: 1 / 3; width: 36px; height: 36px; border-radius: 50%; box-shadow: 0 0 0 2px var(--c), 0 0 0 3.5px var(--gold-lo); }
.pl .pn { font-size: 12.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--cream); line-height: 1.2; }
.pl .pc { display: flex; align-items: center; gap: 4px; font-size: 15px; color: var(--gold-hi); line-height: 1.1; min-width: 0; }
.pl .pi { display: inline-flex; gap: 1px; }
.pl .pi img { width: 15px; height: 15px; object-fit: contain; }
.pl .pf { position: absolute; right: 8px; top: -8px; display: flex; }
.pl .pf .tag { font-size: 9.5px; line-height: 15px; padding: 0 6px; box-shadow: 0 0 0 2px var(--ink); }
.pl .pf .tag:not(.me):not(.warn) { background: #3a3f4c; }
.pl.now { border-color: var(--gold-hi); box-shadow: 0 0 0 1px var(--gold), 0 0 16px rgba(232, 180, 76, .55), 0 3px 8px rgba(0, 0, 0, .5); }
.pl.out { opacity: .45; filter: grayscale(1); }
.float { position: absolute; right: 10px; bottom: 2px; font: 400 15px var(--f-num); pointer-events: none; animation: floatUp 1.25s ease-out forwards; text-shadow: 0 1px 2px #000; }
.float.up { color: var(--green); } .float.down { color: #ff8a7a; }
@keyframes floatUp { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-26px); opacity: 0; } }
.round { text-align: center; font-size: 11.5px; color: #d5d9e0; letter-spacing: .03em; text-shadow: 0 1px 3px #000; }
/* no overflow clip here: Chrome clips 3D content wrongly under one (what stands beyond the board vanished in strips) */
.table { position: relative; min-height: 0; }
.stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; perspective: var(--persp, 1000px); perspective-origin: 50% 50%; }
.panel { position: relative; z-index: 3; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 6px; padding: 2px 14px 6px; text-align: center; }
.panel > :first-child { margin-top: auto; }
.panel > :last-child { margin-bottom: auto; }
.panel .status { font: 900 18px/1.25 var(--f-display); color: var(--cream); text-wrap: balance; text-shadow: 0 2px 6px rgba(0, 0, 0, .9); }
.panel .status b { color: var(--gold-hi); }
.panel .status small { display: block; font: 600 12.5px var(--f-ui); color: #c8ccd4; }
.panel .hint { margin: 0; max-width: 30em; color: #c8ccd4; text-shadow: 0 1px 3px #000; }
/* the square one may buy: a small parchment deed with the region's colour on top */
.mini-deed { display: flex; flex-direction: column; align-items: center; gap: 1px; max-width: 100%; padding: 4px 18px 6px; border-radius: 10px;
  border: 1px solid #8d5f17; border-top: 6px solid var(--g); background: linear-gradient(170deg, #fdf3da, #ead3a0); color: var(--paper-ink);
  box-shadow: 0 4px 14px rgba(0, 0, 0, .5); }
.mini-deed b { font: 900 17px/1.2 var(--f-display); }
.mini-deed span { font-size: 12px; font-weight: 600; color: var(--paper-dim); }
.panel .acts { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; }
.panel .acts:empty { display: none; }
.panel .btn.big { min-width: min(100%, 300px); }
.btn.roll { min-width: min(80%, 300px); min-height: 56px; border-radius: 99px; font: 900 20px var(--f-display); gap: 10px; padding: 6px 28px; }
.btn svg { width: 1.7em; height: 1.7em; flex: none; }
.btn.roll svg { width: 34px; height: 34px; }
.panel .last { list-style: none; margin: 2px 0 0; padding: 0; font-size: 12.5px; color: #aab0bb; max-width: 100%; }
.panel .last li { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.panel .last li:first-child { color: #dfe3ea; }
.dock { position: relative; z-index: 3; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 8px 10px 8px; border-top: 2px solid var(--gold-lo);
  background: linear-gradient(180deg, var(--wood-3), var(--wood) 35%, var(--wood-2)); box-shadow: 0 -4px 14px rgba(0, 0, 0, .5); }
.dock button { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 0; border: 0; background: none; color: var(--cream); font-size: 11px; font-weight: 700; }
.dock .rb { display: grid; place-items: center; width: 48px; height: 48px; border-radius: 50%; background: radial-gradient(circle at 50% 30%, #3b4254, #181d28 72%);
  box-shadow: 0 0 0 2px var(--gold), 0 0 0 4px var(--wood-2), 0 3px 8px rgba(0, 0, 0, .55); }
.dock .rb img { width: 32px; height: 32px; object-fit: contain; }
.dock button:disabled { opacity: .45; }
.dock button:active:not(:disabled) .rb { transform: translateY(1px); }
.dock .burger { display: grid; gap: 4px; width: 22px; align-content: center; }
.dock .burger i { height: 3px; border-radius: 2px; background: var(--gold); }
@media (orientation: landscape) and (min-width: 720px) {
  .game { grid-template-columns: minmax(0, 1fr) clamp(270px, 30vw, 380px); grid-template-rows: auto minmax(0, 1fr) auto; }
  .scene { background-position: 50% 40%; }
  .hud { grid-column: 2; grid-row: 1; max-height: 52vh; overflow-y: auto; padding: 12px 12px 6px 4px; }
  .players { grid-template-columns: 1fr; }
  .table { grid-column: 1; grid-row: 1 / 4; }
  .panel { grid-column: 2; grid-row: 2; padding: 8px 12px 8px 4px; }
  .dock { grid-column: 2; grid-row: 3; margin: 0 12px 12px 4px; border-radius: 18px; border: 2px solid var(--gold-lo); }
}
@media (orientation: landscape) and (min-width: 720px) and (max-height: 540px) {
  .hud { padding-top: 8px; gap: 2px; }
  .players { gap: 4px; grid-template-columns: 1fr 1fr; }
  .pl { grid-template-columns: 28px minmax(0, 1fr); }
  .pl .pp { width: 28px; height: 28px; }
  .pl .pn { font-size: 12px; } .pl .pc { font-size: 13.5px; }
  .panel { gap: 5px; padding-top: 4px; padding-bottom: 4px; }
  .panel .status { font-size: 16px; }
  .btn.roll { min-height: 46px; font-size: 17px; }
  .panel .last li:nth-child(n+3) { display: none; }
  .dock { padding: 5px 6px; }
  .dock .rb { width: 38px; height: 38px; } .dock .rb img { width: 26px; height: 26px; }
  .dock button { font-size: 10px; }
}

/* ----- the board: a stone slab tilted back, parchment squares on it ----- */
.board { --bs: 340px; --tilt: 34deg; --tw: calc(var(--bs) / 11.75); position: relative; flex: none; width: var(--bs); height: var(--bs);
  display: grid; grid-template-columns: 1.33fr repeat(9, 1fr) 1.33fr; grid-template-rows: 1.33fr repeat(9, 1fr) 1.33fr; gap: 2px;
  padding: calc(var(--tw) * .16); border-radius: calc(var(--tw) * .3);
  background: linear-gradient(135deg, #9a8466, #78644b 40%, #5a4a37); box-shadow: inset 0 0 0 2px rgba(255, 240, 188, .3), inset 0 0 0 calc(var(--tw) * .12) rgba(44, 27, 16, .3);
  transform: translateY(var(--shift, 0px)) rotateX(var(--tilt)); transform-style: preserve-3d; }
.rim { position: absolute; pointer-events: none; background: linear-gradient(180deg, #5d4c39, #2f251b); }
.rim-f { left: 0; right: 0; top: 100%; height: calc(var(--tw) * .5); transform-origin: 50% 0; transform: rotateX(-90deg); border-radius: 0 0 8px 8px; }
.rim-l { top: 0; bottom: 0; right: 100%; width: calc(var(--tw) * .5); transform-origin: 100% 50%; transform: rotateY(90deg); }
.rim-r { top: 0; bottom: 0; left: 100%; width: calc(var(--tw) * .5); transform-origin: 0 50%; transform: rotateY(-90deg); }
.tile { position: relative; overflow: hidden; display: block; padding: 0; border: 0; border-radius: 3px; min-width: 0; min-height: 0; color: var(--paper-ink);
  background: linear-gradient(150deg, #fdf3da, #ecd8a8); box-shadow: inset 0 0 0 1px rgba(44, 27, 16, .3), inset 0 -2px 0 rgba(120, 90, 50, .22); }
.tile:active { filter: brightness(.93); }
.tile .band { position: absolute; background: var(--g); box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .16); }
.tile .ico { position: absolute; background: center / contain no-repeat; }
.tile .ico.svg svg { width: 100%; height: 100%; display: block; }
.tile .tp { position: absolute; font: 400 clamp(6.5px, calc(var(--tw) * .26), 15px)/1 var(--f-num); color: #6b4a2c; white-space: nowrap; }
.tile .tn { display: none; }
.tile .own { position: absolute; display: none; background: var(--o); box-shadow: 0 0 0 1px rgba(0, 0, 0, .3); }
.tile.owned .own { display: block; }
.tile.owned { box-shadow: inset 0 0 0 1.5px var(--o), inset 0 -2px 0 rgba(120, 90, 50, .22); }
.tile .hatch { position: absolute; inset: 0; display: none; background: repeating-linear-gradient(135deg, transparent 0 4px, rgba(44, 27, 16, .3) 4px 6px); pointer-events: none; }
.tile.mort .hatch { display: block; }
.tile.mort { background: #dcc493; }
/* each side: the band towards the middle, the price and owner's strip at the outer edge */
.tile.s-b .band { left: 0; right: 0; top: 0; height: 20%; }
.tile.s-b .ico { left: 8%; right: 8%; top: 24%; bottom: 30%; }
.tile.s-b .tp { left: 0; right: 0; bottom: 12%; text-align: center; }

// ===== the rules =====
// The whole game is one plain object (the state). act() checks that a move is allowed, changes the state and adds
// events (what happened, for the screens to animate and for the log). Only the host's browser runs it; everyone else
// receives copies of the state. Everything here is deterministic given the random function passed in.

const Engine = (() => {
  const FEATHER = { s: CARDS.s.findIndex(c => c.k === 'feather'), c: CARDS.c.findIndex(c => c.k === 'feather') };

  function mulberry(seed) {
    let a = seed >>> 0;
    return () => {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function shuffle(a, rnd) {
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }

  // ----- the lobby -----
  function newLobby(hostPid) {
    return {
      v: 1, term: 0, seq: 0, phase: 'lobby', host: hostPid,
      cfg: { mode: 'rounds', rounds: 30 },
      players: [], own: BOARD.map(() => null), turn: 0, round: 1,
      dice: [3, 4], rolls: 0, again: false, pend: null, trade: null,
      decks: { s: [], c: [] }, ev: [], evn: 0, winner: -1, tn: 0, offered: -1, memo: []
    };
  }
  const seatOf = (st, pid) => st.players.findIndex(p => p.pid === pid);
  const cleanName = s => String(s == null ? '' : s).replace(/[\u0000-\u001f<>&"]/g, '').trim().slice(0, 16);
  const freeHero = (st, pref) => {
    const used = new Set(st.players.map(p => p.hero));
    if (pref && HEROES[pref] && !used.has(pref)) return pref;
    return HERO_KEYS.find(h => !used.has(h)) || HERO_KEYS[0];
  };
  function newPlayer(pid, name, hero, bot) {
    return { pid, name, hero, bot: !!bot, cash: START_CASH, pos: 0, jail: false, jt: 0, fe: [], out: false, outAt: 0, dbl: 0, away: false };
  }
  // someone knocks: a newcomer gets a seat while there is one; a returning player is simply back
  function lobbyJoin(st, pid, name, hero) {
    const s = seatOf(st, pid);
    if (s >= 0) { st.players[s].away = false; return s; }
    if (st.phase !== 'lobby') return -1;                 // the game is on: watchers only
    if (st.players.length >= MAX_PLAYERS) return -2;
    const h = freeHero(st, hero);
    st.players.push(newPlayer(pid, cleanName(name) || HEROES[h].s, h, false));
    return st.players.length - 1;
  }
  function lobbyAct(st, pid, a, rnd) {
    if (st.phase !== 'lobby') return 'started';
    const s = seatOf(st, pid), host = pid === st.host;
    switch (a && a.t) {
      case 'hero': {
        if (s < 0 || !HEROES[a.h]) return 'bad';
        if (st.players.some((p, i) => i !== s && p.hero === a.h)) return 'taken';
        st.players[s].hero = a.h; return '';
      }
      case 'name': if (s < 0) return 'bad'; st.players[s].name = cleanName(a.n) || HEROES[st.players[s].hero].s; return '';
      case 'addbot': {
        if (!host) return 'host';
        if (st.players.length >= MAX_PLAYERS) return 'full';
        const h = freeHero(st, null);
        st.players.push(newPlayer('bot-' + Math.floor(rnd() * 1e9).toString(36), HEROES[h].s, h, true));
        return '';
      }
      case 'kick': {
        const k = a.s | 0, p = st.players[k];
        if (!p) return 'bad';
        if (!(host || p.pid === pid) || p.pid === st.host) return 'host';   // the host cannot be removed; anyone can leave
        st.players.splice(k, 1); return '';
      }
      case 'cfg': {

// ----- who is here -----
function onPeers(peers) {
  ROOM.peers = peers;
  const st = ROOM.st;
  if (ROOM.role === 'guest' && ROOM.hostPid && peers[ROOM.hostPid]) ROOM.heardHost = now();
  if (ROOM.role === 'host' && st) {
    for (const p of st.players) if (!p.bot && p.pid !== ROOM.me) {
      if (peers[p.pid]) { ROOM.missing[p.pid] = 0; if (p.away) markAway(p.pid, false); }
      else if (!ROOM.missing[p.pid]) ROOM.missing[p.pid] = now();
    }
  }
  View.peers();
}
function onStatus(up) {
  ROOM.up = up;
  if (up && ROOM.role === 'host' && ROOM.st) send('st', { p: PROTO, st: ROOM.st });
  if (up && ROOM.role === 'guest' && ROOM.st) send('hello', { name: PROFILE.name, hero: PROFILE.hero, p: PROTO }, ROOM.hostPid || undefined);
  View.peers();
}

  const st = ROOM.st, s = Engine.seatOf(st, pid);
  if (s < 0 || st.players[s].bot || st.players[s].away === away) return;
  if (st.phase === 'lobby' && away) { if (pid !== st.host) { st.players.splice(s, 1); commit(); } return; }   // left the lobby
  st.players[s].away = away;

}
// every few seconds: notice players who left, a host who vanished, a move that got lost
function beat(room) {

  const st = ROOM.st, t = now();
  if (ROOM.role === 'host') {
    for (const pid in ROOM.missing) if (ROOM.missing[pid] && t - ROOM.missing[pid] > ONLINE.away && !ROOM.peers[pid]) markAway(pid, true);
    if (t - (ROOM.lastSync || 0) > 8000) { ROOM.lastSync = t; send('st', { p: PROTO, st }); }

}

// ----- the computer players, and players who are away -----
function drive() {
  if (!ROOM || !isHost()) return;
  clearTimeout(ROOM.driveT);
  const st = ROOM.st;
  if (!st || st.phase === 'lobby' || st.phase === 'over') return;
  const seat = st.trade ? st.trade.to : st.turn, p = st.players[seat];
  if (!p) return;
  const key = st.trade ? st.tn + ':' + st.trade.from + '>' + st.trade.to : '';
  if (key !== ROOM.tradeKey) { ROOM.tradeKey = key; ROOM.tradeAt = now(); }
  const away = !p.bot && p.away && ROOM.mode === 'online';
  let delay;
  if (p.bot) delay = 650 + View.pending();
  else if (away) delay = Math.max(900, (ROOM.awayAt[p.pid] || 0) + ONLINE.awayWait - now()) + View.pending();
  else if (st.trade) delay = Math.max(500, ROOM.tradeAt + ONLINE.tradeWait - now());    // a person who does not answer an offer
  else return;                                                                         // a person's turn: wait for them
  const room = ROOM;
  ROOM.driveT = setTimeout(() => {
    if (ROOM !== room || ROOM.st !== st) return;
    const a = p.bot || away ? Engine.botMove(st, seat, away) : (st.trade && st.trade.to === seat ? { t: 'decline' } : null);
    if (!a) return;
    if (!Engine.act(st, seat, a, rndHost)) commit();

}

    const k = Math.max(0, here.indexOf(seat)), n = Math.max(1, here.length);

    const gx = (k % cols) - (cols - 1) / 2, gy = Math.floor(k / cols) - (rows - 1) / 2;
    const sp = n > 1 ? Math.min(c.w, c.h) * (corner ? .36 : .42) : 0;
    if (corner) return { x: c.x + gx * sp, y: c.y + c.h * (caught(seat) ? -.3 : .2) + gy * sp * .5 };
    return { x: c.x + gx * sp, y: c.y + c.h * (n > 1 ? .06 : .12) + gy * sp * .5 };
  }
  function placeTokens(animate) {
    const layer = $('#tokens');

      el.querySelector('img').src = por(p.hero);

      el.classList.toggle('instant', !animate);

      el.style.transform = `translate(${x}px,${y}px)`;
    });
  }
  async function walk(s, from, to, n, flyIt) {
    if (flyIt || Math.abs(n) > 12 || REDUCED) return fly(s, to);
    const dir = n > 0 ? 1 : -1, el = $(`#tokens .tok[data-s="${s}"]`);
    let at = from;
    for (let k = 0; k < Math.abs(n); k++) {

      placeTokens(true);

  async function fly(s, to) {

  // ----- small things that happen on the board -----
  function money(s, d) {

  }
  const tileEl = i => $(`#board .tile[data-i="${i}"]`);
  // what stands on an owned square: the owner's flag, or the tower built there with the flag on top
  const marks = [];
  const mark = i => marks[i] || (marks[i] = { o: -1, lv: 0, m: false });
  function setOwner(i, s) { const t = tileEl(i); if (t) { t.classList.toggle('owned', s >= 0); t.style.setProperty('--o', s >= 0 ? SEAT_COLORS[s] : 'transparent'); } mark(i).o = s; paintMark(i); }
  function setLevel(i, lv) { const t = tileEl(i); if (t) t.classList.toggle('built', !!lv); mark(i).lv = lv; paintMark(i); }
  function setMort(i, m) { const t = tileEl(i); if (t) t.classList.toggle('mort', m); mark(i).m = m; paintMark(i); }
  function paintMark(i) {

  }

  function banner(text, s) {

    b.style.setProperty('--c', SEAT_COLORS[s]);

  function toastEv(msg, kind) { UI.toast(msg, 2200, kind); }
  async function showCard(e) {
    const c = CARDS[e.d][e.id], box = $('#cardpop');

  // ----- the board, built once per game screen -----
  function buildBoard() {
    const board = $('#board');
    if (!board) return;
    let html = '';
    for (let i = 0; i < 40; i++) html += tileHTML(i);
    html += `<div class="center" id="center"><div class="c-art"></div></div>
      <div class="rim rim-f"></div><div class="rim rim-l"></div><div class="rim rim-r"></div>
      <div class="cube-wrap" id="dice">${cubeHTML(0)}${cubeHTML(1)}</div>
      <div class="things" id="things"></div><div class="tokens" id="tokens"></div>`;
    board.innerHTML = html;
    board.onclick = ev => { const t = ev.target.closest('.tile'); if (t) Sheet.open('deed', +t.dataset.i); };
    built = true;

    placeScenery();
  }
  // a billboard: something that stands up on the tilted board, its foot at (x, y) of the board
  const stand = (cls, img, x, y, w) => `<div class="bb ${cls}" style="transform:translate(${x}px,${y}px)"><div class="up" style="width:${w}px;margin-left:${-w / 2}px"><img src="${ART(img)}" alt=""></div></div>`;
  function tileCenter(i) {
    const t = $(`#board .tile[data-i="${i}"]`);
    return t ? { x: t.offsetLeft + t.offsetWidth / 2, y: t.offsetTop + t.offsetHeight / 2, w: t.offsetWidth, h: t.offsetHeight } : { x: 0, y: 0, w: 0, h: 0 };
  }
  // the corner pieces, the towers people built, and a castle and trees around the board
  function placeScenery() {
    const box = $('#things'), board = $('#board');
    if (!box || !board) return;
    const bs = board.clientWidth, tw = bs / 11.75;
    let html = '';
    for (const i in CORNER_PROP) {
      const c = tileCenter(+i);
      html += stand('prop c' + i, CORNER_PROP[i], c.x, c.y - c.h * (i == JAIL ? -.02 : .14), tw * ({ 0: 1.1, 10: 1.2, 20: 1, 30: .8 })[i]);
    }
    const deco = [['s_fort', -0.02, -0.035, 0.24], ['t_archer_3', 1.045, 0.08, 0.1], ['n_pine', -0.05, 0.3, 0.1], ['n_pine', -0.06, 0.52, 0.09],
      ['n_poplar', 1.05, 0.42, 0.07], ['t_bell_3', 1.05, 0.7, 0.1], ['n_snowpine', 0.3, -0.04, 0.08], ['n_snowpine', 0.72, -0.045, 0.085], ['s_camp', -0.06, 0.86, 0.14]];
    for (const [a, x, y, w] of deco) html += stand('deco', a, x * bs, y * bs, w * bs);
    for (let i = 0; i < 40; i++) if (OWNABLE(BOARD[i])) { const c = tileCenter(i); html += `<div class="bb bld" data-i="${i}" style="transform:translate(${c.x}px,${c.y - c.h * .2}px)"><div class="up" style="width:${tw * 1.05}px;margin-left:${-tw * .525}px"></div></div>`; }
    box.innerHTML = html;
    for (let i = 0; i < 40; i++) if (OWNABLE(BOARD[i])) paintMark(i);
  }
  function cubeHTML(k) {
    const pips = n => `<i></i>`.repeat(9);
    return `<div class="cube" data-k="${k}">${[1, 2, 3, 4, 5, 6].map(f => `<div class="fc f${f}" data-f="${f}">${pips(f)}</div>`).join('')}</div>`;
  }
  // the turn of a cube that shows face f on top (towards the board's normal); whole turns (spin) make it tumble
  const FACE_ROT = { 1: [0, 0], 2: [0, -90], 3: [-90, 0], 4: [90, 0], 5: [0, 90], 6: [0, 180] };
  const spin = [0, 0];
  function cubeTf(k, f, lift, rz, extra) {

  }
  function setCube(el, f) { const k = +el.dataset.k; el.style.transform = cubeTf(k, f, .5, k ? 12 : -10, 0); }

  // the board as big as it can be. It is tilted back (rotateX) and seen in perspective: the near edge comes out wider
  // than the board, the whole thing flatter. The size is chosen so that the picture of the board fits the free space.
  function fit() {
    const scr = $('#scr-game'), table = $('#table'), board = $('#board'), stage = $('#stage');
    if (!table || !board || !stage || scr.hidden) return;
    const wide = matchMedia('(orientation: landscape) and (min-width: 720px)').matches;
    const r = table.getBoundingClientRect();

    const sn = Math.sin(tilt), cs = Math.cos(tilt), near = k / (k - .5 * sn), far = k / (k + .5 * sn);
    const W = near * 1.02, H = .5 * cs * (near + far) + .1;          // + room for what stands on the far edge

  // ----- everything, from the shown state -----

    $('#bTrade').disabled = !Engine.legal(st, mySeat()).trade;
    Sheet.refresh();

    show, reset, clear, pending, render, fit, acting, mySeat, controls,
    get st() { return shown; },
    busy(b) { busy = b; if (b) $$('#panel [data-a]').forEach(x => { x.disabled = true; }); },
    peers() { if (shown && shown.phase === 'lobby') Lobby.render(shown); else if (shown) renderPlayers(); }
  };
})();

// one line of the log for an event ('' for events the log leaves out)
function evText(st, e) {
  const n = s => esc(pName(st, s)), t = i => esc(tName(i));
  switch (e.k) {
    case 'start': return 'თამაში დაიწყო';
    case 'roll': return `${n(e.s)}: ${e.d[0]} და ${e.d[1]}${e.d[0] === e.d[1] ? ' · დუბლი' : ''}`;
    case 'buy': return `${n(e.s)}: იყიდა ${t(e.i)} · ${fmt(e.a)}`;
    case 'skip': return `${n(e.s)}: არ იყიდა ${t(e.i)}`;
    case 'pay':
      if (e.why === 'rent') return `${n(e.s)} → ${n(e.to)}: ქირა ${fmt(e.a)} · ${t(e.i)}`;
      if (e.why === 'tax') return `${n(e.s)}: ${t(e.i)} · ${fmt(e.a)}`;
      if (e.why === 'fine') return `${n(e.s)}: ზინდანიდან გამოსასყიდი · ${fmt(e.a)}`;
      if (e.why === 'repair') return `${n(e.s)}: შეკეთება · ${fmt(e.a)}`;
      return `${n(e.s)}: გადაიხადა ${fmt(e.a)}`;
    case 'salary': return `${n(e.s)}: სტარტი · +${fmt(e.a)}`;
    case 'gain': return `${n(e.s)}: +${fmt(e.a)}`;
    case 'card': return `${n(e.s)}: ${esc(CARDS[e.d][e.id].t)}`;
    case 'jail': return `${n(e.s)}: ზინდანში!${e.why === 'dbl' ? ' (სამი დუბლი)' : ''}`;
    case 'free': return `${n(e.s)}: გამოვიდა ზინდანიდან`;
    case 'stay': return `${n(e.s)}: ზინდანში რჩება`;
    case 'build': return `${n(e.s)}: ${t(e.i)} · ${LEVEL_NAMES[e.lv]}`;
    case 'sell': return `${n(e.s)}: გაყიდა კოშკი · ${t(e.i)}`;
    case 'mort': return `${n(e.s)}: დააგირავა ${t(e.i)}`;
    case 'unmort': return `${n(e.s)}: გამოისყიდა ${t(e.i)}`;
    case 'debt': return `${n(e.s)}: ვალი ${fmt(e.a)}`;
    case 'bankrupt': return `${n(e.s)}: გაკოტრდა`;
    case 'offer': return `${n(e.from)} → ${n(e.to)}: შეთავაზება`;
    case 'decline': return `${n(e.to)}: უარი ${n(e.from)}-ის შეთავაზებაზე`;
    case 'cancel': return `${n(e.from)}: გააუქმა შეთავაზება`;
    case 'trade': return `${n(e.from)} ⇄ ${n(e.to)}: გარიგება`;
    case 'turn': return '';
    case 'over': return e.s >= 0 ? `გაიმარჯვა ${n(e.s)}` : 'თამაში დასრულდა';
  }
  return '';
}

// ===== sheets: the deed of a square, a player's property, managing, trading, the log, the menu, the end =====
const Sheet = (() => {
  let kind = '', arg = null, draft = null;
  const box = () => $('#sheet'), body = () => $('#sheetBody');
  function open(k, a) {
    kind = k; arg = a;
    if (k === 'trade') draft = null;
    draw();
    box().hidden = false;
    requestAnimationFrame(() => box().classList.add('on'));
  }
  function close() {
    kind = ''; arg = null;
    const b = box(); if (!b) return;
    b.classList.remove('on'); b.hidden = true;
  }
  function refresh() { if (kind) draw(); }
  function draw() {
    const st = View.st;
    if (!st && kind !== 'rules') return close();
    const fn = { deed, player, estate, trade, offer, log, menu, over, bankrupt: bankruptSheet, rules }[kind];
    if (!fn) return close();
    const html = fn(st);
    if (html == null) return close();
    body().innerHTML = html;
  }

  // a square's deed
  function deed(st) {
    const i = arg, t = BOARD[i], o = st.own[i], seat = View.mySeat(), mine = o && o.o === seat;
    let head = '', rows = '', foot = '';
    if (t.k === 'p') {
      const g = GROUPS[t.g], lv = o ? o.lv : 0, full = o && Engine.groupOwner(st, t.g) === o.o;
      head = `<div class="deed-h" style="--g:${g.c};background-image:linear-gradient(180deg,rgba(13,16,22,.1),rgba(13,16,22,.85)),url(${ART(SCENES[t.g])});background-position:${SCENE_POS[t.g]}"><span class="chip" style="--g:${g.c}">${esc(g.n)}</span><h2>${esc(t.n)}</h2></div>`;
      const line = (label, v, on, img) => `<li class="${on ? 'on' : ''}">${img ? `<img src="${ART(img)}" alt="">` : '<span class="ph"></span>'}<span>${label}</span>${coin(v)}</li>`;
      rows = `<ul class="rents">${line('ცალკე', t.rent[0], o && !lv && !full)}${line('მთელი კუთხე', t.rent[1], o && !lv && full)}${[1, 2, 3, 4, 5].map(k => line(LEVEL_NAMES[k], t.rent[k + 1], lv === k, LEVELS[k].a)).join('')}</ul>
        <p class="facts"><span>ფასი ${coin(t.p)}</span><span>კოშკი ${coin(g.b)}</span><span>დაგირავება ${coin(t.p / 2)}</span></p>`;
    } else if (t.k === 'road') {
      head = `<div class="deed-h road" style="background-image:linear-gradient(180deg,rgba(13,16,22,.1),rgba(13,16,22,.85)),url(${ART('g_pass')})"><span class="chip">ქარვასლა</span><h2>${esc(t.n)}</h2></div>`;
      const n = o ? Engine.countOf(st, o.o, ROADS) : 0;
      rows = `<ul class="rents">${[1, 2, 3, 4].map(k => `<li class="${n === k ? 'on' : ''}"><img src="${ART('s_camp')}" alt=""><span>${k} ქარვასლა</span>${coin(ROAD_RENT[k])}</li>`).join('')}</ul><p class="facts"><span>ფასი ${coin(t.p)}</span><span>დაგირავება ${coin(t.p / 2)}</span></p>`;
    } else if (t.k === 'util') {
      head = `<div class="deed-h util" style="background-image:linear-gradient(180deg,rgba(13,16,22,.1),rgba(13,16,22,.85)),url(${ART('g_elbrus')})"><span class="chip">მეურნეობა</span><h2>${esc(t.n)}</h2></div>`;
      const n = o ? Engine.countOf(st, o.o, UTILS) : 0;
      rows = `<ul class="rents"><li class="${n === 1 ? 'on' : ''}"><span class="ph"></span><span>ერთი გაქვს: კამათლის ჯამი ×4</span></li><li class="${n === 2 ? 'on' : ''}"><span class="ph"></span><span>ორივე გაქვს: კამათლის ჯამი ×10</span></li></ul><p class="facts"><span>ფასი ${coin(t.p)}</span><span>დაგირავება ${coin(t.p / 2)}</span></p>`;
    } else {
      const about = {
        start: `აქედან იწყება გზა. ყოველ გავლაზე ხაზინა ${SALARY}-ს გაძლევს.`,
        jail: `ზინდანი. აქ თუ უბრალოდ მოხვედი, სტუმარი ხარ. დატყვევებული სამ ცდაში დუბლით გამოდის, ან ${JAIL_FINE}-ს იხდის, ან ფასკუნჯის ბუმბულს იყენებს.`,
        feast: 'სუფრა. აქ დასვენება და ქეიფია, არაფერი ხდება.',
        gojail: 'მცველი პირდაპირ ზინდანში გაგზავნის. სტარტს ვერ გაივლი.',
        tax: `${t.n}: ხაზინას უხდი ${t.a}-ს.`,
        scroll: 'ბედის გრაგნილი: ბარათი, რომელიც ხშირად გზაზე გაგზავნის.',
        chest: 'საგანძური: ბარათი, ძირითადად ფულზე.'
      }[t.k];
      return `<div class="sheet-h"><h2>${esc(t.n)}</h2><button class="x" data-close aria-label="დახურვა">×</button></div><p class="prose">${about}</p>`;
    }
    const owner = o ? `<p class="owner"><img src="${por(st.players[o.o].hero)}" alt="" style="--c:${SEAT_COLORS[o.o]}">${esc(st.players[o.o].name)}${o.m ? ' · <b class="bad">დაგირავებული</b>' : ''}</p>` : '<p class="owner free">ჯერ არავისია</p>';
    if (mine) foot = manageButtons(st, seat, i);
    return `<button class="x float-x" data-close aria-label="დახურვა">×</button>${head}<div class="deed-b">${owner}${rows}${foot}</div>`;
  }
  function manageButtons(st, seat, i) {
    const L = Engine.legal(st, seat);
    if (!L.manage) return '<p class="hint">კოშკებს და დაგირავებას შენს სვლაზე მართავ.</p>';
    const t = BOARD[i], o = st.own[i], b = [];
    if (t.k === 'p' && L.build) {
      const why = Engine.buildBlock(st, seat, i);
      if (o.lv < 5) b.push(`<button class="btn small gold" data-a="build" data-i="${i}" ${why ? 'disabled' : ''} title="${esc(ERR[why] || '')}">+ ${esc(LEVEL_NAMES[o.lv + 1])} ${coin(GROUPS[t.g].b)}</button>`);
    }
    if (t.k === 'p' && o.lv > 0) b.push(`<button class="btn small" data-a="sell" data-i="${i}" ${Engine.canSell(st, seat, i) ? '' : 'disabled'}>− კოშკი ${coin(GROUPS[t.g].b / 2)}</button>`);
    if (!o.m) b.push(`<button class="btn small" data-a="mort" data-i="${i}" ${Engine.canMort(st, seat, i) ? '' : 'disabled'}>დაგირავება ${coin(t.p / 2)}</button>`);
    else if (L.build) b.push(`<button class="btn small" data-a="unmort" data-i="${i}" ${st.players[seat].cash >= Engine.unmortCost(i) ? '' : 'disabled'}>გამოსყიდვა ${coin(Engine.unmortCost(i))}</button>`);
    const why = t.k === 'p' && o.lv < 5 ? Engine.buildBlock(st, seat, i) : '';
    return `<div class="manage">${b.join('')}</div>${why && why !== 'cash' && L.build ? `<p class="hint">${esc(ERR[why] || '')}</p>` : ''}`;
  }

  // a player's things
  function holdings(st, s) {
    const rows = [];
    GROUPS.forEach((g, gi) => {
      const ts = GROUP_TILES[gi].filter(i => st.own[i] && st.own[i].o === s);
      if (ts.length) rows.push({ c: g.c, n: g.n, ts, full: Engine.groupOwner(st, gi) === s });
    });
    const rs = ROADS.filter(i => st.own[i] && st.own[i].o === s), us = UTILS.filter(i => st.own[i] && st.own[i].o === s);
    if (rs.length) rows.push({ c: '#8a6a4f', n: 'ქარვასლები', ts: rs });
    if (us.length) rows.push({ c: '#7a4a2a', n: 'მეურნეობა', ts: us });
    return rows;
  }
  function player(st) {
    const s = arg, p = st.players[s];
    if (!p) return null;
    const rows = holdings(st, s);
    const list = rows.length ? rows.map(r => `<div class="hold"><h4 style="--g:${r.c}">${esc(r.n)}${r.full ? ' <span class="tag">მთელი</span>' : ''}</h4>${r.ts.map(i => tileRow(st, i)).join('')}</div>`).join('') : '<p class="prose">ჯერ არაფერი აქვს.</p>';
    return `<div class="sheet-h"><img class="sh-por" src="${por(p.hero)}" alt="" style="--c:${SEAT_COLORS[s]}"><div><h2>${esc(p.name)}</h2><small>${esc(HEROES[p.hero].n)}</small></div><button class="x" data-close aria-label="დახურვა">×</button></div>
      <p class="facts"><span>ფული ${coin(p.cash)}</span><span>ქონება ${coin(Engine.worth(st, s))}</span>${p.fe.length ? `<span>ბუმბული ${p.fe.length}</span>` : ''}</p>${list}`;
  }
  function tileRow(st, i, actions) {
    const o = st.own[i], t = BOARD[i];
    const lv = o && o.lv ? `<img class="lvi" src="${ART(LEVELS[o.lv].a)}" alt="" title="${esc(LEVEL_NAMES[o.lv])}">` : '';
    const rent = Engine.rentAt(st, i, 7);
    return `<div class="trow${o && o.m ? ' mort' : ''}"><button class="tlink" data-deed="${i}" style="--g:${t.k === 'p' ? GROUPS[t.g].c : '#8a6a4f'}">${esc(t.n)}</button>${lv}<span class="tr-r">${o && o.m ? '<b class="bad">დაგირავებული</b>' : t.k === 'util' ? '×' + UTIL_MULT[Engine.countOf(st, o.o, UTILS)] : 'ქირა ' + coin(rent)}</span>${actions || ''}</div>`;
  }

  // managing your own things: towers up and down, pawning
  function estate(st) {
    const s = View.mySeat(), p = st.players[s];
    if (!p) return null;
    const L = Engine.legal(st, s), rows = holdings(st, s);
    const debt = st.phase === 'debt' && st.turn === s ? `<div class="debtbar">ვალი ${coin(st.pend.a)} · გაქვს ${coin(p.cash)} <button class="btn small gold" data-a="pay" ${p.cash >= st.pend.a ? '' : 'disabled'}>გადაიხადე</button></div>` : '';
    const note = L.manage ? '' : '<p class="hint">კოშკების აშენება და დაგირავება შენს სვლაზეა.</p>';
    const list = rows.length ? rows.map(r => `<div class="hold"><h4 style="--g:${r.c}">${esc(r.n)}${r.full ? ' <span class="tag">მთელი</span>' : ''}</h4>${r.ts.map(i => tileRow(st, i, L.manage ? rowActions(st, s, i, L) : '')).join('')}</div>`).join('') : '<p class="prose">ჯერ არაფერი გაქვს. იყიდე ქალაქი, რომელზეც დადგები.</p>';
    return `<div class="sheet-h"><h2>მამული</h2><span class="sh-cash">${coin(p.cash)}</span><button class="x" data-close aria-label="დახურვა">×</button></div>${debt}${note}${list}`;
  }
  function rowActions(st, s, i, L) {
    const t = BOARD[i], o = st.own[i], b = [];
    if (t.k === 'p' && L.build && Engine.groupOwner(st, t.g) === s && o.lv < 5) b.push(`<button class="ib gold" data-a="build" data-i="${i}" ${Engine.buildBlock(st, s, i) ? 'disabled' : ''} aria-label="კოშკის აშენება" title="აშენება ${GROUPS[t.g].b}">+</button>`);
    if (t.k === 'p' && o.lv > 0) b.push(`<button class="ib" data-a="sell" data-i="${i}" ${Engine.canSell(st, s, i) ? '' : 'disabled'} aria-label="კოშკის გაყიდვა" title="გაყიდვა ${GROUPS[t.g].b / 2}">−</button>`);
    if (!o.m) b.push(`<button class="ib" data-a="mort" data-i="${i}" ${Engine.canMort(st, s, i) ? '' : 'disabled'} title="დაგირავება ${t.p / 2}">დაგირ.</button>`);
    else if (L.build) b.push(`<button class="ib" data-a="unmort" data-i="${i}" ${st.players[s].cash >= Engine.unmortCost(i) ? '' : 'disabled'} title="გამოსყიდვა ${Engine.unmortCost(i)}">გამოსყ.</button>`);
    return `<span class="ibs">${b.join('')}</span>`;
  }

  // making an offer
  const tradeable = (st, s) => st.own.map((o, i) => o && o.o === s && (BOARD[i].k !== 'p' || GROUP_TILES[BOARD[i].g].every(j => !st.own[j] || !st.own[j].lv)) ? i : -1).filter(i => i >= 0);
  function trade(st) {
    const s = View.mySeat(), L = Engine.legal(st, s);
    if (!L.trade) return `<div class="sheet-h"><h2>ვაჭრობა</h2><button class="x" data-close aria-label="დახურვა">×</button></div><p class="prose">შეთავაზებას შენს სვლაზე აკეთებ, სანამ ყიდვას ან ვალს ელოდება.</p>`;
    const others = Engine.activeSeats(st).filter(x => x !== s);
    if (!draft || !others.includes(draft.to)) draft = { to: others[0], give: { p: [], c: 0, f: 0 }, get: { p: [], c: 0, f: 0 } };
    const d = draft, me = st.players[s], them = st.players[d.to];
    const side = (seat, x, key) => {
      const tl = tradeable(st, seat), pl = st.players[seat];
      const items = tl.length ? tl.map(i => `<button class="pick${x.p.includes(i) ? ' on' : ''}" data-pick="${key}" data-i="${i}" style="--g:${BOARD[i].k === 'p' ? GROUPS[BOARD[i].g].c : '#8a6a4f'}">${esc(BOARD[i].n)}<small>${BOARD[i].p}${st.own[i].m ? ' · დაგირ.' : ''}</small></button>`).join('') : '<p class="hint">გასაცვლელი ქონება არ აქვს</p>';
      return `<div class="tside"><h4>${key === 'give' ? 'შენ აძლევ' : 'შენ ითხოვ'}</h4><div class="picks">${items}</div>
        <div class="money"><span>ფული</span><button class="ib" data-cash="${key}" data-d="-50">−50</button><button class="ib" data-cash="${key}" data-d="-10">−10</button><b>${fmt(x.c)}</b><button class="ib" data-cash="${key}" data-d="10">+10</button><button class="ib" data-cash="${key}" data-d="50">+50</button><small>მაქს. ${fmt(pl.cash)}</small></div>
        ${pl.fe.length ? `<div class="money"><span>ბუმბული</span><button class="ib" data-fe="${key}" data-d="-1">−</button><b>${x.f}</b><button class="ib" data-fe="${key}" data-d="1">+</button><small>აქვს ${pl.fe.length}</small></div>` : ''}</div>`;
    };
    const tabs = others.map(x => `<button class="who${x === d.to ? ' on' : ''}" data-to="${x}" style="--c:${SEAT_COLORS[x]}"><img src="${por(st.players[x].hero)}" alt="">${esc(st.players[x].name)}</button>`).join('');
    const why = Engine.tradeBlock(st, { from: s, to: d.to, give: d.give, get: d.get });
    return `<div class="sheet-h"><h2>ვაჭრობა</h2><button class="x" data-close aria-label="დახურვა">×</button></div>
      <div class="whos">${tabs}</div>
      <div class="tsides">${side(s, d.give, 'give')}${side(d.to, d.get, 'get')}</div>
      <p class="hint">კოშკებიან კუთხეს ვერ გაცვლი: ჯერ კოშკები გაყიდე. ${them.bot ? 'ბოტი მხოლოდ მომგებიან გარიგებას ეთანხმება.' : ''}</p>
      <button class="btn gold wide" data-offer ${why ? 'disabled' : ''}>შეთავაზება: ${esc(them.name)}</button>`;
  }
  function tradeClick(ev) {
    const st = View.st, s = View.mySeat();
    const to = ev.target.closest('[data-to]'), pick = ev.target.closest('[data-pick]'), cash = ev.target.closest('[data-cash]'), fe = ev.target.closest('[data-fe]');
    if (to) { draft = { to: +to.dataset.to, give: { p: [], c: 0, f: 0 }, get: { p: [], c: 0, f: 0 } }; draw(); return true; }
    if (pick) { const x = draft[pick.dataset.pick], i = +pick.dataset.i; x.p = x.p.includes(i) ? x.p.filter(j => j !== i) : x.p.concat(i); draw(); return true; }
    if (cash) { const key = cash.dataset.cash, x = draft[key], max = st.players[key === 'give' ? s : draft.to].cash; x.c = Math.max(0, Math.min(max, x.c + +cash.dataset.d)); draw(); return true; }
    if (fe) { const key = fe.dataset.fe, x = draft[key], max = st.players[key === 'give' ? s : draft.to].fe.length; x.f = Math.max(0, Math.min(max, x.f + +fe.dataset.d)); draw(); return true; }
    if (ev.target.closest('[data-offer]')) { move({ t: 'offer', to: draft.to, give: draft.give, get: draft.get, seat: s }); close(); return true; }
    return false;
  }
  // an offer to this device's player
  function offer(st) {
    const tr = st.trade;
    if (!tr || !View.controls(tr.to)) return null;
    const from = st.players[tr.from];
    const list = x => [...x.p.map(i => `<span class="pick on static" style="--g:${BOARD[i].k === 'p' ? GROUPS[BOARD[i].g].c : '#8a6a4f'}">${esc(BOARD[i].n)}<small>${BOARD[i].p}${st.own[i] && st.own[i].m ? ' · დაგირ.' : ''}</small></span>`), x.c ? `<span class="pick static money-p">${coin(x.c)}</span>` : '', x.f ? `<span class="pick static">ბუმბული ×${x.f}</span>` : ''].join('') || '<span class="hint">არაფერი</span>';
    return `<div class="sheet-h"><img class="sh-por" src="${por(from.hero)}" alt="" style="--c:${SEAT_COLORS[tr.from]}"><div><h2>${esc(from.name)} გთავაზობს</h2><small>${esc(st.players[tr.to].name)}, შენ წყვეტ</small></div></div>
      <div class="tsides"><div class="tside"><h4>შენ მიიღებ</h4><div class="picks">${list(tr.give)}</div></div><div class="tside"><h4>შენ მისცემ</h4><div class="picks">${list(tr.get)}</div></div></div>
      <div class="row"><button class="btn gold" data-a="accept" data-seat="${tr.to}">თანხმობა</button><button class="btn" data-a="decline" data-seat="${tr.to}">უარი</button></div>`;
  }
  function log(st) {
    const lines = st.ev.map(e => evText(st, e)).filter(Boolean).reverse().slice(0, 70);
    return `<div class="sheet-h"><h2>ჟურნალი</h2><button class="x" data-close aria-label="დახურვა">×</button></div><ol class="log">${lines.map(l => `<li>${l}</li>`).join('')}</ol>`;
  }
  function menu(st) {
    const host = ROOM && (ROOM.role === 'local' || (st && st.host === ROOM.me));
    const code = ROOM && ROOM.mode === 'online' ? `<p class="facts"><span>ოთახი <b class="code">${esc(ROOM.code)}</b></span><span>${ROOM.up ? 'კავშირი წესრიგშია' : '<b class="bad">კავშირი გაწყდა, ვცდილობ აღდგენას</b>'}</span></p>` : '';
    return `<div class="sheet-h"><h2>მენიუ</h2><button class="x" data-close aria-label="დახურვა">×</button></div>${code}
      <div class="menu-list">
        <button class="btn wide" data-sheet="rules">წესები</button>
        <button class="btn wide" data-sound>ხმა: ${Sound.on ? 'ჩართული' : 'გამორთული'}</button>
        ${host && st && st.phase !== 'over' ? '<button class="btn wide" data-confirm="stop">თამაშის დასრულება ახლავე</button>' : ''}
        <button class="btn wide danger" data-confirm="leave">${ROOM && ROOM.mode === 'online' ? 'ოთახიდან გასვლა' : 'მთავარ მენიუში გასვლა'}</button>
      </div><div id="confirm"></div>`;
  }
  function bankruptSheet(st) {
    const s = st.turn;
    if (st.phase !== 'debt' || !View.controls(s)) return null;
    return `<div class="sheet-h"><h2>გაკოტრება</h2><button class="x" data-close aria-label="დახურვა">×</button></div>
      <p class="prose">${st.pend.to >= 0 ? `მთელ შენს ქონებას და ფულს მიიღებს ${esc(pName(st, st.pend.to))}.` : 'შენი ქალაქები ისევ თავისუფალი გახდება.'} თამაშს ვეღარ გააგრძელებ, მაგრამ ყურებას შეძლებ.</p>
      <div class="row"><button class="btn danger" data-a="bankrupt">გავკოტრდი</button><button class="btn" data-close>ჯერ ვიფიქრებ</button></div>`;
  }
  function over(st) {
    if (st.phase !== 'over') return null;
    const order = Engine.ranking(st), w = st.players[st.winner];
    const host = ROOM && (ROOM.role === 'local' || st.host === ROOM.me);
    return `<div class="over-h">${w ? `<img src="${por(w.hero)}" alt="" style="--c:${SEAT_COLORS[st.winner]}"><h2>${esc(w.name)} გაიმარჯვა</h2>` : '<h2>თამაში დასრულდა</h2>'}</div>
      <ol class="rank">${order.map((s, k) => { const p = st.players[s]; return `<li><span class="rk">${k + 1}</span><img src="${por(p.hero)}" alt="" style="--c:${SEAT_COLORS[s]}"><span class="rn">${esc(p.name)}</span><span class="rv">${p.out ? 'გაკოტრდა' : coin(Engine.worth(st, s))}</span></li>`; }).join('')}</ol>
      <div class="row">${host ? '<button class="btn gold" data-again>ახალი თამაში</button>' : ''}<button class="btn" data-confirm-now="leave">მენიუ</button></div>`;
  }
  function rules() {
    return `<div class="sheet-h"><h2>წესები</h2><button class="x" data-close aria-label="დახურვა">×</button></div><div class="prose rules">
      <p>ყველა იწყებს ${fmt(START_CASH)}-ით სტარტზე. სვლაზე ორ კამათელს აგორებ და იმდენ უჯრას გადიხარ. სტარტის გავლისას ${SALARY} გეძლევა.</p>
      <p><b>ქალაქები.</b> თავისუფალ ქალაქზე, ქარვასლაზე, წისქვილზე ან მარანზე თუ დადექი, შეგიძლია იყიდო. სხვისაზე თუ დადექი, მფლობელს ქირას უხდი. მთელი კუთხე თუ შენია, ქირა ორმაგდება.</p>
      <p><b>კოშკები.</b> მთელ კუთხეზე შენს სვლაზე აშენებ: ხის კოშკი, ქვის კოშკი, სამეფო, გუშაგიანი, ბოლოს ციხე-სიმაგრე. კოშკები კუთხის ქალაქებში თანაბრად შენდება, ყოველი მომდევნო ქირას ძლიერ ზრდის.</p>
      <p><b>ქარვასლები</b> ქირას იღებენ იმის მიხედვით, რამდენი გაქვს: 25, 50, 100, 200. <b>წისქვილი და მარანი</b>: კამათლის ჯამი ×4, ორივე თუ გაქვს, ×10.</p>
      <p><b>ბარათები.</b> ბედის გრაგნილი და საგანძური ფულს გაძლევს ან გართმევს, გზაზე გაგზავნის. ფასკუნჯის ბუმბული ზინდანიდან ერთხელ გამოგიყვანს.</p>
      <p><b>ზინდანი.</b> იქ ხვდები „ზინდანში!" უჯრით, ბარათით ან სამი დუბლით ზედიზედ. გამოსვლა: დუბლი სამ ცდაში, ${JAIL_FINE}-ის გადახდა ან ბუმბული. ზინდანშიც იღებ ქირას.</p>
      <p><b>ფული თუ არ გყოფნის,</b> კოშკებს ნახევარ ფასად ყიდი და ქალაქებს აგირავებ (ნახევარი ფასი; გამოსყიდვა 10%-ით მეტი ჯდება). თუ მაინც ვერ იხდი, კოტრდები.</p>
      <p><b>ვაჭრობა.</b> შენს სვლაზე ნებისმიერ მოთამაშეს შესთავაზე ქალაქების, ფულის და ბუმბულის გაცვლა. კოშკებიანი კუთხე ვაჭრობაში არ შედის.</p>
      <p><b>დასასრული.</b> ან სანამ ერთი არ დარჩება, ან რაუნდების ლიმიტამდე. ლიმიტზე იგებს ის, ვისი ფულიც და ქონებაც ერთად ყველაზე მეტია.</p></div>`;
  }

  function onClick(ev) {
    const st = View.st;
    if (ev.target === box()) return close();
    if (ev.target.closest('[data-close]')) return close();
    if (kind === 'trade' && tradeClick(ev)) return;
    const a = ev.target.closest('[data-a]');
    if (a && !a.disabled) {
      const m = { t: a.dataset.a };
      if (a.dataset.i != null) m.i = +a.dataset.i;
      if (a.dataset.seat != null) m.seat = +a.dataset.seat;
      if (m.t === 'bankrupt' || m.t === 'accept' || m.t === 'decline') close();
      move(m);
      return;
    }
    const d = ev.target.closest('[data-deed]');
    if (d) return open('deed', +d.dataset.deed);
    const sh = ev.target.closest('[data-sheet]');
    if (sh) return open(sh.dataset.sheet);
    if (ev.target.closest('[data-sound]')) { Sound.on = !Sound.on; Sound.unlock(); return draw(); }
    const c = ev.target.closest('[data-confirm]');
    if (c) {
      const what = c.dataset.confirm;
      $('#confirm').innerHTML = `<p class="prose">${what === 'stop' ? 'თამაში ახლავე დასრულდება და გაიმარჯვებს ის, ვისი ქონებაც ყველაზე მეტია.' : ROOM && ROOM.mode === 'online' ? 'ოთახიდან გახვალ. თამაში შენს გარეშე გაგრძელდება.' : 'თამაში შეინახება და მენიუდან გააგრძელებ.'}</p><div class="row"><button class="btn danger" data-confirm-now="${what}">დიახ</button><button class="btn" data-close>არა</button></div>`;
      return;
    }
    const cn = ev.target.closest('[data-confirm-now]');
    if (cn) {
      close();
      if (cn.dataset.confirmNow === 'stop') return move({ t: 'stop' });
      leaveRoom(false); setHash(''); UI.go('menu'); return;
    }
    if (ev.target.closest('[data-again]')) { close(); return rematch(); }
  }

  return { open, close, refresh, kind: () => kind, onClick };
})();

// the host starts a new game with the same people
function rematch() {
  if (!isHost()) return;
  const old = ROOM.st, st = Engine.newLobby(old.host);
  st.term = old.term; st.seq = old.seq; st.cfg = old.cfg;
  st.players = old.players.filter(p => p.bot || !p.away || ROOM.role === 'local').map(p => ({ pid: p.pid, name: p.name, hero: p.hero, bot: p.bot, cash: START_CASH, pos: 0, jail: false, jt: 0, fe: [], out: false, outAt: 0, dbl: 0, away: false }));
  ROOM.st = st;
  UI.go('lobby');
  commit();
}

// ===== screens and small messages =====
const UI = (() => {
  let screen = '';
  function go(s) {
    if (s === screen) return;
    screen = s;
    $$('.screen').forEach(el => { el.hidden = el.id !== 'scr-' + s; });
    if (s !== 'game') Sheet.close();
    if (s === 'menu') Menu.render();
    if (s === 'game') { requestAnimationFrame(() => View.fit()); }
  }
  function toast(msg, ms, kind) {
    const box = $('#toasts');
    if (!box) return;
    const t = document.createElement('div');
    t.className = 'toast ' + (kind || '');
    t.innerHTML = msg;
    box.appendChild(t);
    while (box.children.length > 3) box.firstChild.remove();
    setTimeout(() => { t.classList.add('bye'); setTimeout(() => t.remove(), 400); }, ms || 2600);
  }
  function moveRefused(code) {
    View.busy(false);
    if (View.st) View.render();
    if (code && code !== 'turn' && ERR[code]) { toast(ERR[code], 2600, 'bad'); Sound.bad(); }    // 'turn': a button pressed twice
  }
  return { go, toast, moveRefused, get screen() { return screen; } };
})();

// ===== the menu, the room's lobby, and starting up =====

const PROFILE = (() => {
  const p = store.get('profile') || {};
  return { hero: HEROES[p.hero] ? p.hero : 'david', name: Engine.cleanName(p.name || '') };
})();
const saveProfile = () => store.set('profile', PROFILE);
const myName = () => PROFILE.name || HEROES[PROFILE.hero].s;

// ----- the first screen -----
const Menu = (() => {
  function render() {
    const pick = $('#heroPick');
    pick.innerHTML = HERO_KEYS.map(h => `<button class="hero${h === PROFILE.hero ? ' on' : ''}" data-hero="${h}" aria-label="${esc(HEROES[h].n)}" aria-pressed="${h === PROFILE.hero}"><img src="${por(h)}" alt=""></button>`).join('');
    $('#heroName').textContent = HEROES[PROFILE.hero].n;
    $('#heroFig').src = ART(PROFILE.hero === 'david' ? 'h_davidride' : 'h_' + PROFILE.hero);
    const nameIn = $('#nameIn');
    if (document.activeElement !== nameIn) nameIn.value = PROFILE.name;
    nameIn.placeholder = HEROES[PROFILE.hero].s;
    const saved = store.get('local');
    $('#bResume').hidden = !(saved && saved.st && saved.st.phase !== 'lobby' && saved.st.phase !== 'over');
    $('#onlineBox').hidden = !SITE;
    $('#onlineNote').hidden = SITE;
  }
  function onClick(ev) {
    Sound.unlock();
    const h = ev.target.closest('[data-hero]');
    if (h) { PROFILE.hero = h.dataset.hero; saveProfile(); render(); return; }
    const id = ev.target.closest('button') && ev.target.closest('button').id;
    if (id === 'bHost') { PROFILE.name = Engine.cleanName($('#nameIn').value); saveProfile(); hostRoom(); }
    else if (id === 'bJoin') { PROFILE.name = Engine.cleanName($('#nameIn').value); saveProfile(); joinRoom($('#codeIn').value); }
    else if (id === 'bLocal') { PROFILE.name = Engine.cleanName($('#nameIn').value); saveProfile(); playLocal(false); }
    else if (id === 'bResume') playLocal(true);
    else if (id === 'bRules') { Sheet.open('rules'); }
  }
  return { render, onClick };
})();

// ----- the lobby: who is in, which hero, how long, start -----
const Lobby = (() => {
  let sel = -1;                                 // on a shared device: whose hero is being chosen
  function render(st) {
    if (!st || UI.screen !== 'lobby') { if (st && st.phase === 'lobby') UI.go('lobby'); else return; }
    const online = ROOM && ROOM.mode === 'online', host = ROOM && (ROOM.role === 'local' || st.host === ROOM.me);
    const mine = s => ROOM && (ROOM.role === 'local' ? !st.players[s].bot : st.players[s].pid === ROOM.me);
    if (sel < 0 || !st.players[sel] || !mine(sel)) sel = st.players.findIndex((p, s) => mine(s));
    $('#lobbyTitle').textContent = online ? 'ოთახი' : 'თამაში ამ მოწყობილობაზე';
    const codeBox = $('#codeBox');
    codeBox.hidden = !online;
    if (online) {
      $('#roomCode').textContent = ROOM.code || '····';
      const here = Object.keys(ROOM.peers || {}).length;
      $('#roomState').textContent = !ROOM.up ? 'ვუკავშირდები…' : st.players.length ? `ოთახში ${here || 1} ადამიანია` : 'ვუკავშირდები…';
    }
    $('#seats').innerHTML = st.players.map((p, s) => {
      const tags = [p.pid === st.host && online ? '<span class="tag">მასპინძელი</span>' : '', p.bot ? '<span class="tag">ბოტი</span>' : '',
        online && p.pid === ROOM.me ? '<span class="tag me">შენ</span>' : '', online && !p.bot && p.pid !== ROOM.me && ROOM.peers && !ROOM.peers[p.pid] ? '<span class="tag warn">კავშირს ელოდება</span>' : ''].join('');
      const canKick = host ? p.pid !== st.host : p.pid === (ROOM && ROOM.me);
      return `<li class="seat${s === sel ? ' sel' : ''}" data-seat="${s}" style="--c:${SEAT_COLORS[s]}"><img src="${por(p.hero)}" alt=""><div><b>${esc(p.name)}</b><small>${esc(HEROES[p.hero].n)}</small><span class="tags">${tags}</span></div>${canKick && st.players.length > 1 ? `<button class="ib" data-kick="${s}" aria-label="მოშორება">×</button>` : ''}</li>`;
    }).join('') + (st.players.length < MAX_PLAYERS ? `<li class="seat empty">${MAX_PLAYERS - st.players.length} ადგილი თავისუფალია</li>` : '');
    // the hero of the selected seat
    const me = st.players[sel];
    $('#lobbyHeroes').innerHTML = me ? `<p class="lbl">${online ? 'შენი გმირი' : esc(me.name) + ': გმირი'}</p><div class="hero-pick">${HERO_KEYS.map(h => {
      const taken = st.players.some((p, s) => s !== sel && p.hero === h);
      return `<button class="hero${me.hero === h ? ' on' : ''}" data-lhero="${h}" ${taken ? 'disabled' : ''} aria-label="${esc(HEROES[h].n)}"><img src="${por(h)}" alt=""></button>`;
    }).join('')}</div>` : '<p class="lbl">ამ თამაშს უყურებ</p>';
    // length
    const opts = [['rounds', 20], ['rounds', 30], ['rounds', 40], ['full', 0]];
    $('#cfg').innerHTML = `<p class="lbl">თამაშის ხანგრძლივობა</p><div class="seg">${opts.map(([m, r]) => {
      const on = st.cfg.mode === m && (m === 'full' || st.cfg.rounds === r);
      return `<button class="${on ? 'on' : ''}" data-cfg="${m}:${r}" ${host ? '' : 'disabled'}>${m === 'full' ? 'ბოლომდე' : r + ' რაუნდი'}</button>`;
    }).join('')}</div><p class="hint">${st.cfg.mode === 'full' ? 'სანამ ერთი არ დარჩება.' : `${st.cfg.rounds} რაუნდის მერე იგებს ის, ვისი ფულიც და ქონებაც ერთად ყველაზე მეტია.`}</p>`;
    const full = st.players.length >= MAX_PLAYERS;
    $('#lobbyActs').innerHTML = host
      ? `<div class="row"><button class="btn" data-lob="addbot" ${full ? 'disabled' : ''}>+ ბოტი</button>${ROOM.role === 'local' ? `<button class="btn" data-lob="addlocal" ${full ? 'disabled' : ''}>+ მოთამაშე</button>` : ''}</div>
         <button class="btn gold wide big" data-lob="start" ${st.players.length < 2 ? 'disabled' : ''}>დაწყება</button>${st.players.length < 2 ? '<p class="hint">დაამატე ბოტი ან დაელოდე მეგობრებს.</p>' : ''}`
      : `<p class="waiting">მასპინძელი თამაშს დაიწყებს, როცა ყველა შემოვა.</p>`;
  }
  function onClick(ev) {
    Sound.unlock();
    const st = View.st || (ROOM && ROOM.st);
    if (!st || !ROOM) return;
    const seat = ev.target.closest('[data-seat]'), kick = ev.target.closest('[data-kick]'), hero = ev.target.closest('[data-lhero]');
    const cfg = ev.target.closest('[data-cfg]'), lob = ev.target.closest('[data-lob]');
    if (kick) { const s = +kick.dataset.kick; move(st.players[s].pid === ROOM.me && ROOM.role !== 'local' ? { t: 'leave' } : { t: 'kick', s }); return; }
    if (hero && !hero.disabled) {
      if (ROOM.role !== 'local') { PROFILE.hero = hero.dataset.lhero; saveProfile(); }
      move({ t: 'hero', h: hero.dataset.lhero, seat: sel });
      return;
    }
    if (seat && ROOM.role === 'local' && !st.players[+seat.dataset.seat].bot) { sel = +seat.dataset.seat; render(st); return; }
    if (cfg && !cfg.disabled) { const [mode, r] = cfg.dataset.cfg.split(':'); move({ t: 'cfg', mode, rounds: +r || st.cfg.rounds }); return; }
    if (lob && !lob.disabled) {
      if (lob.dataset.lob === 'start') { move({ t: 'start' }); return; }
      move({ t: lob.dataset.lob });
      return;
    }
    const id = ev.target.closest('button') && ev.target.closest('button').id;
    if (id === 'bShare') share();
    else if (id === 'bCopy') copyLink();
    else if (id === 'bLeave') { leaveRoom(false); setHash(''); UI.go('menu'); }
  }
  const link = () => location.origin + location.pathname + '#' + ROOM.code;
  async function share() {
    const url = link();
    try { if (navigator.share) { await navigator.share({ title: 'მამული', text: `მამული: შემოდი ოთახში ${ROOM.code}`, url }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
    copyLink();
  }
  async function copyLink() {
    try { await navigator.clipboard.writeText(link()); UI.toast('ბმული დაკოპირდა', 1800, 'good'); }
    catch (e) { UI.toast(`ბმული: ${esc(link())}`, 5000); }
  }
  return { render, onClick };
})();

// ----- wiring -----
function boot() {
  $('#scr-menu').addEventListener('click', Menu.onClick);
  $('#nameIn').addEventListener('change', e => { PROFILE.name = Engine.cleanName(e.target.value); saveProfile(); });
  $('#codeIn').addEventListener('input', e => { e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 4); });
  $('#codeIn').addEventListener('keydown', e => { if (e.key === 'Enter') $('#bJoin').click(); });
  $('#scr-lobby').addEventListener('click', Lobby.onClick);
  $('#sheet').addEventListener('click', Sheet.onClick);
  $('#scr-game').addEventListener('click', ev => {
    Sound.unlock();
    const a = ev.target.closest('#panel [data-a]');
    if (a && !a.disabled) { const m = { t: a.dataset.a }; if (a.dataset.seat != null) m.seat = +a.dataset.seat; move(m); return; }
    const d = ev.target.closest('#panel [data-deed]');
    if (d) return Sheet.open('deed', +d.dataset.deed);
    const sh = ev.target.closest('#panel [data-sheet]');
    if (sh) return Sheet.open(sh.dataset.sheet);
    const b = ev.target.closest('.dock button');
    if (b && !b.disabled) Sheet.open(b.dataset.open);
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') Sheet.close(); });
  document.addEventListener('pointerdown', () => Sound.unlock(), { once: true });
  const code = (location.hash || '').replace('#', '').toUpperCase();
  UI.go('menu');
  if (SITE && /^[A-Z0-9]{4}$/.test(code)) joinRoom(code);
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
</script>
</body>
