<style>
/* მამული: a board of Georgian regions, in მეტეხი's colours. Dark wood and gold around the board, parchment squares
   on it, the regions' colours on their bands. One world: the game is always dark. */
:root {
  color-scheme: dark;
  --ink: #0d1016; --ink-2: #131823; --panel: #171d2a; --panel-2: #1e2636; --panel-3: #273147;
  --wood: #4d311d; --wood-2: #2c1b10; --wood-3: #6b4527;
  --gold: #e8b44c; --gold-hi: #fff0bc; --gold-lo: #8d5f17;
  --cream: #fff4da; --text: #efe7d4; --muted: #a3aab6; --dim: #6f7785;
  --paper: #f3e3bf; --paper-2: #e6cd98; --paper-ink: #2c1b10; --paper-dim: #7a5a3a;
  --red: #e0574a; --green: #86d46e; --sky: #62b4f0;
  --line: rgba(232, 180, 76, .32); --line-2: rgba(255, 255, 255, .08); --line-3: rgba(255, 255, 255, .15);
  --f-display: 'Noto Serif Georgian', 'Sylfaen', Georgia, serif;
  --f-ui: 'Noto Sans Georgian', 'Sylfaen', system-ui, sans-serif;
  --f-num: 'Lilita One', 'Arial Rounded MT Bold', system-ui, sans-serif;
  --r: 14px;
}
html { height: 100%; box-sizing: border-box; background: var(--ink); }
[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: inherit; }
body { height: 100%; margin: 0; background: var(--ink); color: var(--text); font: 15px/1.45 var(--f-ui); overflow: hidden;
  -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; overscroll-behavior: none; }
input { -webkit-user-select: text; user-select: text; }
#app { height: 100%; position: relative; padding-inline: env(safe-area-inset-left, 0px) env(safe-area-inset-right, 0px); }
.screen { height: 100%; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 2px; }
img { max-width: 100%; }
.lbl { margin: 0 0 6px; font-size: 12px; letter-spacing: .04em; color: var(--muted); font-weight: 600; }
.hint { margin: 6px 0 0; font-size: 12.5px; color: var(--muted); line-height: 1.4; }
.row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.amt { font-family: var(--f-num); font-weight: 400; letter-spacing: .02em; white-space: nowrap; font-variant-numeric: tabular-nums; }
.ci { display: inline-block; width: 1.05em; height: 1.05em; margin-right: .2em; vertical-align: -.17em; background: url(art/ui_coin.webp) center / contain no-repeat; }
.bad { color: var(--red); }
.tag { display: inline-block; padding: 0 6px; border-radius: 99px; font-size: 10.5px; line-height: 17px; font-weight: 700; background: rgba(255, 255, 255, .1); color: var(--text); white-space: nowrap; }
.tag.me { background: var(--gold); color: var(--wood-2); }
.tag.warn { background: rgba(240, 180, 60, .25); color: #ffd98a; }
.tag.bad { background: rgba(224, 87, 74, .25); color: #ffb3a8; }

/* ----- buttons: wood with a gold edge, the main one gold ----- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 42px; padding: 8px 16px; border-radius: 12px;
  border: 1px solid var(--line); background: linear-gradient(180deg, var(--wood-3), var(--wood) 55%, var(--wood-2)); color: var(--cream);
  font-weight: 700; font-size: 14.5px; box-shadow: inset 0 1px 0 rgba(255, 240, 188, .18), 0 2px 0 rgba(0, 0, 0, .35); transition: transform .08s, filter .15s; }
.btn:active:not(:disabled) { transform: translateY(1px); filter: brightness(.95); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.gold { background: linear-gradient(180deg, var(--gold-hi), var(--gold) 45%, #c4892c); color: var(--wood-2); border-color: #8d5f17; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .5), 0 2px 0 #5c3c0e; }
.btn.danger { background: linear-gradient(180deg, #8c3027, #5e1d16); border-color: rgba(224, 87, 74, .5); }
.btn.ghost { background: transparent; box-shadow: none; }
.btn.wide { width: 100%; }
.btn.big { min-height: 52px; font-size: 17px; font-family: var(--f-display); font-weight: 900; }
.btn.small { min-height: 34px; padding: 5px 11px; font-size: 13px; border-radius: 10px; }
.ib { display: inline-grid; place-items: center; min-width: 34px; height: 34px; padding: 0 8px; border-radius: 10px; border: 1px solid var(--line-3);
  background: var(--panel-3); color: var(--text); font-weight: 700; font-size: 13px; }
.ib.gold { background: var(--gold); color: var(--wood-2); border-color: var(--gold-lo); }
.ib:disabled { opacity: .35; cursor: default; }
.link { background: none; border: 0; color: var(--gold); font-weight: 700; padding: 8px; text-decoration: underline; text-underline-offset: 3px; }

/* ----- the first screen ----- */
#scr-menu { position: relative; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.menu-bg { position: fixed; inset: 0; background: linear-gradient(180deg, rgba(13, 16, 22, .55), rgba(13, 16, 22, .82) 50%, var(--ink) 92%), url(art/g_svan.webp) center 30% / cover; }
.menu-wrap { position: relative; max-width: 460px; margin: 0 auto; padding: 22px 16px 28px; display: flex; flex-direction: column; gap: 14px; min-height: 100%; }
.logo { margin: 0; font: 900 clamp(48px, 15vw, 76px)/1 var(--f-display); color: var(--gold); text-align: center; letter-spacing: .01em;
  -webkit-text-stroke: 1.5px var(--wood-2); paint-order: stroke fill; text-shadow: 0 3px 0 var(--wood-2), 0 6px 18px rgba(0, 0, 0, .6); }
.tagline { margin: 6px 0 0; text-align: center; color: var(--cream); font-size: 14.5px; text-wrap: balance; text-shadow: 0 1px 6px rgba(0, 0, 0, .8); }
.menu-card { display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: 20px; border: 1px solid var(--line);
  background: linear-gradient(180deg, rgba(44, 27, 16, .92), rgba(23, 29, 42, .95)); box-shadow: 0 10px 40px rgba(0, 0, 0, .5); }
.me-hero { display: flex; align-items: center; gap: 12px; }
.me-hero img { width: 64px; height: 76px; object-fit: contain; filter: drop-shadow(0 4px 6px rgba(0, 0, 0, .5)); }
.me-hero b { font: 700 18px/1.25 var(--f-display); color: var(--cream); }
.hero-pick { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.hero { aspect-ratio: 1; padding: 0; border-radius: 50%; border: 2px solid transparent; background: var(--panel-2); overflow: hidden; }
.hero img { width: 100%; height: 100%; object-fit: cover; display: block; }
.hero.on { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(232, 180, 76, .3); }
.hero:disabled { opacity: .25; cursor: default; }
.field { display: block; }
.field input, .join input { width: 100%; height: 44px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--line-3); background: var(--ink-2);
  color: var(--cream); font: 600 16px var(--f-ui); }
.online { display: flex; flex-direction: column; gap: 8px; }
.join { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.join input { font: 400 22px var(--f-num); letter-spacing: .3em; text-transform: uppercase; text-align: center; }
.note { margin: 0; font-size: 13px; color: var(--muted); }
.note b { color: var(--gold-hi); }
.install { display: flex; flex-direction: column; gap: 6px; }
.install .btn svg { width: 22px; height: 22px; color: var(--gold-hi); }
.install .note { text-align: center; font-size: 12.5px; }
.prose .ic { width: 18px; height: 18px; vertical-align: -3px; color: #8fc6ff; }
.prose .en { color: var(--gold-hi); }

/* ----- the lobby ----- */
#scr-lobby { overflow-y: auto; background: radial-gradient(120% 70% at 50% 0%, #2a1c12, var(--ink) 70%); }
.lobby-wrap { max-width: 520px; margin: 0 auto; padding: 14px 16px 28px; display: flex; flex-direction: column; gap: 16px; }
.lobby-top { display: flex; align-items: center; gap: 10px; }
.lobby-top h2 { margin: 0; font: 900 22px var(--f-display); color: var(--gold); }
.back { font-size: 22px; line-height: 1; }
/* the room's code, big, with the invitation next to it (as in მეტეხი) */
.code-box { display: flex; flex-direction: column; gap: 6px; }
.ccode { display: flex; align-items: center; gap: 12px; padding: 8px 10px 8px 16px; border-radius: 16px; border: 1px solid var(--line); background: rgba(44, 27, 16, .6); box-shadow: inset 0 1px 0 rgba(255, 240, 188, .08); }
.ccode span { font-size: 12px; font-weight: 800; letter-spacing: .1em; color: var(--gold); }
.ccode b { flex: 1; min-width: 0; font: 400 40px/1.1 var(--f-num); letter-spacing: .2em; color: var(--gold-hi); text-shadow: 0 2px 0 var(--wood-2); }
.ccode .btn { flex: none; }
.code-box .hint { margin: 0; text-align: center; }
.code-box .hint:empty { display: none; }
.seats { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.seat { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line-2); }
.seat.sel { border-color: var(--gold); }
.seat img { width: 44px; height: 44px; border-radius: 50%; box-shadow: 0 0 0 3px var(--c); flex: none; }
.seat > div { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.seat b { font-size: 15.5px; }
.seat small { color: var(--muted); font-size: 12px; }
.tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 2px; }
.seat.empty { justify-content: center; color: var(--dim); font-size: 13px; border-style: dashed; }
.seat.wait { border-style: dashed; }
.seat[data-invite] { cursor: pointer; }
.seat.wait > i { width: 44px; height: 44px; border-radius: 50%; flex: none; box-shadow: inset 0 0 0 2px var(--gold); animation: seatWait 1.4s ease-in-out infinite; }
.seat.wait b { color: var(--cream); }
@keyframes seatWait { 50% { opacity: .35; } }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 4px; border-radius: 14px; background: var(--ink-2); border: 1px solid var(--line-2); }
.seg button { min-height: 38px; border: 0; border-radius: 10px; background: transparent; color: var(--muted); font-weight: 700; font-size: 13px; padding: 4px; }
.seg button.on { background: var(--gold); color: var(--wood-2); }
.seg button:disabled:not(.on) { opacity: .6; cursor: default; }
.lobby-acts { display: flex; flex-direction: column; gap: 10px; }
.waiting { text-align: center; color: var(--muted); margin: 0; }

/* ----- the game screen: a landscape with the board tilted on it like a table; players above, buttons below ----- */
#scr-game { overflow: hidden; }
.game { position: relative; isolation: isolate; height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto auto; grid-template-columns: minmax(0, 1fr); }
.scene { position: absolute; inset: 0; z-index: -1;
  background: linear-gradient(180deg, rgba(13, 16, 22, .82) 0, rgba(13, 16, 22, .3) 14%, rgba(13, 16, 22, 0) 30%, rgba(13, 16, 22, .1) 58%, rgba(13, 16, 22, .88) 82%, var(--ink) 100%),
    url(art/g_elbrus.webp) 50% 28% / cover; }
.hud { position: relative; z-index: 3; padding: 8px 8px 2px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.players { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 6px; }
.pl { position: relative; display: grid; grid-template-columns: 36px minmax(0, 1fr); grid-template-rows: auto auto; column-gap: 7px; align-items: center;
  padding: 3px 12px 3px 3px; border-radius: 99px; border: 1.5px solid rgba(232, 180, 76, .5); text-align: left; min-width: 0;
  background: linear-gradient(180deg, rgba(90, 58, 34, .96), rgba(44, 27, 16, .97)); box-shadow: inset 0 1px 0 rgba(255, 240, 188, .2), 0 3px 8px rgba(0, 0, 0, .5); }
.pl .pp { grid-row: 1 / 3; width: 36px; height: 36px; border-radius: 50%; box-shadow: 0 0 0 2px var(--c), 0 0 0 3.5px var(--gold-lo); }
.pl .pn { font-size: 12.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--cream); line-height: 1.2; }
.pl .pc { display: flex; align-items: center; gap: 4px; font-size: 15px; color: var(--gold-hi); line-height: 1.1; min-width: 0; }
.pl .pi { display: inline-flex; gap: 1px; }
.pl .pi img { width: 15px; height: 15px; object-fit: contain; }
.pl .pf { position: absolute; right: 8px; top: -8px; display: flex; }
.pl .pf .tag { font-size: 9.5px; line-height: 15px; padding: 0 6px; box-shadow: 0 0 0 2px var(--ink); }
.pl .pf .tag:not(.me):not(.warn) { background: #3a3f4c; }
.pl.now { border-color: var(--gold-hi); box-shadow: 0 0 0 1px var(--gold), 0 0 16px rgba(232, 180, 76, .55), 0 3px 8px rgba(0, 0, 0, .5); }
.pl.out { opacity: .45; filter: grayscale(1); }
.float { position: absolute; right: 10px; bottom: 2px; font: 400 15px var(--f-num); pointer-events: none; animation: floatUp 1.25s ease-out forwards; text-shadow: 0 1px 2px #000; }
.float.up { color: var(--green); } .float.down { color: #ff8a7a; }
@keyframes floatUp { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-26px); opacity: 0; } }
.round { text-align: center; font-size: 11.5px; color: #d5d9e0; letter-spacing: .03em; text-shadow: 0 1px 3px #000; }
/* no overflow clip here: Chrome clips 3D content wrongly under one (what stands beyond the board vanished in strips) */
.table { position: relative; min-height: 0; }
.stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; perspective: var(--persp, 1000px); perspective-origin: 50% 50%; }
.panel { position: relative; z-index: 3; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 6px; padding: 2px 14px 6px; text-align: center;
  height: clamp(150px, 21vh, 182px); }          /* one height whatever it says, so the board above never changes size mid-game */
.panel > * { flex-shrink: 0; }
.panel .row { gap: 6px; }
@media (max-width: 400px) { .panel { padding-left: 10px; padding-right: 10px; } }
.panel > :first-child { margin-top: auto; }
.panel > :last-child { margin-bottom: auto; }
.panel .status { font: 900 18px/1.25 var(--f-display); color: var(--cream); text-wrap: balance; text-shadow: 0 2px 6px rgba(0, 0, 0, .9); }
.panel .status b { color: var(--gold-hi); }
.panel .status small { display: block; font: 600 12.5px var(--f-ui); color: #c8ccd4; }
.panel .hint { margin: 0; max-width: 30em; color: #c8ccd4; text-shadow: 0 1px 3px #000; }
.panel .acts { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; }
.panel .acts:empty { display: none; }
.panel .btn.big { min-width: min(100%, 300px); }
.btn.roll { min-width: min(80%, 300px); min-height: 56px; border-radius: 99px; font: 900 20px var(--f-display); gap: 10px; padding: 6px 28px; }
.btn svg { width: 1.7em; height: 1.7em; flex: none; }
.btn.roll svg { width: 34px; height: 34px; }
.btn.roll { position: relative; }
/* the glow is a layer of its own that only fades in and out: nothing is painted again while it pulses */
.btn.roll::after { content: ''; position: absolute; inset: -1px; border-radius: inherit; pointer-events: none; opacity: 0;
  box-shadow: 0 0 0 7px rgba(232, 180, 76, .22), 0 0 26px rgba(255, 220, 140, .55); }
.btn.roll:not(:disabled)::after { animation: rollGlow 1.8s ease-in-out infinite; }
@keyframes rollGlow { 50% { opacity: 1; } }
.panel .last { list-style: none; margin: 2px 0 0; padding: 0; font-size: 12.5px; color: #aab0bb; max-width: 100%; }
.panel .last li { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.panel .last li:first-child { color: #dfe3ea; }
.dock { position: relative; z-index: 3; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 8px 10px 8px; border-top: 2px solid var(--gold-lo);
  background: linear-gradient(180deg, var(--wood-3), var(--wood) 35%, var(--wood-2)); box-shadow: 0 -4px 14px rgba(0, 0, 0, .5); }
.dock button { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 0; border: 0; background: none; color: var(--cream); font-size: 11px; font-weight: 700; }
.dock .rb { display: grid; place-items: center; width: 48px; height: 48px; border-radius: 50%; background: radial-gradient(circle at 50% 30%, #3b4254, #181d28 72%);
  box-shadow: 0 0 0 2px var(--gold), 0 0 0 4px var(--wood-2), 0 3px 8px rgba(0, 0, 0, .55); }
.dock .rb img { width: 32px; height: 32px; object-fit: contain; }
.dock button:disabled { opacity: .45; }
.dock button:active:not(:disabled) .rb { transform: translateY(1px); }
.dock .burger { display: grid; gap: 4px; width: 22px; align-content: center; }
.dock .burger i { height: 3px; border-radius: 2px; background: var(--gold); }
@media (orientation: landscape) and (min-width: 640px) {
  .game { grid-template-columns: minmax(0, 1fr) clamp(270px, 30vw, 380px); grid-template-rows: auto minmax(0, 1fr) auto; }
  .scene { background-position: 50% 40%; }
  .hud { grid-column: 2; grid-row: 1; max-height: 52vh; overflow-y: auto; padding: 12px 12px 6px 4px; }
  .players { grid-template-columns: 1fr; }
  .table { grid-column: 1; grid-row: 1 / 4; }
  .panel { grid-column: 2; grid-row: 2; padding: 8px 12px 8px 4px; height: auto; }
  .dock { grid-column: 2; grid-row: 3; margin: 0 12px 12px 4px; border-radius: 18px; border: 2px solid var(--gold-lo); }
}
@media (orientation: landscape) and (min-width: 640px) and (max-height: 540px) {
  .hud { padding-top: 8px; gap: 2px; }
  .players { gap: 4px; grid-template-columns: 1fr 1fr; }
  .pl { grid-template-columns: 28px minmax(0, 1fr); }
  .pl .pp { width: 28px; height: 28px; }
  .pl .pn { font-size: 12px; } .pl .pc { font-size: 13.5px; }
  .panel { gap: 5px; padding-top: 4px; padding-bottom: 4px; }
  .panel .status { font-size: 16px; }
  .btn.roll { min-height: 46px; font-size: 17px; }
  .panel .last li:nth-child(n+3) { display: none; }
  .dock { padding: 5px 6px; }
  .dock .rb { width: 38px; height: 38px; } .dock .rb img { width: 26px; height: 26px; }
  .dock button { font-size: 10px; }
}

/* ----- the 3D board fills the table; a button, the dice's sum and cards float over it ----- */
.stage { position: absolute; inset: 0; overflow: hidden; }
.board3d { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: manipulation; }
.nogl { position: absolute; left: 10%; right: 10%; top: 25%; margin: 0; padding: 16px; border-radius: 14px; background: rgba(23, 29, 42, .92); border: 1px solid var(--line); text-align: center; }
.viewbtn { position: absolute; right: 10px; top: 6px; z-index: 4; width: 44px; height: 44px; padding: 0; border: 0; border-radius: 50%; display: grid; place-items: center; color: var(--gold-hi);
  background: radial-gradient(circle at 50% 30%, #3b4254, #181d28 72%); box-shadow: 0 0 0 2px var(--gold), 0 0 0 4px var(--wood-2), 0 3px 8px rgba(0, 0, 0, .55); }
.viewbtn svg { width: 24px; height: 24px; }
.viewbtn:active { transform: translateY(1px); }
.dicesum { position: absolute; left: 50%; z-index: 3; transform: translate(-50%, 50%); display: flex; flex-direction: column; align-items: center; pointer-events: none; }
.dicesum b { font: 400 66px/1 var(--f-num); color: var(--gold-hi); -webkit-text-stroke: 3px var(--wood-2); paint-order: stroke fill; text-shadow: 0 4px 0 var(--wood-2), 0 8px 18px rgba(0, 0, 0, .55); }
.dicesum span { margin-top: 4px; padding: 2px 14px; border-radius: 99px; background: var(--red); color: #fff; font: 900 16px var(--f-display); box-shadow: 0 3px 8px rgba(0, 0, 0, .4); }
.dicesum.go { animation: sumIn .45s cubic-bezier(.2, 1.6, .4, 1); }
@keyframes sumIn { from { transform: translate(-50%, 50%) scale(.3); opacity: 0; } to { transform: translate(-50%, 50%) scale(1); opacity: 1; } }
/* the town one may buy */
.buycard { position: absolute; inset: 0; z-index: 5; display: grid; place-items: center; padding: 12px; background: rgba(13, 16, 22, .3); }
.bc { width: min(100%, 340px); max-height: 100%; overflow-y: auto; border-radius: 18px; background: var(--paper); color: var(--paper-ink); border: 3px solid var(--gold-lo);

.bc-h { padding: 44px 16px 12px; background-size: cover; border-bottom: 8px solid var(--g); border-radius: 15px 15px 0 0; }
.bc-h h3 { margin: 4px 0 0; font: 900 30px/1.1 var(--f-display); color: var(--cream); text-shadow: 0 2px 8px #000; }

.bc-rent li { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 5px 2px; border-top: 1px solid rgba(122, 86, 44, .25); font-weight: 700; font-size: 14.5px; }
.bc-rent li:first-child { border-top: 0; }

.bc .hint.bad { color: #a3261c; font-weight: 700; }

.bc .btn.big { flex: 1; }

/* little towers drawn in the sheets and on the build button */
.tws { display: inline-flex; gap: 1px; color: var(--gold); vertical-align: middle; }
.tws svg { width: 12px; height: 17px; }
.lvi { display: inline-flex; align-items: center; }
.lvi .fort, .rents .fort { width: 30px; height: 30px; object-fit: contain; }
.rents .tws svg { width: 9px; height: 14px; }
.tw-i { display: inline-flex; color: var(--gold); }
.btn.gold .tw-i { color: #8d2a1f; }
.tw-i svg { width: 16px; height: 22px; }
.breg { margin-top: 12px; padding: 10px 12px; border-radius: 14px; background: var(--ink-2); border: 1px solid var(--line-2); border-left: 6px solid var(--g); }
.breg h4 { margin: 0 0 6px; font-size: 15px; color: var(--cream); }
.breg h4 small { color: var(--muted); font-weight: 600; }
.btowns { display: grid; grid-template-columns: repeat(auto-fit, minmax(88px, 1fr)); gap: 6px; margin-bottom: 8px; }
.btown { display: flex; flex-direction: column; gap: 2px; padding: 6px 8px; border-radius: 10px; background: var(--panel-2); font-size: 12.5px; min-width: 0; }
.btown b { font-size: 13.5px; color: var(--cream); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.btown small { color: var(--muted); }
.breg .row { justify-content: flex-start; }
.steps { margin: 0 0 12px; padding-left: 22px; display: flex; flex-direction: column; gap: 8px; }

/* the card that was drawn, and whose turn it is: over the table, facing the player */
.cardpop { position: absolute; inset: 0; display: grid; place-items: center; z-index: 5; background: rgba(13, 16, 22, .35); }
.cardpop .card { width: min(80%, 330px); padding: 14px 16px 12px; border-radius: 14px; text-align: center; background: var(--paper); color: var(--paper-ink);
  border: 3px solid var(--gold-lo); box-shadow: 0 0 0 2px var(--paper-2) inset, 0 16px 40px rgba(0, 0, 0, .6); font-size: 15px; }
.cardpop .card.c { border-color: var(--wood-3); }
.cardpop .card img { width: 30%; max-width: 80px; margin-top: -4px; }
.cardpop h3 { margin: 2px 0 6px; font: 900 1.15em var(--f-display); color: #8d2a1f; }
.cardpop .card.c h3 { color: var(--wood); }
.cardpop p { margin: 0 0 6px; font-weight: 600; line-height: 1.4; }
.cardpop small { color: var(--paper-dim); font-weight: 700; }
.cardpop.go .card { animation: cardIn .38s cubic-bezier(.2, 1.4, .4, 1); }
@keyframes cardIn { from { transform: translateY(30px) rotate(-6deg) scale(.7); opacity: 0; } to { transform: none; opacity: 1; } }
.banner { position: absolute; left: 50%; top: 42%; z-index: 6; display: flex; align-items: center; gap: 10px; padding: 8px 18px 8px 8px; border-radius: 99px;
  background: linear-gradient(180deg, var(--wood-3), var(--wood-2)); border: 2px solid var(--gold); box-shadow: 0 10px 30px rgba(0, 0, 0, .6);
  font: 900 21px var(--f-display); color: var(--gold-hi); white-space: nowrap; opacity: 0; transform: translate(-50%, -50%) scale(.6); pointer-events: none; }

.banner.go { animation: bannerGo 1.5s ease-out forwards; }
@keyframes bannerGo { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.6); } 15% { opacity: 1; transform: translate(-50%, -50%) scale(1.04); } 25% { transform: translate(-50%, -50%) scale(1); } 75% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -70%) scale(1); } }

/* ----- sheets ----- */
.sheet { position: fixed; inset: 0; z-index: 20; display: flex; align-items: flex-end; justify-content: center; background: rgba(5, 7, 10, .55); }
.sheet-card { position: relative; width: 100%; max-width: 560px; max-height: 88%; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
  padding: 16px 16px calc(18px + env(safe-area-inset-bottom, 0px)); border-radius: 22px 22px 0 0; background: linear-gradient(180deg, #221a14, var(--panel) 120px);
  border: 1px solid var(--line); border-bottom: 0; box-shadow: 0 -10px 40px rgba(0, 0, 0, .5); transform: translateY(16px); opacity: 0; transition: transform .2s ease-out, opacity .2s; }
.sheet.on .sheet-card { transform: none; opacity: 1; }
@media (min-width: 700px) and (min-height: 560px) { .sheet { align-items: center; } .sheet-card { border-radius: 22px; border-bottom: 1px solid var(--line); max-height: 86%; } }
.sheet-h { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.sheet-h h2 { margin: 0; flex: 1; font: 900 21px/1.2 var(--f-display); color: var(--gold); text-wrap: balance; }

.sh-por { width: 46px; height: 46px; border-radius: 50%; box-shadow: 0 0 0 3px var(--c); }
.sh-cash { font-size: 18px; color: var(--gold-hi); }
.x { flex: none; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line-3); background: var(--panel-3); color: var(--text); font-size: 22px; line-height: 1; }
.float-x { position: absolute; right: 12px; top: 12px; z-index: 2; }
.prose { margin: 0 0 10px; color: var(--text); line-height: 1.55; }
.rules p { margin: 0 0 10px; }
.rules b { color: var(--gold-hi); }
.facts { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 8px 0; font-size: 13.5px; color: var(--muted); }
.facts .amt { color: var(--cream); }
.code { font-family: var(--f-num); }
.facts .code { color: var(--gold-hi); letter-spacing: .15em; }
.deed-h { margin: -16px -16px 12px; padding: 54px 16px 14px; background-size: cover; border-bottom: 6px solid var(--g, var(--wood-3)); border-radius: 21px 21px 0 0; }
.deed-h h2 { margin: 4px 0 0; font: 900 28px/1.1 var(--f-display); color: var(--cream); text-shadow: 0 2px 8px #000; }
.chip { display: inline-block; padding: 1px 10px; border-radius: 99px; background: var(--g, var(--wood-3)); color: #fff; font-weight: 700; font-size: 12.5px; text-shadow: 0 1px 2px rgba(0, 0, 0, .6); }
.owner { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; font-weight: 700; }
.owner img { width: 30px; height: 30px; border-radius: 50%; box-shadow: 0 0 0 2px var(--c); }
.owner.free { color: var(--muted); font-weight: 600; }
.rents { list-style: none; margin: 0; padding: 0; border-radius: 12px; overflow: hidden; border: 1px solid var(--line-2); }
.rents li { display: grid; grid-template-columns: 30px 1fr auto; align-items: center; gap: 8px; padding: 5px 10px; font-size: 14px; border-top: 1px solid var(--line-2); }
.rents li:first-child { border-top: 0; }
.rents li img, .rents .ph { width: 30px; height: 30px; object-fit: contain; }
.rents li .amt { color: var(--gold-hi); }
.rents li.on { background: rgba(232, 180, 76, .16); box-shadow: inset 3px 0 0 var(--gold); }
.manage { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.hold { margin: 12px 0 0; }
.hold h4 { margin: 0 0 6px; display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--cream); }
.hold h4::before { content: ''; width: 12px; height: 12px; border-radius: 3px; background: var(--g); }
.trow { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px solid var(--line-2); min-width: 0; }
.trow.mort { opacity: .75; }
.tlink { flex: 1; min-width: 0; text-align: left; border: 0; background: none; padding: 0; font-weight: 700; color: var(--cream); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  border-left: 4px solid var(--g); padding-left: 8px; }
.lvi { width: 26px; height: 26px; object-fit: contain; }
.tr-r { font-size: 13px; color: var(--muted); white-space: nowrap; }
.tr-r .amt { color: var(--gold-hi); }
.ibs { display: flex; gap: 4px; }
.ibs .ib { min-width: 34px; font-size: 12px; padding: 0 7px; }
.debtbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 12px; background: rgba(224, 87, 74, .14); border: 1px solid rgba(224, 87, 74, .4); color: #ffcfc7; font-weight: 700; }
.debtbar .btn { margin-left: auto; }
.whos { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 8px; }
.who { display: flex; align-items: center; gap: 6px; padding: 4px 10px 4px 4px; border-radius: 99px; border: 1px solid var(--line-2); background: var(--panel-2); font-weight: 700; font-size: 13px; white-space: nowrap; }
.who img { width: 28px; height: 28px; border-radius: 50%; box-shadow: 0 0 0 2px var(--c); }
.who.on { border-color: var(--gold); background: rgba(232, 180, 76, .15); }
.tsides { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 460px) { .tsides { grid-template-columns: 1fr; } }
.tside { padding: 10px; border-radius: 14px; background: var(--ink-2); border: 1px solid var(--line-2); min-width: 0; }
.tside h4 { margin: 0 0 8px; font-size: 13.5px; color: var(--gold); }
.picks { display: flex; flex-wrap: wrap; gap: 6px; }
.pick { display: inline-flex; flex-direction: column; align-items: flex-start; padding: 4px 10px 4px 8px; border-radius: 10px; border: 1px solid var(--line-3);
  border-left: 5px solid var(--g, var(--wood-3)); background: var(--panel-2); color: var(--text); font-weight: 700; font-size: 13px; text-align: left; }
.pick small { font-weight: 600; color: var(--muted); font-size: 11px; }
.pick.on { background: rgba(232, 180, 76, .2); border-color: var(--gold); border-left-color: var(--g, var(--gold)); }
.pick.static { cursor: default; }
.money-p { border-left-color: var(--gold); }
.money { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; margin-top: 8px; font-size: 13px; }
.money > span { color: var(--muted); margin-right: 4px; }
.money b { min-width: 46px; text-align: center; font: 400 17px var(--f-num); color: var(--gold-hi); }
.money small { color: var(--dim); margin-left: 4px; }
.log { margin: 0; padding: 0 0 0 4px; list-style: none; display: flex; flex-direction: column; }
.log li { padding: 6px 0; border-top: 1px solid var(--line-2); font-size: 13.5px; line-height: 1.4; }
.log li:first-child { border-top: 0; color: var(--cream); }
.menu-list { display: flex; flex-direction: column; gap: 8px; }
#confirm .prose { margin-top: 12px; }
.over-h { text-align: center; margin: 4px 0 12px; }
.over-h img { width: 96px; height: 96px; border-radius: 50%; box-shadow: 0 0 0 4px var(--c), 0 0 0 7px var(--gold), 0 10px 30px rgba(0, 0, 0, .6); }
.over-h h2 { margin: 12px 0 0; font: 900 26px var(--f-display); color: var(--gold); }
.rank { list-style: none; margin: 0 0 14px; padding: 0; }
.rank li { display: grid; grid-template-columns: 22px 34px 1fr auto; align-items: center; gap: 10px; padding: 7px 4px; border-top: 1px solid var(--line-2); }
.rank .rk { font: 400 18px var(--f-num); color: var(--muted); text-align: center; }
.rank img { width: 34px; height: 34px; border-radius: 50%; box-shadow: 0 0 0 2px var(--c); }
.rank .rn { font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rank .rv { color: var(--gold-hi); font-size: 14px; }

/* ----- small messages ----- */
.toasts { position: fixed; left: 50%; top: calc(10px + env(safe-area-inset-top, 0px)); z-index: 30; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px;
  width: min(92vw, 440px); pointer-events: none; }
.toast { padding: 8px 14px; border-radius: 12px; background: rgba(23, 29, 42, .96); border: 1px solid var(--line); color: var(--cream); font-size: 13.5px; font-weight: 600;
  box-shadow: 0 6px 20px rgba(0, 0, 0, .5); animation: toastIn .25s ease-out; text-align: center; transition: opacity .35s, transform .35s; }
.toast.good { border-color: rgba(134, 212, 110, .6); }
.toast.bad { border-color: rgba(224, 87, 74, .7); }
.toast.bye { opacity: 0; transform: translateY(-8px); }
@keyframes toastIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: none; } }

@media (prefers-reduced-motion: reduce) {
  .cardpop.go .card, .banner.go, .buycard.go .bc, .dicesum.go { animation-duration: .01s; }
  .btn.roll::after { animation: none !important; }
  .banner.go { animation: none; }
  .seat.wait > i { animation: none; }
}
</style>
</head>
<body>

<div id="app">
  <section class="screen" id="scr-menu">
    <div class="menu-bg"></div>
    <div class="menu-wrap">
      <header>
        <h1 class="logo">მამული</h1>
        <p class="tagline">იყიდე ციხე-ქალაქები, ააშენე კოშკები და ივაჭრე მეგობრებთან</p>
      </header>
      <div class="menu-card">
        <div class="me-hero"><img id="heroFig" src="art/h_davidride.webp" alt=""><div><p class="lbl">შენი გმირი</p><b id="heroName"></b></div></div>
        <div class="hero-pick" id="heroPick"></div>

        </div>

        <button class="btn wide" id="bLocal">ბოტებთან ან ერთ ეკრანზე</button>
        <button class="btn ghost wide" id="bResume" hidden>შენახული თამაშის გაგრძელება</button>
        <div class="install" id="installBox" hidden>
          <button class="btn wide" id="bInstall"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="2.5" width="12" height="19" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 6.5v7M9 10.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.5 18h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>დააინსტალირე</button>
          <p class="note" id="installNote">მთავარ ეკრანზე დაჯდება და აპივით გაიხსნება, ბრაუზერის ზოლების გარეშე.</p>
        </div>
        <button class="link" id="bRules">წესები</button>

    </div>
  </section>

  <section class="screen" id="scr-lobby" hidden>

        <div class="ccode"><span>ოთახი</span><b id="roomCode">····</b><button class="btn gold small" id="bInvite">მოწვევა</button></div>
        <p class="hint" id="roomState"></p>
      </div>
      <ul class="seats" id="seats"></ul>
      <div id="lobbyHeroes"></div>
      <div id="cfg"></div>
      <div id="lobbyActs" class="lobby-acts"></div>
    </div>
  </section>

  <section class="screen" id="scr-game" hidden>

      <div class="scene" aria-hidden="true"></div>

        <div class="buycard" id="buycard" hidden></div>

        <button data-open="menu"><span class="rb"><span class="burger" aria-hidden="true"><i></i><i></i><i></i></span></span><span>მენიუ</span></button>

</div>

<script>
const BUILD = "a90cea9081";
const SITE = true;
// ===== მამული: the board, the regions, the cards and the heroes =====
// Everything here is plain data; the rules live in engine.js.

const SALARY = 200;        // collected on passing or landing on the start
const START_CASH = 1500;
const JAIL_FINE = 50;
const JAIL = 10;           // the dungeon's square
const MAX_PLAYERS = 6;

// regions: name, colour of the band on their squares, price of one tower
const GROUPS = [
  { n: 'ხევსურეთი', c: '#9a7452', b: 50 },
  { n: 'სვანეთი', c: '#72bde6', b: 50 },
  { n: 'სამეგრელო', c: '#55ad5f', b: 100 },
  { n: 'იმერეთი', c: '#ee8f3e', b: 100 },
  { n: 'სამცხე', c: '#2fa39d', b: 150 },
  { n: 'ქართლი', c: '#e4bc3c', b: 150 },
  { n: 'კახეთი', c: '#a8365f', b: 200 },
  { n: 'თბილისი', c: '#4064c8', b: 200 }
];

// k: p = a town of a region, road = caravanserai, util = mill / wine cellar, scroll / chest = cards,
// tax, start, jail, feast (free square), gojail
const BOARD = [
  { k: 'start', n: 'სტარ\u00adტი' },
  { k: 'p', g: 0, n: 'მუცო', p: 60 },
  { k: 'chest', n: 'სა\u00adგან\u00adძუ\u00adრი' },
  { k: 'p', g: 0, n: 'შა\u00adტი\u00adლი', p: 80 },
  { k: 'tax', n: 'ხარკი', a: 200 },
  { k: 'road', n: 'ანანურის ქარვასლა', s: 'ა\u00adნა\u00adნუ\u00adრი', p: 200 },
  { k: 'p', g: 1, n: 'ლა\u00adტა\u00adლი', p: 100 },
  { k: 'scroll', n: 'ბე\u00adდის გრაგ\u00adნი\u00adლი' },

// The whole game is one plain object (the state). act() checks that a move is allowed, changes the state and adds
// events (what happened, for the screens to animate and for the log). Only the host's browser runs it; everyone else

const Engine = (() => {
  const FEATHER = { s: CARDS.s.findIndex(c => c.k === 'feather'), c: CARDS.c.findIndex(c => c.k === 'feather') };

  function mulberry(seed) {
    let a = seed >>> 0;
    return () => {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;

    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }

  // ----- the lobby -----
  function newLobby(hostPid) {
    return {
      v: 1, term: 0, seq: 0, phase: 'lobby', host: hostPid,
      cfg: { mode: 'rounds', rounds: 30 },
      players: [], own: BOARD.map(() => null), turn: 0, round: 1,
      dice: [3, 4], rolls: 0, again: false, pend: null, trade: null,
      decks: { s: [], c: [] }, ev: [], evn: 0, winner: -1, tn: 0, offered: -1, memo: []
    };
  }
  const seatOf = (st, pid) => st.players.findIndex(p => p.pid === pid);
  const cleanName = s => String(s == null ? '' : s).replace(/[\u0000-\u001f<>&"]/g, '').trim().slice(0, 16);
  const freeHero = (st, pref) => {
    const used = new Set(st.players.map(p => p.hero));
    if (pref && HEROES[pref] && !used.has(pref)) return pref;
    return HERO_KEYS.find(h => !used.has(h)) || HERO_KEYS[0];
  };
  function newPlayer(pid, name, hero, bot) {
    return { pid, name, hero, bot: !!bot, cash: START_CASH, pos: 0, jail: false, jt: 0, fe: [], out: false, outAt: 0, dbl: 0, away: false };
  }
  // someone knocks: a newcomer gets a seat while there is one; a returning player is simply back
  function lobbyJoin(st, pid, name, hero) {
    const s = seatOf(st, pid);
    if (s >= 0) { st.players[s].away = false; return s; }
    if (st.phase !== 'lobby') return -1;                 // the game is on: watchers only
    if (st.players.length >= MAX_PLAYERS) return -2;
    const h = freeHero(st, hero);

    return st.players.length - 1;

    if (st.phase !== 'lobby') return 'started';
    const s = seatOf(st, pid), host = pid === st.host;

      case 'hero': {
        if (s < 0 || !HEROES[a.h]) return 'bad';
        if (st.players.some((p, i) => i !== s && p.hero === a.h)) return 'taken';
        st.players[s].hero = a.h; return '';
      }
      case 'name': if (s < 0) return 'bad'; st.players[s].name = cleanName(a.n) || HEROES[st.players[s].hero].s; return '';
      case 'addbot': {
        if (!host) return 'host';
        if (st.players.length >= MAX_PLAYERS) return 'full';
        const h = freeHero(st, null);
        st.players.push(newPlayer('bot-' + Math.floor(rnd() * 1e9).toString(36), HEROES[h].s, h, true));
        return '';
      }
      case 'kick': {
        const k = a.s | 0, p = st.players[k];
        if (!p) return 'bad';
        if (!(host || p.pid === pid) || p.pid === st.host) return 'host';   // the host cannot be removed; anyone can leave
        st.players.splice(k, 1); return '';
      }
      case 'cfg': {
        if (!host) return 'host';
        const mode = a.mode === 'full' ? 'full' : 'rounds';
        const rounds = [20, 30, 40].includes(a.rounds | 0) ? a.rounds | 0 : 30;
        st.cfg = { mode, rounds }; return '';
      }
      case 'start': {
        if (!host) return 'host';
        if (st.players.length < 2) return 'few';
        start(st, rnd); return '';
      }
    }
    return 'bad';
  }
  function start(st, rnd) {
    shuffle(st.players, rnd);                            // who goes first is decided by lot
    for (const p of st.players) Object.assign(p, { cash: START_CASH, pos: 0, jail: false, jt: 0, fe: [], out: false, outAt: 0, dbl: 0 });
    st.own = BOARD.map(() => null);
    st.decks = { s: shuffle(CARDS.s.map((_, i) => i), rnd), c: shuffle(CARDS.c.map((_, i) => i), rnd) };
    Object.assign(st, { turn: 0, round: 1, phase: 'roll', again: false, pend: null, trade: null, winner: -1, rolls: 0, tn: 1, offered: -1, memo: [] });

    push(st, 'turn', { s: 0, r: 1 });

  // ----- small helpers -----
  function push(st, k, o) {
    st.evn++;

    if (st.ev.length > 90) st.ev.splice(0, st.ev.length - 90);
  }
  const activeSeats = st => st.players.map((p, i) => i).filter(i => !st.players[i].out);
  function groupOwner(st, g) {
    const ts = GROUP_TILES[g], o0 = st.own[ts[0]];

    return o0.o;
  }
  const countOf = (st, seat, list) => list.reduce((n, i) => n + (st.own[i] && st.own[i].o === seat ? 1 : 0), 0);
  function rentAt(st, i, sum, mode) {
    const t = BOARD[i], o = st.own[i];
    if (!o || o.m) return 0;
    if (t.k === 'p') return o.lv > 0 ? t.rent[o.lv + 1] : t.rent[groupOwner(st, t.g) === o.o ? 1 : 0];
    if (t.k === 'road') return ROAD_RENT[countOf(st, o.o, ROADS)] * (mode === 'double' ? 2 : 1);
    if (t.k === 'util') return sum * (mode === 'ten' ? 10 : UTIL_MULT[countOf(st, o.o, UTILS)]);
    return 0;
  }
  const buildCost = i => GROUPS[BOARD[i].g].b;
  const mortValue = i => BOARD[i].p / 2;
  const unmortCost = i => Math.ceil(BOARD[i].p * 0.55);
  // why a tower cannot go up here ('' = it can)
  function buildBlock(st, seat, i) {
    const t = BOARD[i], o = st.own[i];
    if (!t || t.k !== 'p' || !o || o.o !== seat) return 'own';
    if (o.lv >= 5) return 'max';
    if (groupOwner(st, t.g) !== seat) return 'group';
    const ts = GROUP_TILES[t.g];
    if (ts.some(j => st.own[j].m)) return 'mort';
    if (o.lv !== Math.min(...ts.map(j => st.own[j].lv))) return 'even';
    if (st.players[seat].cash < buildCost(i)) return 'cash';
    return '';
  }
  function canSell(st, seat, i) {
    const t = BOARD[i], o = st.own[i];
    if (!t || t.k !== 'p' || !o || o.o !== seat || o.lv <= 0) return false;
    return o.lv === Math.max(...GROUP_TILES[t.g].map(j => st.own[j].lv));
  }
  function canMort(st, seat, i) {
    const t = BOARD[i], o = st.own[i];
    if (!o || o.o !== seat || o.m) return false;
    if (t.k === 'p' && GROUP_TILES[t.g].some(j => st.own[j] && st.own[j].lv > 0)) return false;
    return true;
  }
  // everything the player could still raise by selling towers and pawning
  function raiseMax(st, seat) {
    let n = 0;
    st.own.forEach((o, i) => { if (o && o.o === seat) { if (o.lv) n += o.lv * buildCost(i) / 2; if (!o.m) n += mortValue(i); } });
    return n;
  }
  function worth(st, seat) {
    const p = st.players[seat];
    if (!p || p.out) return 0;
    let w = p.cash;
    st.own.forEach((o, i) => { if (o && o.o === seat) { w += o.m ? BOARD[i].p / 2 : BOARD[i].p; if (o.lv) w += o.lv * buildCost(i); } });

  // ----- landing on a square: true = done, false = the player has to decide something first (buy, debt) -----
  function land(st, seat, mode) {

        if (o.o === seat || o.m) return true;

  // ----- what a player may do now (for the buttons) -----
  function legal(st, seat) {

  // ----- the computer players (and anyone away for too long) -----
  function maxRentAgainst(st, seat) {

    return m;
  }

    const t = BOARD[i], p = st.players[seat];
    if (p.cash < t.p) return false;
    if (p.cash - t.p >= reserve) return true;
    if (t.k === 'p') {
      const others = GROUP_TILES[t.g].filter(j => j !== i);
      const mine = others.filter(j => st.own[j] && st.own[j].o === seat).length;
      const owners = new Set(others.filter(j => st.own[j]).map(j => st.own[j].o));
      if (mine === others.length) return p.cash - t.p >= 40;                       // finishes my region
      if (owners.size === 1 && !owners.has(seat) && others.every(j => st.own[j])) return p.cash - t.p >= 60;  // stops someone else's
    }

    const p = st.players[seat];

      const cost = buildCost(i);
      if (p.cash - cost < reserve) continue;
      const t = BOARD[i], lv = st.own[i].lv, gain = (t.rent[lv + 2] - t.rent[lv ? lv + 1 : 1]) / cost;

    const p = st.players[seat];

    }
    return null;
  }
  // find money for a debt: the towers that bring least first, then pawn what matters least
  function botRaise(st, seat) {
    let sell = null, sellRent = Infinity;
    for (let i = 0; i < 40; i++) if (canSell(st, seat, i)) { const r = BOARD[i].rent[st.own[i].lv + 1]; if (r < sellRent) { sellRent = r; sell = i; } }
    if (sell != null) return { t: 'sell', i: sell };

      const have = others.filter(j => (st.own[j] && st.own[j].o === seat) || (extra && extra.includes(j))).length;
      if (have === others.length) v += t.p * 1.6;

  }
  // does this hand over the last town of a region to the other side?
  function completesFor(st, seat, i, also) {

  function likes(st, seat, tr) {
    const p = st.players[seat], inP = tr.give, outP = tr.get;      // the bot receives give, hands over get
    if (outP.c > p.cash) return false;

    for (const i of outP.p) {

  const noTowers = g => st => GROUP_TILES[g].every(j => !st.own[j] || st.own[j].lv === 0);
  const refused = (st, from, to, key) => st.memo.some(m => m.from === from && m.to === to && m.k === key && st.round - m.r < 6);
  // a computer player that misses one town of a region asks its holder for it: a swap when it can finish a region for
  // them too, otherwise money
  function botOffer(st, seat, reserve) {
    const p = st.players[seat];
    for (let g = 0; g < GROUPS.length; g++) {

      if (mine.length !== ts.length - 1) continue;
      const miss = ts.find(i => !mine.includes(i)), o = st.own[miss];
      if (!o || st.players[o.o].out || !noTowers(g)(st)) continue;

        if (theirs.length !== ts2.length - 1) continue;

      if (swap != null) {
        const sweet = Math.max(0, Math.round((BOARD[miss].p - BOARD[swap].p + 50) / 10) * 10);

  UI.toast('მასპინძელი წავიდა. ოთახს ახლა შენი ტელეფონი ატარებს.', 3600);
  commit();
}

// ----- the computer players, and players who are away -----
// A computer player waits until the screen has shown everything that happened, then a moment more (so one can see where it
// landed before it buys, say), and only then makes its move. The others' phones play the same things at the same time.
const BEAT = { roll: 550, buy: 700, skip: 700, end: 300, build: 450, sell: 450, mort: 450, unmort: 450, offer: 700, accept: 900, decline: 900, cancel: 500 };
function drive() {
  if (!ROOM || !isHost()) return;
  clearTimeout(ROOM.driveT);
  const st = ROOM.st;
  if (!st || st.phase === 'lobby' || st.phase === 'over') return;
  const seat = st.trade ? st.trade.to : st.turn, p = st.players[seat];
  if (!p) return;
  const key = st.trade ? st.tn + ':' + st.trade.from + '>' + st.trade.to : '';
  if (key !== ROOM.tradeKey) { ROOM.tradeKey = key; ROOM.tradeAt = now(); }
  const away = !p.bot && p.away && ROOM.mode === 'online', computer = p.bot || away;
  let until;                                                                      // not before this time
  if (p.bot) until = now();
  else if (away) until = Math.max(now() + 900, (ROOM.awayAt[p.pid] || 0) + ONLINE.awayWait);
  else if (st.trade) until = Math.max(now() + 500, ROOM.tradeAt + ONLINE.tradeWait);   // a person who does not answer an offer
  else return;                                                                    // a person's turn: wait for them
  const room = ROOM, plan = computer ? Engine.botMove(st, seat, away) : null;
  const beat = plan ? BEAT[plan.t] || 650 : 0;
  const go = () => {
    if (ROOM !== room || ROOM.st !== st) return;
    const left = Math.max(until - now(), computer ? beat - View.idleFor() : 0);
    if (left > 0) { ROOM.driveT = setTimeout(go, computer ? Math.min(left, 300) : left); return; }   // the screen is checked often
    const a = computer ? Engine.botMove(st, seat, away) : (st.trade && st.trade.to === seat ? { t: 'decline' } : null);
    if (!a) return;
    if (!Engine.act(st, seat, a, rndHost)) commit();
  };
  ROOM.driveT = setTimeout(go, 40);
}

// the page went to the background and came back: make sure we are still in the room
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' || !ROOM || ROOM.mode !== 'online' || !ROOM.net) return;
  if (ROOM.role === 'guest') send('hello', { name: PROFILE.name, hero: PROFILE.hero, p: PROTO }, ROOM.hostPid || undefined);
  else if (ROOM.st) send('st', { p: PROTO, st: ROOM.st });
});
window.addEventListener('pagehide', () => { if (ROOM && ROOM.mode === 'online') send('bye', {}); });

// ===== the little 3D world on the board, made of boxes, cones and cylinders (nothing to download) =====
// Every model is built in a "lot" frame: x runs along the board's side, +z towards the square in front of the lot (and the
// camera), y up from the ground. Pieces are coloured per face and merged into one mesh per lot.

const Models = (() => {
  const T = window.THREE;
  if (!T) return null;
  T.ColorManagement.legacyMode = false;               // colours given in sRGB, as in the CSS

  const M4 = new T.Matrix4(), Q = new T.Quaternion(), E = new T.Euler(), V = new T.Vector3(), SC = new T.Vector3(), C = new T.Color();

  // the same little random number for the same spot: vertices shared by two faces have to move together
  function hash3(x, y, z) { const h = Math.sin(x * 127.1 + y * 311.7 + z * 74.7) * 43758.5453; return h - Math.floor(h); }
  function rng(seed) { let s = (seed * 2654435761) >>> 0 || 1; return () => { s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  function tone(hex, f) { C.set(hex); C.r = Math.min(1, C.r * f); C.g = Math.min(1, C.g * f); C.b = Math.min(1, C.b * f); return C.getHex(); }

  const PAL = {
    stone: 0xd9cfbc, stone2: 0xbdb19b, stone3: 0x9a8f7d, slate: 0x77726a, slate2: 0x5d5952, svan: 0xe6dcc8, svanRoof: 0x58534e,
    wood: 0x8a5a34, wood2: 0x5e3b22, terra: 0xc4643f, terra2: 0xa64e37, churchRoof: 0x6f8574, snow: 0xf5f8fb, rock: 0x8e99a4,
    leaf: 0x4f9645, leaf2: 0x3c7c3a, pine: 0x2f6a3c, pine2: 0x3b7d48, autumn: 0xd9862f, trunk: 0x6b4a2c, water: 0x4ba6cc,
    gold: 0xe7b84a, red: 0xc8372d, white: 0xf2ece0, brick: 0xb8613f, sand: 0xdcc391, cliff: 0xcfab7a, vine: 0x5e9c3a,
    soil: 0x8c6b43, dark: 0x3b2c22, glass: 0x2e3a44, silver: 0xc9ced6, cloth: 0xf4efe4
  };
  // the ground of each region's lots
  const GROUND = [0xa3ad86, 0x8fc062, 0x7fb455, 0xa4c062, 0xc9b874, 0xaebf68, 0x98b558, 0xd6c6a3];

  // ----- shapes, standing on y = 0 -----
  const box = (w, h, d) => new T.BoxGeometry(w, h, d).translate(0, h / 2, 0);
  const cyl = (rt, rb, h, seg = 8) => new T.CylinderGeometry(rt, rb, h, seg).translate(0, h / 2, 0);
  const halfCyl = (r, h, seg = 6) => new T.CylinderGeometry(r, r, h, seg, 1, false, 0, Math.PI).translate(0, h / 2, 0);
  const cone = (r, h, seg = 8) => new T.ConeGeometry(r, h, seg).translate(0, h / 2, 0);
  const pyr = (w, h, d = w) => new T.ConeGeometry(Math.SQRT1_2, 1, 4).rotateY(Math.PI / 4).scale(w, h, d).translate(0, h / 2, 0);
  const taper = (wb, wt, h) => new T.CylinderGeometry(wt * Math.SQRT1_2, wb * Math.SQRT1_2, h, 4).rotateY(Math.PI / 4).translate(0, h / 2, 0);
  const ball = (r, det = 0) => new T.IcosahedronGeometry(r, det);
  const dome = (r, seg = 10) => new T.SphereGeometry(r, seg, Math.max(3, seg >> 1), 0, Math.PI * 2, 0, Math.PI / 2);
  const lathe = (pts, seg = 10) => new T.LatheGeometry(pts.map(([x, y]) => new T.Vector2(x, y)), seg);
  // a gable roof, ridge along x
  function roof(w, h, d) {
    const a = w / 2, b = d / 2, v = [-a, 0, b, a, 0, b, a, h, 0, -a, 0, b, a, h, 0, -a, h, 0, a, 0, -b, -a, 0, -b, -a, h, 0, a, 0, -b, -a, h, 0, a, h, 0,
      a, 0, b, a, 0, -b, a, h, 0, -a, 0, -b, -a, 0, b, -a, h, 0];
    const g = new T.BufferGeometry();
    g.setAttribute('position', new T.Float32BufferAttribute(v, 3));
    return g;
  }
  // a craggy cone: mountains, hills, rocks
  function crag(r, h, seg, rings, rough, seed) {
    const g = new T.ConeGeometry(r, h, seg, rings), p = g.attributes.position;
    for (let k = 0; k < p.count; k++) {
      const X = p.getX(k), Y = p.getY(k), Z = p.getZ(k);
      if (Y <= -h / 2 + 1e-6) { const f = 0.9 + hash3(X + seed, 0, Z) * 0.2; p.setXYZ(k, X * f, Y, Z * f); continue; }
      const j = hash3(X * 3.1 + seed, Y * 2.3, Z * 3.7 + seed), f = 1 - rough / 2 + j * rough;
      p.setXYZ(k, X * f, Y + (Y < h / 2 - 1e-6 ? (j - 0.5) * 0.14 * h : 0), Z * f);
    }
    return g.translate(0, h / 2, 0);
  }
  function mesa(rt, rb, h, seg, rough, seed) {
    const g = new T.CylinderGeometry(rt, rb, h, seg, 2), p = g.attributes.position;
    for (let k = 0; k < p.count; k++) {
      const X = p.getX(k), Y = p.getY(k), Z = p.getZ(k), j = hash3(X * 3.3 + seed, Y * 1.7, Z * 2.9 + seed), f = 1 - rough / 2 + j * rough;
      const mid = Y > -h / 2 + 1e-6 && Y < h / 2 - 1e-6;
      p.setXYZ(k, X * f, Y + (mid ? (j - 0.5) * 0.16 * h : 0), Z * f);
    }
    return g.translate(0, h / 2, 0);
  }
  function lump(r, seed, sy = 0.7) {
    const g = new T.DodecahedronGeometry(r, 0), p = g.attributes.position;
    for (let k = 0; k < p.count; k++) { const X = p.getX(k), Y = p.getY(k), Z = p.getZ(k), f = 0.8 + hash3(X * 5 + seed, Y * 5, Z * 5) * 0.4; p.setXYZ(k, X * f, Y * f * sy, Z * f); }
    return g.translate(0, r * sy * 0.55, 0);
  }

  // ----- a builder: collects pieces and merges them into one geometry with a colour per face -----
  function Builder() { this.parts = []; }
  Builder.prototype.add = function (g, color, x = 0, y = 0, z = 0, o = {}, parent = null) {
    if (g.index) g = g.toNonIndexed();
    if (g.attributes.uv) g.deleteAttribute('uv');
    if (g.attributes.normal) g.deleteAttribute('normal');
    const p = g.attributes.position, n = p.count, c = new Float32Array(n * 3);
    for (let k = 0; k + 2 < n; k += 3) {
      if (typeof color === 'function') C.set(color((p.getY(k) + p.getY(k + 1) + p.getY(k + 2)) / 3, k / 3));
      else C.set(color);
      for (let j = 0; j < 3; j++) { c[(k + j) * 3] = C.r; c[(k + j) * 3 + 1] = C.g; c[(k + j) * 3 + 2] = C.b; }
    }
    g.setAttribute('color', new T.BufferAttribute(c, 3));
    E.set(o.rx || 0, o.ry || 0, o.rz || 0, 'YXZ'); Q.setFromEuler(E);
    const s = o.s || 1;
    M4.compose(V.set(x, y, z), Q, SC.set(o.sx || s, o.sy || s, o.sz || s));
    if (parent) M4.premultiply(parent);
    g.applyMatrix4(M4);
    this.parts.push(g);
    return this;
  };
  // a frame inside the lot: a model built around (0, 0) is placed, turned and scaled as a whole
  Builder.prototype.at = function (x, z, ry = 0, s = 1, y = 0) {
    const P = new T.Matrix4().compose(new T.Vector3(x, y, z), new T.Quaternion().setFromEuler(new T.Euler(0, ry, 0)), new T.Vector3(s, s, s));
    return (g, color, lx = 0, ly = 0, lz = 0, o = {}) => this.add(g, color, lx, ly, lz, o, P);
  };
  // everything fn() adds is raised by dy (onto a hill, a rock)
  Builder.prototype.lift = function (dy, fn) { const n = this.parts.length; fn(); for (let k = n; k < this.parts.length; k++) this.parts[k].translate(0, dy, 0); return this; };
  Builder.prototype.build = function () {
    let n = 0;
    for (const g of this.parts) n += g.attributes.position.count;
    const pos = new Float32Array(n * 3), col = new Float32Array(n * 3);
    let o = 0;
    for (const g of this.parts) { pos.set(g.attributes.position.array, o); col.set(g.attributes.color.array, o); o += g.attributes.position.count * 3; }
    const g = new T.BufferGeometry();
    g.setAttribute('position', new T.BufferAttribute(pos, 3));
    g.setAttribute('color', new T.BufferAttribute(col, 3));
    g.computeVertexNormals();
    g.computeBoundingSphere();
    return g;
  };

  // ===== pieces =====
  function pine(B, x, z, s = 1, snowy = false) {
    B.add(cyl(0.016 * s, 0.022 * s, 0.07 * s, 5), PAL.trunk, x, 0, z);
    B.add(cone(0.095 * s, 0.18 * s, 7), PAL.pine, x, 0.05 * s, z);
    B.add(cone(0.07 * s, 0.15 * s, 7), snowy ? 0xe8eef3 : PAL.pine2, x, 0.14 * s, z);
  }
  function tree(B, x, z, s = 1, leaf = PAL.leaf) {
    B.add(cyl(0.015 * s, 0.022 * s, 0.1 * s, 5), PAL.trunk, x, 0, z);
    B.add(ball(0.085 * s), leaf, x, 0.15 * s, z, { sy: 1.1 });
  }
  function bigTree(B, x, z, s = 1, leaf = PAL.leaf2) {        // the old plane tree of Telavi
    B.add(cyl(0.03 * s, 0.05 * s, 0.16 * s, 6), PAL.trunk, x, 0, z);
    B.add(ball(0.13 * s, 1), leaf, x, 0.24 * s, z, { sy: 0.85 });
    B.add(ball(0.09 * s), tone(leaf, 1.12), x + 0.07 * s, 0.3 * s, z + 0.03 * s);
  }
  function poplar(B, x, z, s = 1) {
    B.add(cyl(0.012 * s, 0.016 * s, 0.06 * s, 5), PAL.trunk, x, 0, z);
    B.add(ball(0.05 * s), PAL.leaf, x, 0.2 * s, z, { sy: 3 });
  }
  function palm(B, x, z, s = 1) {
    B.add(cyl(0.011 * s, 0.018 * s, 0.26 * s, 5), 0x8f6d45, x, 0, z, { rz: 0.1 });
    for (let k = 0; k < 6; k++) B.add(cone(0.026 * s, 0.15 * s, 4), k % 2 ? 0x4c9a45 : 0x5aa84f, x - 0.026 * s, 0.25 * s, z, { ry: k * Math.PI / 3, rz: -(Math.PI / 2 + 0.45) });
  }
  function bush(B, x, z, s = 1, c = 0x467f3b) { B.add(ball(0.05 * s), c, x, 0.03 * s, z, { sy: 0.75 }); }
  function rock(B, x, z, s = 0.07, c = PAL.stone3, seed = 1) { B.add(lump(s, seed), c, x, 0, z, { ry: seed }); }
  function mountain(B, x, z, r, h, opt = {}) {
    const snow = opt.snow == null ? 0.62 : opt.snow, rk = opt.rock || PAL.rock, seed = opt.seed || 1;
    B.add(crag(r, h, opt.seg || 7, 3, opt.rough || 0.34, seed), cy => cy > h * snow ? PAL.snow : cy > h * (snow - 0.13) ? tone(rk, 1.1) : cy < h * 0.18 && opt.green ? opt.green : rk, x, opt.y || 0, z, { ry: seed });
  }
  function hill(B, x, z, r, h, c, seed = 1) { B.add(crag(r, h, 9, 2, 0.18, seed), c, x, 0, z, { ry: seed }); }
  function house(B, x, z, w, d, h, wall, roofC, ry = 0) {
    const put = B.at(x, z, ry);
    put(box(w, h, d), wall);
    put(roof(w * 1.1, h * 0.6, d * 1.14), roofC, 0, h, 0);
    put(box(w * 0.2, h * 0.5, 0.012), PAL.dark, 0, 0, d / 2);
  }
  function svanTower(B, x, z, h = 0.52, s = 1) {
    const w = 0.12 * s;
    B.add(taper(w, w * 0.84, h * 0.84), PAL.svan, x, 0, z);
    B.add(box(w * 1.08, h * 0.1, w * 1.08), 0xd5cab4, x, h * 0.82, z);
    B.add(pyr(w * 1.24, h * 0.17), PAL.svanRoof, x, h * 0.92, z);
    B.add(box(w * 0.22, w * 0.32, 0.012), PAL.dark, x, h * 0.6, z + w * 0.44);
    B.add(box(w * 0.2, w * 0.26, 0.012), PAL.dark, x, h * 0.85, z + w * 0.55);
  }
  function svanHouse(B, x, z, ry = 0) { house(B, x, z, 0.17, 0.13, 0.1, 0xd3c7b0, PAL.svanRoof, ry); }
  function khevsurTower(B, x, z, h = 0.42, s = 1) {
    const w = 0.12 * s;
    B.add(taper(w, w * 0.78, h * 0.78), PAL.slate, x, 0, z);
    for (let k = 0; k < 4; k++) B.add(box(w * (0.82 - k * 0.19), h * 0.055, w * (0.82 - k * 0.19)), k % 2 ? PAL.slate : PAL.slate2, x, h * (0.78 + k * 0.055), z);
    B.add(box(w * 0.2, w * 0.3, 0.012), PAL.dark, x, h * 0.55, z + w * 0.42);
  }
  function church(B, x, z, s = 1, wall = 0xdcc8a0, roofC = PAL.churchRoof, ry = 0) {
    const put = B.at(x, z, ry, s);
    put(box(0.34, 0.13, 0.13), wall);
    put(box(0.13, 0.13, 0.26), wall);
    put(roof(0.36, 0.07, 0.15), roofC, 0, 0.13, 0);
    put(roof(0.28, 0.07, 0.15), roofC, 0, 0.13, 0, { ry: Math.PI / 2 });
    put(cyl(0.055, 0.055, 0.11, 8), wall, 0, 0.16, 0);
    put(cone(0.067, 0.09, 8), roofC, 0, 0.27, 0);
    put(box(0.008, 0.045, 0.008), PAL.gold, 0, 0.36, 0);
    put(box(0.03, 0.008, 0.008), PAL.gold, 0, 0.385, 0);
    put(box(0.04, 0.06, 0.012), PAL.dark, 0, 0, 0.13);
  }
  function bellTower(B, x, z, s = 1, wall = PAL.stone, roofC = PAL.churchRoof) {
    const put = B.at(x, z, 0, s);
    put(box(0.1, 0.22, 0.1), wall);
    put(box(0.05, 0.06, 0.104), PAL.dark, 0, 0.13, 0);
    put(pyr(0.12, 0.08), roofC, 0, 0.22, 0);
  }
  function wall(B, x, z, len, h, ry = 0, c = PAL.stone2, thick = 0.035) {
    const put = B.at(x, z, ry);
    put(box(len, h, thick), c);
    const n = Math.max(3, Math.round(len / 0.045) | 1);
    for (let k = 0; k < n; k += 2) put(box(len / n, 0.026, thick * 1.15), c, -len / 2 + (k + 0.5) * len / n, h, 0);
  }
  function roundTower(B, x, z, r, h, c = PAL.stone2, roofC = null) {
    B.add(cyl(r, r * 1.06, h, 10), c, x, 0, z);
    if (roofC) B.add(cone(r * 1.25, r * 2, 10), roofC, x, h, z);
    else for (let k = 0; k < 6; k++) { const a = k * Math.PI / 3; B.add(box(r * 0.45, r * 0.45, r * 0.45), c, x + Math.cos(a) * r * 0.8, h, z + Math.sin(a) * r * 0.8, { ry: -a }); }
  }
  function squareTower(B, x, z, w, h, c = PAL.stone2, roofC = null) {
    B.add(box(w, h, w), c, x, 0, z);
    if (roofC) B.add(pyr(w * 1.2, w * 0.9), roofC, x, h, z);
    else for (const [dx, dz] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) B.add(box(w * 0.3, w * 0.3, w * 0.3), c, x + dx * w * 0.35, h, z + dz * w * 0.35);
    B.add(box(w * 0.24, w * 0.34, 0.01), PAL.dark, x, h * 0.62, z + w / 2);
  }
  // walls around a rectangle, towers on the corners
  function fortress(B, x, z, w, d, h, c = PAL.stone2, opt = {}) {
    const put = B.at(x, z, opt.ry || 0, 1, opt.y || 0), tr = opt.tr || 0.045;
    const W = (lx, lz, len, ry) => { const p2 = (g, col, a = 0, b = 0, cc = 0, o = {}) => { const cs = Math.cos(ry), sn = Math.sin(ry); put(g, col, lx + a * cs + cc * sn, b, lz - a * sn + cc * cs, Object.assign({}, o, { ry: (o.ry || 0) + ry })); };
      p2(box(len, h, 0.035), c); const n = Math.max(3, Math.round(len / 0.045) | 1); for (let k = 0; k < n; k += 2) p2(box(len / n, 0.026, 0.04), c, -len / 2 + (k + 0.5) * len / n, h, 0); };
    W(0, d / 2, w, 0); W(0, -d / 2, w, 0); W(-w / 2, 0, d, Math.PI / 2); W(w / 2, 0, d, Math.PI / 2);
    for (const [dx, dz] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {
      put(cyl(tr, tr * 1.06, h * 1.35, 10), c, dx * w / 2, 0, dz * d / 2);
      if (opt.roof) put(cone(tr * 1.3, tr * 2.1, 10), opt.roof, dx * w / 2, h * 1.35, dz * d / 2);
      else for (let k = 0; k < 6; k++) { const a = k * Math.PI / 3; put(box(tr * 0.42, tr * 0.42, tr * 0.42), c, dx * w / 2 + Math.cos(a) * tr * 0.8, h * 1.35, dz * d / 2 + Math.sin(a) * tr * 0.8, { ry: -a }); }
    }
    if (opt.gate !== false) put(box(0.05, h * 0.7, 0.012), PAL.dark, 0, 0, d / 2 + 0.02);
  }
  function cliff(B, x, z, w, h, d, c = PAL.cliff, seed = 3) {
    B.add(mesa(0.72, 1, 1, 9, 0.26, seed), cy => cy > 0.97 ? tone(c, 1.1) : cy < 0.25 ? tone(c, 0.9) : c, x, 0, z, { sx: w / 2, sy: h, sz: d / 2, ry: seed });
  }
  function caves(B, x, z, n, y0, spread, seed = 1) {
    const r = rng(seed);
    for (let k = 0; k < n; k++) B.add(box(0.035, 0.035, 0.012), PAL.dark, x + (r() - 0.5) * spread, y0 + r() * 0.12, z);
  }
  function vineyard(B, x, z, w, d, ry = 0, rows = 4) {
    const put = B.at(x, z, ry);
    put(box(w, 0.012, d), PAL.soil);
    for (let r = 0; r < rows; r++) {
      const rz = -d / 2 + (r + 0.5) * d / rows, n = Math.max(2, Math.round(w / 0.055));
      for (let k = 0; k < n; k++) put(box(0.042, 0.05, 0.034), k % 2 ? PAL.vine : tone(PAL.vine, 1.12), -w / 2 + (k + 0.5) * w / n, 0.012, rz);
    }
  }
  function qvevri(B, x, z, s = 1, buried = 0.35) {
    B.add(lathe([[0, 0], [0.03, 0.012], [0.05, 0.05], [0.054, 0.09], [0.04, 0.13], [0.024, 0.15], [0.027, 0.162], [0.02, 0.162]], 10), 0xb8663b, x, -0.16 * buried * s, z, { s });
  }
  function balconyHouse(B, x, z, w, h, wallC, ry = 0) {
    const put = B.at(x, z, ry), d = 0.13;
    put(box(w, h, d), wallC);
