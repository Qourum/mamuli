      if (build) {
        acts = `<div class="row">${build.replace('class="btn"', 'class="btn gold"')}<button class="btn" data-a="end">სვლის დასრულება</button></div>`;
        extra = `<p class="hint">მთელი კუთხე გაქვს: ააშენე კოშკები და ქირა გაიზრდება.</p>`;
      } else {
        acts = `<button class="btn ghost" data-a="end">სვლის დასრულება</button>`;
        extra = `<p class="hint">სვლა გადადის…</p>`;
      }
    } else if (L.cover) {
      const d = st.pend, can = p.cash + Engine.raiseMax(st, me) >= d.a;
      status = 'ვალი გაქვს';
      extra = `<p class="debt">გადასახდელია ${coin(d.a)}${d.to >= 0 ? ` · ${esc(pName(st, d.to))}` : ''} <small>· გაქვს ${coin(p.cash)}</small></p>
        <p class="hint">${can ? 'თამაში გაყიდის კოშკებს და დააგირავებს ქალაქებს, რომლებიც ნაკლებად გჭირდება.' : 'მთელი ქონებითაც ვერ ფარავ ვალს.'}</p>`;
      acts = `<div class="row">${can ? `<button class="btn gold" data-a="${L.pay ? 'pay' : 'cover'}">${L.pay ? 'გადაიხადე' : 'ვალის დაფარვა'}</button><button class="btn" data-sheet="estate">მე ავირჩევ</button>` : '<button class="btn danger" data-sheet="bankrupt">გაკოტრება</button>'}</div>`;
    } else if (L.cancel) {
      extra = `<p class="hint">ელოდები პასუხს: ${esc(pName(st, st.trade.to))}</p>`;
      acts = `<button class="btn" data-a="cancel">შეთავაზების გაუქმება</button>`;
    } else if (L.accept) {
      acts = `<button class="btn gold" data-sheet="offer">შეთავაზების ნახვა</button>`;
    } else if (st.trade && st.phase !== 'over') {
      extra = `<p class="hint">${esc(pName(st, st.trade.from))} ვაჭრობას სთავაზობს: ${esc(pName(st, st.trade.to))}</p>`;
    } else if (st.phase === 'buy') {
      extra = `<p class="hint">ფიქრობს, იყიდოს თუ არა: ${esc(tName(st.pend.i))}</p>`;
    } else if (st.phase === 'over') {
      acts = `<button class="btn gold" data-sheet="over">შედეგები</button>`;
    }
    const lines = [];
    for (let k = st.ev.length - 1; k >= 0 && lines.length < 3; k--) { const t = evText(st, st.ev[k]); if (t) lines.push(t); }
    c.innerHTML = `<div class="status">${status}</div>${extra}<div class="acts">${acts}</div>${lines.length ? `<ul class="last">${lines.map(l => `<li>${l}</li>`).join('')}</ul>` : ''}`;
    // the panel does not grow (the board would shrink): the oldest lines of the log give way when there is more to say
    const ul = c.querySelector('.last');
    while (ul && ul.children.length && c.scrollHeight > c.clientHeight + 1) ul.lastElementChild.remove();
    if (ul && !ul.children.length) ul.remove();
    if (busy) $$('[data-a]', c).forEach(b => { b.disabled = true; });
  }
  // the town one may buy, as a card over the board
  function renderBuy() {
    const st = shown, box = $('#buycard');
    if (!box) return;
    const me = acting();
    if (!st || st.phase !== 'buy' || me !== st.turn || !controls(me) || playing) { hideBuy(); return; }
    const t = BOARD[st.pend.i], p = st.players[me], L = Engine.legal(st, me);
    const col = t.k === 'p' ? GROUPS[t.g].c : '#7b5532';
    const head = t.k === 'p' ? `<span class="chip" style="--g:${col}">${esc(GROUPS[t.g].n)}</span>` : `<span class="chip" style="--g:${col}">${t.k === 'road' ? 'ქარვასლა' : 'მეურნეობა'}</span>`;
    let rows = '', hint = '';
    if (t.k === 'p') {
      const mine = GROUP_TILES[t.g].filter(i => st.own[i] && st.own[i].o === me).length, all = GROUP_TILES[t.g].length;
      rows = `<li><span>ქირა</span>${coin(t.rent[0])}</li><li><span>მთელი ${esc(GROUPS[t.g].n)}</span>${coin(t.rent[1])}</li><li><span>კოშკებით</span><b class="amt">${coin(t.rent[2])} – ${fmt(t.rent[6])}</b></li>`;
      hint = mine + 1 === all ? `ეს ბოლოა: იყიდე და მთელი ${esc(GROUPS[t.g].n)} შენი იქნება!` : `${esc(GROUPS[t.g].n)}: ${all} ქალაქი. ყველა თუ შეაგროვე, ქირა გაორმაგდება და კოშკებს ააშენებ.`;
    } else if (t.k === 'road') {
      rows = [1, 2, 3, 4].map(k => `<li><span>${k} ქარვასლა</span>${coin(ROAD_RENT[k])}</li>`).join('');
      hint = 'რაც მეტი ქარვასლა გაქვს, მით მეტ ქირას იღებ.';
    } else {
      rows = `<li><span>ერთი გაქვს</span><b>კამათელი ×4</b></li><li><span>ორივე გაქვს</span><b>კამათელი ×10</b></li>`;
      hint = 'ქირა კამათლის ჯამზეა დამოკიდებული.';
    }
    const scene = t.k === 'p' ? SCENES[t.g] : t.k === 'road' ? 'g_pass' : 'g_elbrus', at = t.k === 'p' ? SCENE_POS[t.g] : '50% 50%';
    box.innerHTML = `<div class="bc">
      <div class="bc-h" style="--g:${col};background-image:linear-gradient(180deg,rgba(13,16,22,0),rgba(13,16,22,.8)),url(${ART(scene)});background-position:${at}">${head}<h3>${esc(t.n.replace(/­/g, ''))}</h3></div>
      <div class="bc-b"><ul class="bc-rent">${rows}</ul><p class="hint">${hint}</p>
      <div class="row"><button class="btn gold big" data-a="buy" ${L.buy ? '' : 'disabled'}>იყიდე ${coin(t.p)}</button><button class="btn" data-a="skip">არა</button></div>
      ${L.buy ? '' : `<p class="hint bad">ფული არ გყოფნის: გაქვს ${coin(p.cash)}</p>`}</div></div>`;
    if (box.hidden) { box.hidden = false; box.classList.remove('go'); void box.offsetWidth; box.classList.add('go'); }
    if (busy) $$('[data-a]', box).forEach(b => { b.disabled = true; });
  }
  function hideBuy() { const b = $('#buycard'); if (b) b.hidden = true; }
  // the button over the board: the whole board, or back to the figure
  function viewBtn() {
    const b = $('#bView');
    if (!b) return;
    b.hidden = !gl;
    const m = gl ? Board3D.mode : 'follow';
    if (b.dataset.m === m) return;
    b.dataset.m = m;
    b.innerHTML = m === 'follow' ? VIEW_SVG.all : VIEW_SVG.me;
    b.title = m === 'follow' ? 'მთელი დაფა' : 'ფიგურასთან';
    b.setAttribute('aria-label', b.title);
  }

  // the page went to the background: what is left to show is skipped (the game goes on without waiting for this screen)
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'hidden' || !playing) return;
    q = [];
    if (gl && Board3D.ok) Board3D.halt();
    finishPlay();
  });

  return {
    show, reset, clear, pending, idleFor, render, fit, acting, mySeat, controls,
    get st() { return shown; },
    get playing() { return current ? current.k : playing ? 'queue' : ''; },
    busy(b) { busy = b; if (b) $$('#panel [data-a], #buycard [data-a], #sheet [data-a]').forEach(x => { x.disabled = true; }); },
    peers() { if (shown && shown.phase === 'lobby') Lobby.render(shown); else if (shown) renderPlayers(); },
    idle() { if (shown && !playing) autoEnd(); },
    view() { if (!gl) return; Board3D.setMode(Board3D.mode === 'follow' ? 'overview' : 'follow'); viewBtn(); }
  };
})();

// one line of the log for an event ('' for events the log leaves out)
function evText(st, e) {
  const n = s => esc(pName(st, s)), t = i => esc(tName(i));
  switch (e.k) {
    case 'start': return 'თამაში დაიწყო';
    case 'roll': return `${n(e.s)}: ${e.d[0]} და ${e.d[1]}${e.d[0] === e.d[1] ? ' · დუბლი' : ''}`;
    case 'buy': return `${n(e.s)}: იყიდა ${t(e.i)} · ${fmt(e.a)}`;
    case 'skip': return `${n(e.s)}: არ იყიდა ${t(e.i)}`;
    case 'pay':
      if (e.why === 'rent') return `${n(e.s)} → ${n(e.to)}: ქირა ${fmt(e.a)} · ${t(e.i)}`;
      if (e.why === 'tax') return `${n(e.s)}: ${t(e.i)} · ${fmt(e.a)}`;
      if (e.why === 'fine') return `${n(e.s)}: ზინდანიდან გამოსასყიდი · ${fmt(e.a)}`;
      if (e.why === 'repair') return `${n(e.s)}: შეკეთება · ${fmt(e.a)}`;
      return `${n(e.s)}: გადაიხადა ${fmt(e.a)}`;
    case 'salary': return `${n(e.s)}: სტარტი · +${fmt(e.a)}`;
    case 'gain': return `${n(e.s)}: +${fmt(e.a)}`;
    case 'card': return `${n(e.s)}: ${esc(CARDS[e.d][e.id].t)}`;
    case 'jail': return `${n(e.s)}: ზინდანში!${e.why === 'dbl' ? ' (სამი დუბლი)' : ''}`;
    case 'free': return `${n(e.s)}: გამოვიდა ზინდანიდან`;
    case 'stay': return `${n(e.s)}: ზინდანში რჩება`;
    case 'build': return `${n(e.s)}: ${t(e.i)} · ${LEVEL_NAMES[e.lv]}`;
    case 'sell': return `${n(e.s)}: გაყიდა კოშკი · ${t(e.i)}`;
    case 'mort': return `${n(e.s)}: დააგირავა ${t(e.i)}`;
    case 'unmort': return `${n(e.s)}: გამოისყიდა ${t(e.i)}`;
    case 'debt': return `${n(e.s)}: ვალი ${fmt(e.a)}`;
    case 'bankrupt': return `${n(e.s)}: გაკოტრდა`;
    case 'offer': return `${n(e.from)} → ${n(e.to)}: შეთავაზება`;
    case 'decline': return `${n(e.to)}: უარი ${n(e.from)}-ის შეთავაზებაზე`;
    case 'cancel': return `${n(e.from)}: გააუქმა შეთავაზება`;
    case 'trade': return `${n(e.from)} ⇄ ${n(e.to)}: გარიგება`;
    case 'turn': return '';
    case 'over': return e.s >= 0 ? `გაიმარჯვა ${n(e.s)}` : 'თამაში დასრულდა';
  }
  return '';
}

// ===== sheets: the deed of a square, a player's property, managing, trading, the log, the menu, the end =====
const Sheet = (() => {
  let kind = '', arg = null, draft = null;
  const box = () => $('#sheet'), body = () => $('#sheetBody');
  function open(k, a) {
    kind = k; arg = a;
    if (k === 'trade') draft = null;
    draw();
    box().hidden = false;
    requestAnimationFrame(() => box().classList.add('on'));
  }
  function close() {
    const was = kind;
    kind = ''; arg = null;
    const b = box(); if (!b) return;
    b.classList.remove('on'); b.hidden = true;
    if (was) View.idle();
  }
  function refresh() { if (kind) draw(); }
  function draw() {
    const st = View.st;
    if (!st && kind !== 'rules' && kind !== 'install') return close();
    const fn = { deed, player, estate, build, trade, offer, log, menu, over, bankrupt: bankruptSheet, rules, install }[kind];
    if (!fn) return close();
    const html = fn(st);
    if (html == null) return close();
    body().innerHTML = html;
  }

  // a square's deed
  function deed(st) {
    const i = arg, t = BOARD[i], o = st.own[i], seat = View.mySeat(), mine = o && o.o === seat;
    let head = '', rows = '', foot = '';
    if (t.k === 'p') {
      const g = GROUPS[t.g], lv = o ? o.lv : 0, full = o && Engine.groupOwner(st, t.g) === o.o;
      head = `<div class="deed-h" style="--g:${g.c};background-image:linear-gradient(180deg,rgba(13,16,22,.1),rgba(13,16,22,.85)),url(${ART(SCENES[t.g])});background-position:${SCENE_POS[t.g]}"><span class="chip" style="--g:${g.c}">${esc(g.n)}</span><h2>${esc(t.n)}</h2></div>`;
      const line = (label, v, on, icon) => `<li class="${on ? 'on' : ''}">${icon || '<span class="ph"></span>'}<span>${label}</span>${coin(v)}</li>`;
      rows = `<ul class="rents">${line('ცალკე', t.rent[0], o && !lv && !full)}${line('მთელი ' + esc(g.n), t.rent[1], o && !lv && full)}${[1, 2, 3, 4, 5].map(k => line(LEVEL_NAMES[k], t.rent[k + 1], lv === k, lvIcons(k))).join('')}</ul>
        <p class="facts"><span>ფასი ${coin(t.p)}</span><span>კოშკი ${coin(g.b)}</span><span>დაგირავება ${coin(t.p / 2)}</span></p>`;
    } else if (t.k === 'road') {
      head = `<div class="deed-h road" style="background-image:linear-gradient(180deg,rgba(13,16,22,.1),rgba(13,16,22,.85)),url(${ART('g_pass')})"><span class="chip">ქარვასლა</span><h2>${esc(t.n)}</h2></div>`;
      const n = o ? Engine.countOf(st, o.o, ROADS) : 0;
      rows = `<ul class="rents">${[1, 2, 3, 4].map(k => `<li class="${n === k ? 'on' : ''}"><img src="${ART('s_camp')}" alt=""><span>${k} ქარვასლა</span>${coin(ROAD_RENT[k])}</li>`).join('')}</ul><p class="facts"><span>ფასი ${coin(t.p)}</span><span>დაგირავება ${coin(t.p / 2)}</span></p>`;
    } else if (t.k === 'util') {
      head = `<div class="deed-h util" style="background-image:linear-gradient(180deg,rgba(13,16,22,.1),rgba(13,16,22,.85)),url(${ART('g_elbrus')})"><span class="chip">მეურნეობა</span><h2>${esc(t.n)}</h2></div>`;
      const n = o ? Engine.countOf(st, o.o, UTILS) : 0;
      rows = `<ul class="rents"><li class="${n === 1 ? 'on' : ''}"><span class="ph"></span><span>ერთი გაქვს: კამათლის ჯამი ×4</span></li><li class="${n === 2 ? 'on' : ''}"><span class="ph"></span><span>ორივე გაქვს: კამათლის ჯამი ×10</span></li></ul><p class="facts"><span>ფასი ${coin(t.p)}</span><span>დაგირავება ${coin(t.p / 2)}</span></p>`;
    } else {
      const about = {
        start: `აქედან იწყება გზა. ყოველ გავლაზე ხაზინა ${SALARY}-ს გაძლევს.`,
        jail: `ზინდანი. აქ თუ უბრალოდ მოხვედი, სტუმარი ხარ. დატყვევებული სამ ცდაში დუბლით გამოდის, ან ${JAIL_FINE}-ს იხდის, ან ფასკუნჯის ბუმბულს იყენებს.`,
        feast: 'სუფრა. აქ დასვენება და ქეიფია, არაფერი ხდება.',
        gojail: 'მცველი პირდაპირ ზინდანში გაგზავნის. სტარტს ვერ გაივლი.',
        tax: `${t.n}: ხაზინას უხდი ${t.a}-ს.`,
        scroll: 'ბედის გრაგნილი: ბარათი, რომელიც ხშირად გზაზე გაგზავნის.',
        chest: 'საგანძური: ბარათი, ძირითადად ფულზე.'
      }[t.k];
      return `<div class="sheet-h"><h2>${esc(t.n)}</h2><button class="x" data-close aria-label="დახურვა">×</button></div><p class="prose">${about}</p>`;
    }
    const owner = o ? `<p class="owner"><img src="${por(st.players[o.o].hero)}" alt="" style="--c:${SEAT_COLORS[o.o]}">${esc(st.players[o.o].name)}${o.m ? ' · <b class="bad">დაგირავებული</b>' : ''}</p>` : '<p class="owner free">ჯერ არავისია</p>';
    if (mine) foot = manageButtons(st, seat, i);
    return `<button class="x float-x" data-close aria-label="დახურვა">×</button>${head}<div class="deed-b">${owner}${rows}${foot}</div>`;
  }
  function manageButtons(st, seat, i) {
    const L = Engine.legal(st, seat);
    if (!L.manage) return '<p class="hint">კოშკებს და დაგირავებას შენს სვლაზე მართავ.</p>';
    const t = BOARD[i], o = st.own[i], b = [];
    if (t.k === 'p' && L.build) {
      const why = Engine.buildBlock(st, seat, i);
      if (o.lv < 5) b.push(`<button class="btn small gold" data-a="build" data-i="${i}" ${why ? 'disabled' : ''} title="${esc(ERR[why] || '')}">+ ${esc(LEVEL_NAMES[o.lv + 1])} ${coin(GROUPS[t.g].b)}</button>`);
    }
    if (t.k === 'p' && o.lv > 0) b.push(`<button class="btn small" data-a="sell" data-i="${i}" ${Engine.canSell(st, seat, i) ? '' : 'disabled'}>− კოშკი ${coin(GROUPS[t.g].b / 2)}</button>`);
    if (!o.m) b.push(`<button class="btn small" data-a="mort" data-i="${i}" ${Engine.canMort(st, seat, i) ? '' : 'disabled'}>დაგირავება ${coin(t.p / 2)}</button>`);
    else if (L.build) b.push(`<button class="btn small" data-a="unmort" data-i="${i}" ${st.players[seat].cash >= Engine.unmortCost(i) ? '' : 'disabled'}>გამოსყიდვა ${coin(Engine.unmortCost(i))}</button>`);
    const why = t.k === 'p' && o.lv < 5 ? Engine.buildBlock(st, seat, i) : '';
    return `<div class="manage">${b.join('')}</div>${why && why !== 'cash' && L.build ? `<p class="hint">${esc(ERR[why] || '')}</p>` : ''}`;
  }

  // a player's things
  function holdings(st, s) {
    const rows = [];
    GROUPS.forEach((g, gi) => {
      const ts = GROUP_TILES[gi].filter(i => st.own[i] && st.own[i].o === s);
      if (ts.length) rows.push({ c: g.c, n: g.n, ts, full: Engine.groupOwner(st, gi) === s });
    });
    const rs = ROADS.filter(i => st.own[i] && st.own[i].o === s), us = UTILS.filter(i => st.own[i] && st.own[i].o === s);
    if (rs.length) rows.push({ c: '#8a6a4f', n: 'ქარვასლები', ts: rs });
    if (us.length) rows.push({ c: '#7a4a2a', n: 'მეურნეობა', ts: us });
    return rows;
  }
  function player(st) {
    const s = arg, p = st.players[s];
    if (!p) return null;
    const rows = holdings(st, s);
    const list = rows.length ? rows.map(r => `<div class="hold"><h4 style="--g:${r.c}">${esc(r.n)}${r.full ? ' <span class="tag">მთელი</span>' : ''}</h4>${r.ts.map(i => tileRow(st, i)).join('')}</div>`).join('') : '<p class="prose">ჯერ არაფერი აქვს.</p>';
    return `<div class="sheet-h"><img class="sh-por" src="${por(p.hero)}" alt="" style="--c:${SEAT_COLORS[s]}"><div><h2>${esc(p.name)}</h2><small>${esc(HEROES[p.hero].n)}</small></div><button class="x" data-close aria-label="დახურვა">×</button></div>
      <p class="facts"><span>ფული ${coin(p.cash)}</span><span>ქონება ${coin(Engine.worth(st, s))}</span>${p.fe.length ? `<span>ბუმბული ${p.fe.length}</span>` : ''}</p>${list}`;
  }
  function tileRow(st, i, actions) {
    const o = st.own[i], t = BOARD[i];
    const lv = o && o.lv ? `<span class="lvi" title="${esc(LEVEL_NAMES[o.lv])}">${lvIcons(o.lv)}</span>` : '';
    const rent = Engine.rentAt(st, i, 7);
    return `<div class="trow${o && o.m ? ' mort' : ''}"><button class="tlink" data-deed="${i}" style="--g:${t.k === 'p' ? GROUPS[t.g].c : '#8a6a4f'}">${esc(t.n)}</button>${lv}<span class="tr-r">${o && o.m ? '<b class="bad">დაგირავებული</b>' : t.k === 'util' ? '×' + UTIL_MULT[Engine.countOf(st, o.o, UTILS)] : 'ქირა ' + coin(rent)}</span>${actions || ''}</div>`;
  }

  // managing your own things: towers up and down, pawning
  function estate(st) {
    const s = View.mySeat(), p = st.players[s];
    if (!p) return null;
    const L = Engine.legal(st, s), rows = holdings(st, s);
    const debt = st.phase === 'debt' && st.turn === s ? `<div class="debtbar">ვალი ${coin(st.pend.a)} · გაქვს ${coin(p.cash)} <button class="btn small gold" data-a="pay" ${p.cash >= st.pend.a ? '' : 'disabled'}>გადაიხადე</button></div>` : '';
    const note = L.manage ? '' : '<p class="hint">კოშკების აშენება და დაგირავება შენს სვლაზეა.</p>';
    const list = rows.length ? rows.map(r => `<div class="hold"><h4 style="--g:${r.c}">${esc(r.n)}${r.full ? ' <span class="tag">მთელი</span>' : ''}</h4>${r.ts.map(i => tileRow(st, i, L.manage ? rowActions(st, s, i, L) : '')).join('')}</div>`).join('') : '<p class="prose">ჯერ არაფერი გაქვს. იყიდე ქალაქი, რომელზეც დადგები.</p>';
    return `<div class="sheet-h"><h2>მამული</h2><span class="sh-cash">${coin(p.cash)}</span><button class="x" data-close aria-label="დახურვა">×</button></div>${debt}${note}${list}`;
  }
  function rowActions(st, s, i, L) {
    const t = BOARD[i], o = st.own[i], b = [];
    if (t.k === 'p' && L.build && Engine.groupOwner(st, t.g) === s && o.lv < 5) b.push(`<button class="ib gold" data-a="build" data-i="${i}" ${Engine.buildBlock(st, s, i) ? 'disabled' : ''} aria-label="კოშკის აშენება" title="აშენება ${GROUPS[t.g].b}">+</button>`);
    if (t.k === 'p' && o.lv > 0) b.push(`<button class="ib" data-a="sell" data-i="${i}" ${Engine.canSell(st, s, i) ? '' : 'disabled'} aria-label="კოშკის გაყიდვა" title="გაყიდვა ${GROUPS[t.g].b / 2}">−</button>`);
    if (!o.m) b.push(`<button class="ib" data-a="mort" data-i="${i}" ${Engine.canMort(st, s, i) ? '' : 'disabled'} title="დაგირავება ${t.p / 2}">დაგირ.</button>`);
    else if (L.build) b.push(`<button class="ib" data-a="unmort" data-i="${i}" ${st.players[s].cash >= Engine.unmortCost(i) ? '' : 'disabled'} title="გამოსყიდვა ${Engine.unmortCost(i)}">გამოსყ.</button>`);
    return `<span class="ibs">${b.join('')}</span>`;
  }

  // putting up towers, region by region (they go up evenly; the game picks the town)
  function build(st) {
    const s = View.mySeat(), p = st.players[s];
    if (!p) return null;
    const L = Engine.legal(st, s);
    const full = GROUPS.map((g, gi) => gi).filter(gi => Engine.groupOwner(st, gi) === s);
    const head = `<div class="sheet-h"><h2>კოშკები</h2><span class="sh-cash">${coin(p.cash)}</span><button class="x" data-close aria-label="დახურვა">×</button></div>`;
    if (!full.length) {
      const near = GROUPS.map((g, gi) => ({ g, gi, have: GROUP_TILES[gi].filter(i => st.own[i] && st.own[i].o === s) })).filter(x => x.have.length).sort((a, b) => (b.have.length / GROUP_TILES[b.gi].length) - (a.have.length / GROUP_TILES[a.gi].length));
      return `${head}<p class="prose">კოშკების ასაშენებლად ერთი კუთხის ყველა ქალაქი უნდა გქონდეს.</p>${near.map(x => `<div class="breg" style="--g:${x.g.c}"><h4>${esc(x.g.n)} <small>${x.have.length} / ${GROUP_TILES[x.gi].length}</small></h4><p class="hint">აკლია: ${GROUP_TILES[x.gi].filter(i => !x.have.includes(i)).map(i => esc(tName(i))).join(', ')}</p></div>`).join('') || '<p class="hint">ჯერ ქალაქი არ გაქვს.</p>'}`;
    }
    const rows = full.map(gi => {
      const g = GROUPS[gi], up = nextBuild(st, s, gi), down = nextSell(st, s, gi), mort = GROUP_TILES[gi].some(i => st.own[i].m);
      const towns = GROUP_TILES[gi].map(i => `<span class="btown"><b>${esc(tName(i))}</b><span class="lvi">${st.own[i].lv ? lvIcons(st.own[i].lv) : '<small>ცარიელი</small>'}</span><small>ქირა ${coin(Engine.rentAt(st, i, 7))}</small></span>`).join('');
      const why = mort ? 'ჯერ დაგირავებული ქალაქი გამოისყიდე' : up == null && GROUP_TILES[gi].every(i => st.own[i].lv >= 5) ? 'ყველგან ციხე-სიმაგრეა' : up == null ? 'ფული არ გყოფნის' : '';
      return `<div class="breg" style="--g:${g.c}"><h4>${esc(g.n)}</h4><div class="btowns">${towns}</div>
        <div class="row">${L.build ? `<button class="btn gold" data-a="build" data-g="${gi}" ${up != null ? '' : 'disabled'}>+ კოშკი ${coin(g.b)}</button>${down != null ? `<button class="btn" data-a="sell" data-g="${gi}">− გაყიდვა ${coin(g.b / 2)}</button>` : ''}` : '<p class="hint">აშენება შენს სვლაზეა.</p>'}</div>
        ${why && L.build ? `<p class="hint">${why}</p>` : ''}</div>`;
    }).join('');
    return `${head}<p class="hint">კოშკები კუთხის ქალაქებში თანაბრად დგება. ოთხი კოშკის მერე ციხე-სიმაგრე შენდება.</p>${rows}`;
  }

  // making an offer
  const tradeable = (st, s) => st.own.map((o, i) => o && o.o === s && (BOARD[i].k !== 'p' || GROUP_TILES[BOARD[i].g].every(j => !st.own[j] || !st.own[j].lv)) ? i : -1).filter(i => i >= 0);
  function trade(st) {
    const s = View.mySeat(), L = Engine.legal(st, s);
    if (!L.trade) return `<div class="sheet-h"><h2>ვაჭრობა</h2><button class="x" data-close aria-label="დახურვა">×</button></div><p class="prose">შეთავაზებას შენს სვლაზე აკეთებ, სანამ ყიდვას ან ვალს ელოდება.</p>`;
    const others = Engine.activeSeats(st).filter(x => x !== s);
    if (!draft || !others.includes(draft.to)) draft = { to: others[0], give: { p: [], c: 0, f: 0 }, get: { p: [], c: 0, f: 0 } };
    const d = draft, me = st.players[s], them = st.players[d.to];
    const side = (seat, x, key) => {
      const tl = tradeable(st, seat), pl = st.players[seat];
      const items = tl.length ? tl.map(i => `<button class="pick${x.p.includes(i) ? ' on' : ''}" data-pick="${key}" data-i="${i}" style="--g:${BOARD[i].k === 'p' ? GROUPS[BOARD[i].g].c : '#8a6a4f'}">${esc(BOARD[i].n)}<small>${BOARD[i].p}${st.own[i].m ? ' · დაგირ.' : ''}</small></button>`).join('') : '<p class="hint">გასაცვლელი ქონება არ აქვს</p>';
      return `<div class="tside"><h4>${key === 'give' ? 'შენ აძლევ' : 'შენ ითხოვ'}</h4><div class="picks">${items}</div>
        <div class="money"><span>ფული</span><button class="ib" data-cash="${key}" data-d="-50">−50</button><button class="ib" data-cash="${key}" data-d="-10">−10</button><b>${fmt(x.c)}</b><button class="ib" data-cash="${key}" data-d="10">+10</button><button class="ib" data-cash="${key}" data-d="50">+50</button><small>მაქს. ${fmt(pl.cash)}</small></div>
        ${pl.fe.length ? `<div class="money"><span>ბუმბული</span><button class="ib" data-fe="${key}" data-d="-1">−</button><b>${x.f}</b><button class="ib" data-fe="${key}" data-d="1">+</button><small>აქვს ${pl.fe.length}</small></div>` : ''}</div>`;
    };
    const tabs = others.map(x => `<button class="who${x === d.to ? ' on' : ''}" data-to="${x}" style="--c:${SEAT_COLORS[x]}"><img src="${por(st.players[x].hero)}" alt="">${esc(st.players[x].name)}</button>`).join('');
    const why = Engine.tradeBlock(st, { from: s, to: d.to, give: d.give, get: d.get });
    return `<div class="sheet-h"><h2>ვაჭრობა</h2><button class="x" data-close aria-label="დახურვა">×</button></div>
      <div class="whos">${tabs}</div>
      <div class="tsides">${side(s, d.give, 'give')}${side(d.to, d.get, 'get')}</div>
      <p class="hint">კოშკებიან კუთხეს ვერ გაცვლი: ჯერ კოშკები გაყიდე. ${them.bot ? 'ბოტი მხოლოდ მომგებიან გარიგებას ეთანხმება.' : ''}</p>
      <button class="btn gold wide" data-offer ${why ? 'disabled' : ''}>შეთავაზება: ${esc(them.name)}</button>`;
  }
  function tradeClick(ev) {
    const st = View.st, s = View.mySeat();
    const to = ev.target.closest('[data-to]'), pick = ev.target.closest('[data-pick]'), cash = ev.target.closest('[data-cash]'), fe = ev.target.closest('[data-fe]');
    if (to) { draft = { to: +to.dataset.to, give: { p: [], c: 0, f: 0 }, get: { p: [], c: 0, f: 0 } }; draw(); return true; }
    if (pick) { const x = draft[pick.dataset.pick], i = +pick.dataset.i; x.p = x.p.includes(i) ? x.p.filter(j => j !== i) : x.p.concat(i); draw(); return true; }
    if (cash) { const key = cash.dataset.cash, x = draft[key], max = st.players[key === 'give' ? s : draft.to].cash; x.c = Math.max(0, Math.min(max, x.c + +cash.dataset.d)); draw(); return true; }
    if (fe) { const key = fe.dataset.fe, x = draft[key], max = st.players[key === 'give' ? s : draft.to].fe.length; x.f = Math.max(0, Math.min(max, x.f + +fe.dataset.d)); draw(); return true; }
    if (ev.target.closest('[data-offer]')) { move({ t: 'offer', to: draft.to, give: draft.give, get: draft.get, seat: s }); close(); return true; }
    return false;
  }
  // an offer to this device's player
  function offer(st) {
    const tr = st.trade;
    if (!tr || !View.controls(tr.to)) return null;
    const from = st.players[tr.from];
    const list = x => [...x.p.map(i => `<span class="pick on static" style="--g:${BOARD[i].k === 'p' ? GROUPS[BOARD[i].g].c : '#8a6a4f'}">${esc(BOARD[i].n)}<small>${BOARD[i].p}${st.own[i] && st.own[i].m ? ' · დაგირ.' : ''}</small></span>`), x.c ? `<span class="pick static money-p">${coin(x.c)}</span>` : '', x.f ? `<span class="pick static">ბუმბული ×${x.f}</span>` : ''].join('') || '<span class="hint">არაფერი</span>';
    return `<div class="sheet-h"><img class="sh-por" src="${por(from.hero)}" alt="" style="--c:${SEAT_COLORS[tr.from]}"><div><h2>${esc(from.name)} გთავაზობს</h2><small>${esc(st.players[tr.to].name)}, შენ წყვეტ</small></div></div>
      <div class="tsides"><div class="tside"><h4>შენ მიიღებ</h4><div class="picks">${list(tr.give)}</div></div><div class="tside"><h4>შენ მისცემ</h4><div class="picks">${list(tr.get)}</div></div></div>
      <div class="row"><button class="btn gold" data-a="accept" data-seat="${tr.to}">თანხმობა</button><button class="btn" data-a="decline" data-seat="${tr.to}">უარი</button></div>`;
  }
  function log(st) {
    const lines = st.ev.map(e => evText(st, e)).filter(Boolean).reverse().slice(0, 70);
    return `<div class="sheet-h"><h2>ჟურნალი</h2><button class="x" data-close aria-label="დახურვა">×</button></div><ol class="log">${lines.map(l => `<li>${l}</li>`).join('')}</ol>`;
  }
  function menu(st) {
    const host = ROOM && (ROOM.role === 'local' || (st && st.host === ROOM.me));
    const code = ROOM && ROOM.mode === 'online' ? `<p class="facts"><span>ოთახი <b class="code">${esc(ROOM.code)}</b></span><span>${ROOM.up ? 'კავშირი წესრიგშია' : '<b class="bad">კავშირი გაწყდა, ვცდილობ აღდგენას</b>'}</span><button class="btn small" data-invite>მოწვევა</button></p>
      <p class="hint">ვინც თამაშიდან გავარდა, ამ ბმულით იმავე ტელეფონიდან თავის ადგილს დაუბრუნდება.</p>` : '';
    return `<div class="sheet-h"><h2>მენიუ</h2><button class="x" data-close aria-label="დახურვა">×</button></div>${code}
      <div class="menu-list">
        <button class="btn wide" data-sheet="rules">წესები</button>
        <button class="btn wide" data-sound>ხმა: ${Sound.on ? 'ჩართული' : 'გამორთული'}</button>
        ${host && st && st.phase !== 'over' ? '<button class="btn wide" data-confirm="stop">თამაშის დასრულება ახლავე</button>' : ''}
        <button class="btn wide danger" data-confirm="leave">${ROOM && ROOM.mode === 'online' ? 'ოთახიდან გასვლა' : 'მთავარ მენიუში გასვლა'}</button>
      </div><div id="confirm"></div>`;
  }
  function bankruptSheet(st) {
    const s = st.turn;
    if (st.phase !== 'debt' || !View.controls(s)) return null;
    return `<div class="sheet-h"><h2>გაკოტრება</h2><button class="x" data-close aria-label="დახურვა">×</button></div>
      <p class="prose">${st.pend.to >= 0 ? `მთელ შენს ქონებას და ფულს მიიღებს ${esc(pName(st, st.pend.to))}.` : 'შენი ქალაქები ისევ თავისუფალი გახდება.'} თამაშს ვეღარ გააგრძელებ, მაგრამ ყურებას შეძლებ.</p>
      <div class="row"><button class="btn danger" data-a="bankrupt">გავკოტრდი</button><button class="btn" data-close>ჯერ ვიფიქრებ</button></div>`;
  }
  function over(st) {
    if (st.phase !== 'over') return null;
    const order = Engine.ranking(st), w = st.players[st.winner];
    const host = ROOM && (ROOM.role === 'local' || st.host === ROOM.me);
    return `<div class="over-h">${w ? `<img src="${por(w.hero)}" alt="" style="--c:${SEAT_COLORS[st.winner]}"><h2>${esc(w.name)} გაიმარჯვა</h2>` : '<h2>თამაში დასრულდა</h2>'}</div>
      <ol class="rank">${order.map((s, k) => { const p = st.players[s]; return `<li><span class="rk">${k + 1}</span><img src="${por(p.hero)}" alt="" style="--c:${SEAT_COLORS[s]}"><span class="rn">${esc(p.name)}</span><span class="rv">${p.out ? 'გაკოტრდა' : coin(Engine.worth(st, s))}</span></li>`; }).join('')}</ol>
      <div class="row">${host ? '<button class="btn gold" data-again>ახალი თამაში</button>' : ''}<button class="btn" data-confirm-now="leave">მენიუ</button></div>`;
  }
  function rules() {
    return `<div class="sheet-h"><h2>წესები</h2><button class="x" data-close aria-label="დახურვა">×</button></div><div class="prose rules">
      <ol class="steps">
        <li><b>გააგორე კამათელი</b> და ფიგურა თავისით წავა. სტარტის გავლაზე ${SALARY} გეძლევა.</li>
        <li><b>იყიდე ქალაქი,</b> რომელზეც დადექი. სხვის ქალაქზე ქირას იხდი, თამაში თვითონ გადაიხდის.</li>
        <li><b>შეაგროვე მთელი კუთხე</b> (ერთი ფერის ქალაქები): ქირა გაორმაგდება და შეგიძლია <b>კოშკები</b> ააშენო. ოთხი კოშკის მერე ციხე-სიმაგრე დგება, ქირა ყველაზე დიდია.</li>
        <li><b>ვინც გაკოტრდება,</b> თამაშიდან გადის. იგებს ბოლო დარჩენილი ან, რაუნდების ლიმიტზე, ყველაზე მდიდარი.</li>
      </ol>
      <p><b>ბედის გრაგნილი და საგანძური:</b> ბარათი, რომელიც ფულს გაძლევს ან გართმევს, ან გზაზე გაგზავნის. <b>ფასკუნჯის ბუმბული</b> ზინდანიდან გამოგიყვანს.</p>
      <p><b>ზინდანი:</b> „ზინდანში!" უჯრა, ბარათი ან სამი დუბლი ზედიზედ. გამოსვლა: დუბლი სამ ცდაში, ${JAIL_FINE}-ის გადახდა ან ბუმბული.</p>
      <p><b>ქარვასლები</b> ქირას იღებენ იმის მიხედვით, რამდენი გაქვს (25, 50, 100, 200). <b>წისქვილი და მარანი:</b> კამათლის ჯამი ×4, ორივე თუ გაქვს ×10.</p>
      <p><b>ვალი:</b> ფული თუ არ გყოფნის, „ვალის დაფარვა" კოშკებს გაყიდის და ქალაქებს დააგირავებს. <b>ვაჭრობა:</b> შენს სვლაზე შესთავაზე ნებისმიერ მოთამაშეს ქალაქების და ფულის გაცვლა.</p></div>`;
  }

  // how to put the game on the home screen where the browser does not ask by itself
  function install() {
    const ua = navigator.userAgent, where = /CriOS|FxiOS|EdgiOS/.test(ua) ? 'მისამართის ზოლშია, მარჯვნივ' : /iPad/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1) ? 'ზედა ზოლშია' : 'ქვედა ზოლშია';
    const steps = {
      ios: [`დააჭირე <b>„გაზიარება"</b> ღილაკს ${SHARE_SVG} (${where})`,
        'ჩამოსქროლე და აირჩიე <b class="en">Add to Home Screen</b> („მთავარ ეკრანზე დამატება")',
        'გახსენი „მამული" მთავარი ეკრანიდან: აპივით გაიხსნება, ბრაუზერის ზოლების გარეშე.'],
      mac: ['Safari-ს ზედა მენიუში აირჩიე <b class="en">File → Add to Dock…</b>',
        '„მამული" Dock-ში გამოჩნდება და ცალკე ფანჯარაში გაიხსნება.'],
      firefox: ['გახსენი ბრაუზერის მენიუ <b>⋮</b>', 'აირჩიე <b class="en">Install</b> ან <b class="en">Add to Home screen</b>', 'გახსენი „მამული" მთავარი ეკრანიდან.']
    }[arg] || [];
    return `<div class="sheet-h"><h2>დაინსტალირება</h2><button class="x" data-close aria-label="დახურვა">×</button></div>
      <div class="prose"><ol class="steps">${steps.map(t => `<li>${t}</li>`).join('')}</ol>
      <p>ცალკე ჩამოტვირთვა არ სჭირდება: ახალი ვერსია თავისით მოვა, ბოტებთან კი ინტერნეტის გარეშეც ითამაშებ.</p></div>
      <button class="btn gold wide" data-close>გასაგებია</button>`;
  }

  function onClick(ev) {
    const st = View.st;
    if (ev.target === box()) return close();
    if (ev.target.closest('[data-close]')) return close();
    if (kind === 'trade' && tradeClick(ev)) return;
    const a = ev.target.closest('[data-a]');
    if (a && !a.disabled) {
      const m = { t: a.dataset.a };
      if (a.dataset.i != null) m.i = +a.dataset.i;
      if (a.dataset.seat != null) m.seat = +a.dataset.seat;
      if (a.dataset.g != null) {
        const now = (ROOM && ROOM.st) || View.st, s = View.mySeat(), g = +a.dataset.g;
        m.i = m.t === 'build' ? nextBuild(now, s, g) : nextSell(now, s, g);
        if (m.i == null) return;
      }
      if (m.t === 'bankrupt' || m.t === 'accept' || m.t === 'decline') close();
      move(m);
      return;
    }
    const d = ev.target.closest('[data-deed]');
    if (d) return open('deed', +d.dataset.deed);
    const sh = ev.target.closest('[data-sheet]');
    if (sh) return open(sh.dataset.sheet);
    if (ev.target.closest('[data-sound]')) { Sound.on = !Sound.on; Sound.unlock(); return draw(); }
    if (ev.target.closest('[data-invite]')) return Lobby.invite();
    const c = ev.target.closest('[data-confirm]');
    if (c) {
      const what = c.dataset.confirm;
      $('#confirm').innerHTML = `<p class="prose">${what === 'stop' ? 'თამაში ახლავე დასრულდება და გაიმარჯვებს ის, ვისი ქონებაც ყველაზე მეტია.' : ROOM && ROOM.mode === 'online' ? 'ოთახიდან გახვალ. თამაში შენს გარეშე გაგრძელდება.' : 'თამაში შეინახება და მენიუდან გააგრძელებ.'}</p><div class="row"><button class="btn danger" data-confirm-now="${what}">დიახ</button><button class="btn" data-close>არა</button></div>`;
      return;
    }
    const cn = ev.target.closest('[data-confirm-now]');
    if (cn) {
      close();
      if (cn.dataset.confirmNow === 'stop') return move({ t: 'stop' });
      leaveRoom(false); setHash(''); UI.go('menu'); return;
    }
    if (ev.target.closest('[data-again]')) { close(); return rematch(); }
  }

  return { open, close, refresh, kind: () => kind, onClick };
})();

// the host starts a new game with the same people
function rematch() {
  if (!isHost()) return;
  const old = ROOM.st, st = Engine.newLobby(old.host);
  st.term = old.term; st.seq = old.seq; st.cfg = old.cfg;
  st.players = old.players.filter(p => p.bot || !p.away || ROOM.role === 'local').map(p => ({ pid: p.pid, name: p.name, hero: p.hero, bot: p.bot, cash: START_CASH, pos: 0, jail: false, jt: 0, fe: [], out: false, outAt: 0, dbl: 0, away: false }));
  ROOM.st = st;
  UI.go('lobby');
  commit();
}

// ===== screens and small messages =====
const UI = (() => {
  let screen = '';
  function go(s) {
    if (s === screen) return;
    screen = s;
    $$('.screen').forEach(el => { el.hidden = el.id !== 'scr-' + s; });
    if (s !== 'game') Sheet.close();
    if (s === 'menu') Menu.render();
    if (s === 'game') { requestAnimationFrame(() => View.fit()); }
  }
  function toast(msg, ms, kind) {
    const box = $('#toasts');
    if (!box) return;
    const t = document.createElement('div');
    t.className = 'toast ' + (kind || '');
    t.innerHTML = msg;
    box.appendChild(t);
    while (box.children.length > 3) box.firstChild.remove();
    setTimeout(() => { t.classList.add('bye'); setTimeout(() => t.remove(), 400); }, ms || 2600);
  }
  function moveRefused(code) {
    View.busy(false);
    if (View.st) View.render();
    if (code && code !== 'turn' && ERR[code]) { toast(ERR[code], 2600, 'bad'); Sound.bad(); }    // 'turn': a button pressed twice
  }
  return { go, toast, moveRefused, get screen() { return screen; } };
})();

// ===== the menu, the room's lobby, and starting up =====

const PROFILE = (() => {
  const p = store.get('profile') || {};
  return { hero: HEROES[p.hero] ? p.hero : 'david', name: Engine.cleanName(p.name || '') };
})();
const saveProfile = () => store.set('profile', PROFILE);
const myName = () => PROFILE.name || HEROES[PROFILE.hero].s;

// ----- the first screen -----
const Menu = (() => {
  function render() {
    const pick = $('#heroPick');
    pick.innerHTML = HERO_KEYS.map(h => `<button class="hero${h === PROFILE.hero ? ' on' : ''}" data-hero="${h}" aria-label="${esc(HEROES[h].n)}" aria-pressed="${h === PROFILE.hero}"><img src="${por(h)}" alt=""></button>`).join('');
    $('#heroName').textContent = HEROES[PROFILE.hero].n;
    $('#heroFig').src = ART(PROFILE.hero === 'david' ? 'h_davidride' : 'h_' + PROFILE.hero);
    const nameIn = $('#nameIn');
    if (document.activeElement !== nameIn) nameIn.value = PROFILE.name;
    nameIn.placeholder = HEROES[PROFILE.hero].s;
    const saved = store.get('local');
    $('#bResume').hidden = !(saved && saved.st && saved.st.phase !== 'lobby' && saved.st.phase !== 'over');
    $('#onlineBox').hidden = !SITE;
    $('#onlineNote').hidden = SITE;
    $('#bLocal').classList.toggle('gold', !SITE);          // without online rooms this is the way to play
    $('#bLocal').classList.toggle('big', !SITE);
    Install.render();
  }
  function onClick(ev) {
    Sound.unlock();
    const h = ev.target.closest('[data-hero]');
    if (h) { PROFILE.hero = h.dataset.hero; saveProfile(); render(); return; }
    const id = ev.target.closest('button') && ev.target.closest('button').id;
    if (id === 'bHost') { PROFILE.name = Engine.cleanName($('#nameIn').value); saveProfile(); hostRoom(); }
    else if (id === 'bJoin') { PROFILE.name = Engine.cleanName($('#nameIn').value); saveProfile(); joinRoom($('#codeIn').value); }
    else if (id === 'bLocal') { PROFILE.name = Engine.cleanName($('#nameIn').value); saveProfile(); playLocal(false); }
    else if (id === 'bResume') playLocal(true);
    else if (id === 'bInstall') Install.go();
    else if (id === 'bRules') { Sheet.open('rules'); }
  }
  return { render, onClick };
})();

// ----- putting the game on the home screen, like an app (as მეტეხი does) -----
// Chrome, Edge and Samsung's browser ask the question themselves when the button is pressed; an iPhone or iPad, Safari on
// a Mac and Firefox on Android have no such question, so the button shows the few taps it takes there.
const Install = (() => {
  let ask = null;
  const ua = navigator.userAgent;
  const standalone = () => { try { return matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches || navigator.standalone === true; } catch (e) { return false; } };
  const top = () => { try { return window.top === window; } catch (e) { return false; } };
  const ios = () => /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  const macSafari = () => /Macintosh/.test(ua) && !(navigator.maxTouchPoints > 1) && /Version\/\d+.*Safari\//.test(ua) && !/Chrome|Chromium|Edg|OPR|Firefox/.test(ua);
  const firefoxAndroid = () => /Android/.test(ua) && /Firefox\//.test(ua);
  // how this browser installs the game ('' = it cannot, or it already is installed)
  function how() {
    if (!SITE || !top() || standalone()) return '';
    if (ask) return 'ask';
    if (ios()) return 'ios';
    if (macSafari()) return 'mac';
    if (firefoxAndroid()) return 'firefox';
    return '';
  }
  function render() { const b = $('#installBox'); if (b) b.hidden = !how(); }
  function go() {
    const h = how();
    if (h === 'ask') {
      const a = ask; ask = null;
      try { a.prompt(); a.userChoice.then(c => { if (c && c.outcome !== 'accepted') ask = null; render(); }, render); } catch (e) { render(); }
      return;
    }
    if (h) Sheet.open('install', h);
  }
  addEventListener('beforeinstallprompt', e => { e.preventDefault(); ask = e; render(); });
  addEventListener('appinstalled', () => { ask = null; render(); UI.toast('მამული დაინსტალირდა: გახსენი მთავარი ეკრანიდან', 3200, 'good'); });
  return { render, go, how };
})();
// the offline helper: the game opens without a connection too (and the browser offers to install it)
function offlineHelper() {
  if (!SITE || !('serviceWorker' in navigator) || !(location.protocol === 'https:' || location.hostname === 'localhost')) return;
  const go = () => navigator.serviceWorker.register('sw.js').then(r => setTimeout(() => {
    const w = r.active || r.waiting || r.installing;
    if (w) w.postMessage('keep-all');                     // all the pictures, once the page has what it needs
  }, 12000)).catch(() => { });
  if (document.readyState === 'complete') go(); else addEventListener('load', go);
}

// ----- the lobby: who is in, which hero, how long, start -----
const Lobby = (() => {
  let sel = -1;                                 // on a shared device: whose hero is being chosen
  function render(st) {
    if (!st || UI.screen !== 'lobby') { if (st && st.phase === 'lobby') UI.go('lobby'); else return; }
    const online = ROOM && ROOM.mode === 'online', host = ROOM && (ROOM.role === 'local' || st.host === ROOM.me);
    const mine = s => ROOM && (ROOM.role === 'local' ? !st.players[s].bot : st.players[s].pid === ROOM.me);
    if (sel < 0 || !st.players[sel] || !mine(sel)) sel = st.players.findIndex((p, s) => mine(s));
    $('#lobbyTitle').textContent = online ? 'ოთახი' : 'თამაში ამ მოწყობილობაზე';
    const codeBox = $('#codeBox');
    codeBox.hidden = !online;
    if (online) {
      $('#roomCode').textContent = ROOM.code || '····';
      const here = Object.keys(ROOM.peers || {}).length;
      $('#roomState').textContent = !ROOM.up || !st.players.length ? 'ვუკავშირდები…' : here > 1 ? `ოთახში ${here} ადამიანია` : '';
    }
    $('#seats').innerHTML = st.players.map((p, s) => {
      const tags = [p.pid === st.host && online ? '<span class="tag">მასპინძელი</span>' : '', p.bot ? '<span class="tag">ბოტი</span>' : '',
        online && p.pid === ROOM.me ? '<span class="tag me">შენ</span>' : '', online && !p.bot && p.pid !== ROOM.me && ROOM.peers && !ROOM.peers[p.pid] ? '<span class="tag warn">კავშირს ელოდება</span>' : ''].join('');
      const canKick = host ? p.pid !== st.host : p.pid === (ROOM && ROOM.me);
      return `<li class="seat${s === sel ? ' sel' : ''}" data-seat="${s}" style="--c:${SEAT_COLORS[s]}"><img src="${por(p.hero)}" alt=""><div><b>${esc(p.name)}</b><small>${esc(HEROES[p.hero].n)}</small><span class="tags">${tags}</span></div>${canKick && st.players.length > 1 ? `<button class="ib" data-kick="${s}" aria-label="მოშორება">×</button>` : ''}</li>`;
    }).join('') + (st.players.length >= MAX_PLAYERS ? '' : online
      // a free place in a room: someone is expected (a tap on it invites, like the button)
      ? `<li class="seat wait" data-invite><i></i><div><b>მეგობარს ელოდები…</b><small>გაუგზავნე კოდი ან ბმული · ${MAX_PLAYERS - st.players.length} ადგილი თავისუფალია</small></div></li>`
      : `<li class="seat empty">${MAX_PLAYERS - st.players.length} ადგილი თავისუფალია</li>`);
    // the hero of the selected seat
    const me = st.players[sel];
    $('#lobbyHeroes').innerHTML = me ? `<p class="lbl">${online ? 'შენი გმირი' : esc(me.name) + ': გმირი'}</p><div class="hero-pick">${HERO_KEYS.map(h => {
      const taken = st.players.some((p, s) => s !== sel && p.hero === h);
      return `<button class="hero${me.hero === h ? ' on' : ''}" data-lhero="${h}" ${taken ? 'disabled' : ''} aria-label="${esc(HEROES[h].n)}"><img src="${por(h)}" alt=""></button>`;
    }).join('')}</div>` : '<p class="lbl">ამ თამაშს უყურებ</p>';
    // length
    const opts = [['rounds', 20], ['rounds', 30], ['rounds', 40], ['full', 0]];
    $('#cfg').innerHTML = `<p class="lbl">თამაშის ხანგრძლივობა</p><div class="seg">${opts.map(([m, r]) => {
      const on = st.cfg.mode === m && (m === 'full' || st.cfg.rounds === r);
      return `<button class="${on ? 'on' : ''}" data-cfg="${m}:${r}" ${host ? '' : 'disabled'}>${m === 'full' ? 'ბოლომდე' : r + ' რაუნდი'}</button>`;
    }).join('')}</div><p class="hint">${st.cfg.mode === 'full' ? 'სანამ ერთი არ დარჩება.' : `${st.cfg.rounds} რაუნდის მერე იგებს ის, ვისი ფულიც და ქონებაც ერთად ყველაზე მეტია.`}</p>`;
    const full = st.players.length >= MAX_PLAYERS;
    $('#lobbyActs').innerHTML = host
      ? `<div class="row"><button class="btn" data-lob="addbot" ${full ? 'disabled' : ''}>+ ბოტი</button>${ROOM.role === 'local' ? `<button class="btn" data-lob="addlocal" ${full ? 'disabled' : ''}>+ მოთამაშე</button>` : ''}</div>
         <button class="btn gold wide big" data-lob="start" ${st.players.length < 2 ? 'disabled' : ''}>დაწყება</button>${st.players.length < 2 ? '<p class="hint">დაამატე ბოტი ან დაელოდე მეგობრებს.</p>' : ''}`
      : `<p class="waiting">მასპინძელი თამაშს დაიწყებს, როცა ყველა შემოვა.</p>`;
  }
  // the room is being reached (or made): its code is known already, the rest is not
  function connecting() {
    if (!ROOM || UI.screen !== 'lobby') return;
    $('#lobbyTitle').textContent = 'ოთახი';
    $('#codeBox').hidden = false;
    $('#roomCode').textContent = ROOM.code || '····';
    $('#roomState').textContent = 'ვუკავშირდები…';
    $('#seats').innerHTML = `<li class="seat wait"><i></i><div><b>ვუკავშირდები…</b><small>${ROOM.role === 'host' ? 'ოთახი იქმნება' : 'ოთახს ვეძებ'}</small></div></li>`;
    $('#lobbyHeroes').innerHTML = $('#cfg').innerHTML = $('#lobbyActs').innerHTML = '';
  }
  function onClick(ev) {
    Sound.unlock();
    const bid = ev.target.closest('button') && ev.target.closest('button').id;
    if (bid === 'bLeave') { leaveRoom(false); setHash(''); UI.go('menu'); return; }
    if (ev.target.closest('#bInvite, [data-invite]')) { invite(); return; }
    const st = View.st || (ROOM && ROOM.st);
    if (!st || !ROOM) return;
    const seat = ev.target.closest('[data-seat]'), kick = ev.target.closest('[data-kick]'), hero = ev.target.closest('[data-lhero]');
    const cfg = ev.target.closest('[data-cfg]'), lob = ev.target.closest('[data-lob]');
    if (kick) { const s = +kick.dataset.kick; move(st.players[s].pid === ROOM.me && ROOM.role !== 'local' ? { t: 'leave' } : { t: 'kick', s }); return; }
    if (hero && !hero.disabled) {
      if (ROOM.role !== 'local') { PROFILE.hero = hero.dataset.lhero; saveProfile(); }
      move({ t: 'hero', h: hero.dataset.lhero, seat: sel });
      return;
    }
    if (seat && ROOM.role === 'local' && !st.players[+seat.dataset.seat].bot) { sel = +seat.dataset.seat; render(st); return; }
    if (cfg && !cfg.disabled) { const [mode, r] = cfg.dataset.cfg.split(':'); move({ t: 'cfg', mode, rounds: +r || st.cfg.rounds }); return; }
    if (lob && !lob.disabled) {
      if (lob.dataset.lob === 'start') { move({ t: 'start' }); return; }
      move({ t: lob.dataset.lob });
      return;
    }
  }
  // the room's link, the way მეტეხი does it: the phone's share sheet, or (on a computer) copied for pasting anywhere
  function invite() {
    if (!ROOM || !ROOM.code) return;
    const url = roomLink(ROOM.code), text = `ერთად ვითამაშოთ მამული! ოთახის კოდი: ${ROOM.code}`;
    if (navigator.share && TOUCH) { navigator.share({ title: 'მამული', text, url }).catch(() => { }); return; }
    const done = () => UI.toast(`ბმული დაკოპირდა · კოდი ${esc(ROOM.code)}`, 2400, 'good');
    const show = () => UI.toast(esc(url), 5000);
    try { if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(url).then(done, show); return; } } catch (e) { }
    show();
  }
  return { render, onClick, invite, connecting };
})();
const TOUCH = (() => { try { return matchMedia('(pointer: coarse)').matches; } catch (e) { return 'ontouchstart' in window; } })();
// the invitation link: this page's address with the room in it (a forced test identity is not passed on)
function roomLink(code) {
  try { const u = new URL(location.href); u.hash = ''; u.searchParams.delete('pid'); return u.href.replace(/#$/, '') + '#join=' + code; }
  catch (e) { return location.href.split('#')[0] + '#join=' + code; }
}
// a room code in a link (…#join=ABCD, or the older …#ABCD), or in pasted text
function codeFrom(text) {
  const m = /join=([A-Za-z0-9]{4})(?![A-Za-z0-9])/.exec(text || '') || /^#?([A-Za-z0-9]{4})$/.exec((text || '').trim());
  return m ? m[1].toUpperCase() : '';
}

// ----- wiring -----
function boot() {
  $('#scr-menu').addEventListener('click', Menu.onClick);
  $('#nameIn').addEventListener('change', e => { PROFILE.name = Engine.cleanName(e.target.value); saveProfile(); });
  // the code, or a whole invitation link pasted in
  $('#codeIn').addEventListener('input', e => { const v = e.target.value; e.target.value = (codeFrom(v) || v).toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 4); });
  $('#codeIn').addEventListener('keydown', e => { if (e.key === 'Enter') $('#bJoin').click(); });
  $('#scr-lobby').addEventListener('click', Lobby.onClick);
  $('#sheet').addEventListener('click', Sheet.onClick);
  $('#scr-game').addEventListener('click', ev => {
    Sound.unlock();
    const a = ev.target.closest('#panel [data-a], #buycard [data-a]');
    if (a && !a.disabled) { const m = { t: a.dataset.a }; if (a.dataset.seat != null) m.seat = +a.dataset.seat; move(m); return; }
    if (ev.target.closest('#bView')) return View.view();
    const d = ev.target.closest('#panel [data-deed]');
    if (d) return Sheet.open('deed', +d.dataset.deed);
    const sh = ev.target.closest('#panel [data-sheet], #buycard [data-sheet]');
    if (sh) return Sheet.open(sh.dataset.sheet);
    const b = ev.target.closest('.dock button');
    if (b && !b.disabled) Sheet.open(b.dataset.open);
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') Sheet.close(); });
  document.addEventListener('pointerdown', () => Sound.unlock(), { once: true });
  UI.go('menu');
  // a friend's link: straight into their room (also when the link is opened while the game is already open)
  const fromLink = () => {
    const code = codeFrom(location.hash);
    if (!SITE || !code || (ROOM && ROOM.mode === 'online' && ROOM.code === code)) return;
    if (ROOM && ROOM.st && ROOM.st.phase !== 'lobby' && ROOM.mode === 'online') return;    // not out of a game in progress
    joinRoom(code);
  };
  fromLink();
  window.addEventListener('hashchange', fromLink);
  offlineHelper();
  // the 3D board is made in the background while the menu is on screen, so that a game starts without a stall
  setTimeout(() => Board3D.prepare($('#stage')), 400);
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
